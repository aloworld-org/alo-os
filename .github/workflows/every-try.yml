# Try alo's model on a fixed set of requests, several times each — law 9 of
# CLAUDE.md, *what the model chooses is tested many times, not once* (ADR
# 0157).
#
# `crates/alo-every-try` is the check. Each try is the agent's own loop with the
# real instructions and the real verbs, asked of the real model through the
# same road and the same schema a turn's question takes. **Nothing is carried
# out on any machine**: where the daemon would open a file or type, the check
# compares what the model asked for with the road the request expects, and
# answers from a script. The crate's header says what that cannot show.
#
# **What a change is held to** (the owner, 2026-11-17): *a change that adds or
# alters something the AI chooses is blocked from merging until its OWN
# practice requests pass at least 9 out of 10 tries. Other requests' slips
# don't block it.* A request is a change's own when the change adds it or
# alters its road; and every request is its own when the change adds, alters
# or takes away any verb as the model reads it, or alters what every turn is
# told, because every turn is shown every verb offered. That is read off two copies of one declared
# file, `crates/alo-every-try/what-the-model-is-offered.txt` — the base's and
# the change's — which a test holds to what the code offers the model
# (`the_declaration`, `its_own` and `counted` in the crate). Its own requests
# are tried ten times at each level and must each take the road at least nine
# times; every other request is tried three times and reported, not counted.
#
# **When it runs.** On every pull request and every queue branch, so that it
# can be a required check. A change whose declaration is the base's owns
# nothing: it passes in seconds, builds nothing and asks the model nothing. On
# a queue branch the model is not asked again — the pull request's own run
# measured it, and a second draw of a nine-in-ten would fail some good changes
# for nothing they did — so there it only says what changed. By hand
# (`workflow_dispatch`) it tries the whole set, or, given `against`, what this
# branch owns against that commit or branch.
#
# **What it costs**: nothing for a change that owns no request; for one that
# does, twenty tries per own request (ten at each level) and six per other
# request, each try one model call or a few. The summary says how many calls
# were made.
#
# **Whether it blocks a merge is the owner's setting**, made in the repository's
# rules, and this file does not decide it. The check it posts is `every-try`.
#
# **The key.** `ALO_WALK_PROVIDER_KEY` is the walk's secret. It is handed to the
# one step that asks the model, as `ALO_PROVIDER_KEY`, and is never echoed:
# GitHub masks it in the log, the check never prints it, and nothing it writes
# — the log, the summary — contains it. A run that must try something and has
# no secret (a fork's pull request) says so and fails.

name: Every try

on:
  pull_request:
    # And when a draft is marked ready, which by default runs nothing: a
    # draft opened before this check was required would otherwise wait for a
    # result until somebody pushed to it.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      tries:
        description: "How many times to try each request, when trying the whole set"
        type: string
        default: "5"
      only:
        description: "Try only this request (for example: write in VSCodium); empty tries the whole set"
        type: string
        default: ""
      against:
        description: "A commit or branch to compare with: try what this branch owns against it, ten times each"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: every-try-${{ github.ref }}
  cancel-in-progress: true

jobs:
  every-try:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Two commits deep: on a pull request the checkout is the merge of the
      # change into the base as it stands now, and its first parent is that
      # base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # **Which requests are this change's own**, from the declared file
      # alone, before anything is built. `mode` is `none` (nothing to try, and
      # the check passes), `own` (try the change's own) or `whole` (a hand run
      # of the whole set).
      - name: Which requests are this change's own
        id: own
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          AGAINST: ${{ inputs.against }}
        run: |
          file=crates/alo-every-try/what-the-model-is-offered.txt
          case "$EVENT" in
            # **The merge's first parent, not `pull_request.base.sha`**, which
            # is the base as it was when the pull request was last updated:
            # on 2026-11-20 it named a commit from before the declaration for
            # two pull requests whose merge already held it, and both passed
            # as "the base has no declaration" without being compared.
            pull_request) base=$(git rev-parse HEAD^1) ;;
            merge_group) base="$QUEUE_BASE" ;;
            *) base="$AGAINST" ;;
          esac
          if [ -z "$base" ]; then
            echo "mode=whole" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          base=$(git rev-parse FETCH_HEAD)
          if ! git cat-file -e "$base:$file" 2>/dev/null; then
            # Every base since #1388 has one, so a base without one is not
            # a change that owns nothing: it is a comparison that cannot be made.
            echo "The base ($base) has no declaration of what the model is offered, so which requests this change owns cannot be told, and the check does not pass." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git show "$base:$file" > "$RUNNER_TEMP/before.txt"
          if cmp -s "$RUNNER_TEMP/before.txt" "$file"; then
            echo "This change alters nothing the model is offered: $file is the base's ($base), so it owns no request and nothing was tried." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "What the model is offered changed against $base:"
            echo
            echo '```diff'
            diff "$RUNNER_TEMP/before.txt" "$file" || true
            echo '```'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = merge_group ]; then
            echo "On a queue branch the model is not asked again: the pull request's own run tried these requests." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=own" >> "$GITHUB_OUTPUT"

      # The check's own tests first, the refusal cases among them: a check
      # whose own logic is broken must not spend the key and report a verdict.
      # Among them, that the declaration is what the code offers, so the
      # requests counted as this change's own are read off a true file.
      - name: Test the check itself
        if: steps.own.outputs.mode != 'none'
        run: cargo test --release --locked -p alo-every-try

      # Its lints and its documentation, as the gate holds every crate to them,
      # so a fault in the check itself is named here in minutes.
      - name: Lint and document the check itself
        if: steps.own.outputs.mode != 'none'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --release --locked -p alo-every-try --all-targets -- -D warnings
          cargo doc --release --locked -p alo-every-try --no-deps

      - name: Build the check
        if: steps.own.outputs.mode != 'none'
        run: cargo build --release --locked -p alo-every-try

      - name: Try the requests against the real model
        if: steps.own.outputs.mode != 'none'
        env:
          ALO_PROVIDER_KEY: ${{ secrets.ALO_WALK_PROVIDER_KEY }}
          ALO_EVERY_TRY_ENDPOINT: https://api.openai.com
          ALO_EVERY_TRY_MODEL: gpt-4o-mini
          MODE: ${{ steps.own.outputs.mode }}
          WHOLE_TRIES: ${{ inputs.tries || '5' }}
          ALO_EVERY_TRY_ONLY: ${{ inputs.only || '' }}
        run: |
          if [ -z "$ALO_PROVIDER_KEY" ]; then
            echo "There is no provider key for this run (ALO_WALK_PROVIDER_KEY is not available here), so nothing was tried." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$MODE" = own ]; then
            # Its own ten times each; every other request three times,
            # reported and not counted.
            export ALO_EVERY_TRY_BEFORE="$RUNNER_TEMP/before.txt"
            export ALO_EVERY_TRY_TRIES=10
            export ALO_EVERY_TRY_OTHER_TRIES=3
            export ALO_EVERY_TRY_ONLY=
          else
            export ALO_EVERY_TRY_TRIES="$WHOLE_TRIES"
          fi
          # **Both levels**: at full access a change is done without asking; at
          # ask each time it is approved once and the turn goes on from what
          # the daemon told the person it did (docs/contracts/asking-socket.md).
          # Either failing fails the check.
          failed=0
          for level in full-access ask-each-time; do
            echo "## At $level" >> "$GITHUB_STEP_SUMMARY"
            code=0
            ALO_EVERY_TRY_LEVEL="$level" ALO_EVERY_TRY_SUMMARY="$GITHUB_STEP_SUMMARY" target/release/alo-every-try || code=$?
            if [ "$code" -ne 0 ]; then failed=$code; fi
          done
          exit "$failed"
