# Try alo's model on a fixed set of requests, several times each — law 9 of
# CLAUDE.md, *what the model chooses is tested many times, not once* (ADR
# 0157).
#
# `crates/alo-every-try` is the check. Each try is the agent's own loop with the
# real instructions and the real verbs, asked of the real model through the
# same road and the same schema a turn's question takes. **Nothing is carried
# out on any machine**: where the daemon would open a file or type, the check
# compares what the model asked for with the road the request expects, and
# answers from a script. The crate's header says what that cannot show.
#
# **What a change is held to** (the owner, 2026-11-17): *a change that adds or
# alters something the AI chooses is blocked from merging until its OWN
# practice requests pass at least 9 out of 10 tries. Other requests' slips
# don't block it.* A request is a change's own when the change adds it or
# alters its road; and every request is its own when the change adds, alters
# or takes away any verb as the model reads it, or alters what every turn is
# told, because every turn is shown every verb offered. That is read off two copies of one declared
# file, `crates/alo-every-try/what-the-model-is-offered.txt` — the base's and
# the change's — which a test holds to what the code offers the model
# (`the_declaration`, `its_own` and `counted` in the crate). Its own requests
# are tried ten times at each level and must each take the road at least nine
# times; every other request is tried three times and reported, not counted.
#
# **When it runs.** On every pull request and every queue branch, so that it
# can be a required check. A change whose declaration is the base's owns
# nothing: it passes in seconds, builds nothing and asks the model nothing. On
# a queue branch the model is not asked again — the pull request's own run
# measured it, and a second draw of a nine-in-ten would fail some good changes
# for nothing they did — so there it only says what changed. By hand
# (`workflow_dispatch`) it tries the whole set, or, given `against`, what this
# branch owns against that commit or branch.
#
# **What it costs**: nothing for a change that owns no request; for one that
# does, twenty tries per own request (ten at each level) and six per other
# request, each try one model call or a few. The summary says how many calls
# were made.
#
# **Whether it blocks a merge is the owner's setting**, made in the repository's
# rules, and this file does not decide it. The check it posts is `every-try`.
#
# **The key.** `ALO_WALK_PROVIDER_KEY` is the walk's secret. It is handed to the
# one step that asks the model, as `ALO_PROVIDER_KEY`, and is never echoed:
# GitHub masks it in the log, the check never prints it, and nothing it writes
# — the log, the summary — contains it. A run that must try something and has
# no secret (a fork's pull request) says so and fails.

name: Every try

on:
  pull_request:
    # And when a draft is marked ready, which by default runs nothing: a
    # draft opened before this check was required would otherwise wait for a
    # result until somebody pushed to it.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      tries:
        description: "How many times to try each request, when trying the whole set"
        type: string
        default: "5"
      only:
        description: "Try only this request (for example: write in VSCodium); empty tries the whole set"
        type: string
        default: ""
      against:
        description: "A commit or branch to compare with: try what this branch owns against it, ten times each"
        type: string
        default: ""

permissions:
  contents: read
  # To see which other every-try runs are asking the model (the wait below).
  actions: read

concurrency:
  group: every-try-${{ github.ref }}
  cancel-in-progress: true

jobs:
  every-try:
    runs-on: ubuntu-24.04
    # Long enough to wait its turn for the provider behind other runs.
    timeout-minutes: 240
    steps:
      # Two commits deep: on a pull request the checkout is the merge of the
      # change into the base as it stands now, and its first parent is that
      # base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # **Which requests are this change's own**, from the declared file
      # alone, before anything is built. `mode` is `none` (nothing to try, and
      # the check passes), `own` (try the change's own) or `whole` (a hand run
      # of the whole set).
      - name: Which requests are this change's own
        id: own
        env:
          EVENT: ${{ github.event_name }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          AGAINST: ${{ inputs.against }}
        run: |
          file=crates/alo-every-try/what-the-model-is-offered.txt
          case "$EVENT" in
            # **The merge's first parent, not `pull_request.base.sha`**, which
            # is the base as it was when the pull request was last updated:
            # on 2026-11-20 it named a commit from before the declaration for
            # two pull requests whose merge already held it, and both passed
            # as "the base has no declaration" without being compared.
            pull_request) base=$(git rev-parse HEAD^1) ;;
            merge_group) base="$QUEUE_BASE" ;;
            *) base="$AGAINST" ;;
          esac
          if [ -z "$base" ]; then
            echo "mode=whole" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          base=$(git rev-parse FETCH_HEAD)
          if ! git cat-file -e "$base:$file" 2>/dev/null; then
            # Every base since #1388 has one, so a base without one is not
            # a change that owns nothing: it is a comparison that cannot be made.
            echo "The base ($base) has no declaration of what the model is offered, so which requests this change owns cannot be told, and the check does not pass." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git show "$base:$file" > "$RUNNER_TEMP/before.txt"
          # **The ratchet's record** (what each request has reached), the
          # base's beside the change's. A base from before the record is an
          # empty one: nothing in it can be lowered.
          record=crates/alo-every-try/what-each-request-has-reached.txt
          git show "$base:$record" > "$RUNNER_TEMP/reached-before.txt" 2>/dev/null || : > "$RUNNER_TEMP/reached-before.txt"
          if cmp -s "$RUNNER_TEMP/before.txt" "$file" && cmp -s "$RUNNER_TEMP/reached-before.txt" "$record"; then
            echo "This change alters nothing the model is offered: $file is the base's ($base), so it owns no request and nothing was tried." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "What the model is offered changed against $base:"
            echo
            echo '```diff'
            diff "$RUNNER_TEMP/before.txt" "$file" || true
            echo '```'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = merge_group ]; then
            echo "On a queue branch the model is not asked again: the pull request's own run tried these requests." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "mode=own" >> "$GITHUB_OUTPUT"

      # The check's own tests first, the refusal cases among them: a check
      # whose own logic is broken must not spend the key and report a verdict.
      # Among them, that the declaration is what the code offers, so the
      # requests counted as this change's own are read off a true file.
      - name: Test the check itself
        if: steps.own.outputs.mode != 'none'
        run: cargo test --release --locked -p alo-every-try

      # Its lints and its documentation, as the gate holds every crate to them,
      # so a fault in the check itself is named here in minutes.
      - name: Lint and document the check itself
        if: steps.own.outputs.mode != 'none'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --release --locked -p alo-every-try --all-targets -- -D warnings
          cargo doc --release --locked -p alo-every-try --no-deps

      - name: Build the check
        if: steps.own.outputs.mode != 'none'
        run: cargo build --release --locked -p alo-every-try

      # **Which way it goes**, from the check itself: `none`, `some` (its own
      # requests, held to the bar) or `the-whole-set` (what every turn is told
      # or a verb changed: compared with its base). The ratchet first — a
      # record lowered against its base fails here, whichever way.
      - name: Which way the check goes
        id: way
        if: steps.own.outputs.mode == 'own'
        env:
          ALO_EVERY_TRY_BEFORE: ${{ runner.temp }}/before.txt
          ALO_EVERY_TRY_REACHED_BEFORE: ${{ runner.temp }}/reached-before.txt
        run: |
          way=$(target/release/alo-every-try owns)
          echo "way=$way" >> "$GITHUB_OUTPUT"
          echo "This change owns: $way." | tee -a "$GITHUB_STEP_SUMMARY"

      # **One model-asking run at a time, across the repository** (the
      # coordinator, 2026-11-20): runs at once made most tries come back
      # 429. Each run waits, in the order the runs were made, until no earlier
      # every-try run is still going. A concurrency group cannot do this: it
      # keeps one waiting run and cancels the rest, which fails their check.
      - name: Wait for the provider, one run at a time
        if: steps.own.outputs.mode == 'whole' || steps.way.outputs.way == 'some' || steps.way.outputs.way == 'the-whole-set'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            earlier=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/every-try.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID and (.status == \"in_progress\" or .status == \"queued\" or .status == \"waiting\"))] | length" || echo 0)
            if [ "$earlier" = 0 ]; then break; fi
            echo "$earlier earlier every-try run(s) still going; waiting a minute."
            sleep 60
          done

      # **What the provider allows**, read once a run from its own rate-limit
      # headers and shown, so the pace is measured rather than guessed. One
      # question of one token; the key is never printed.
      - name: Read what the provider allows
        if: steps.own.outputs.mode == 'whole' || steps.way.outputs.way == 'some' || steps.way.outputs.way == 'the-whole-set'
        env:
          ALO_PROVIDER_KEY: ${{ secrets.ALO_WALK_PROVIDER_KEY }}
        run: |
          [ -n "$ALO_PROVIDER_KEY" ] || exit 0
          curl -s -o /dev/null -D "$RUNNER_TEMP/limits.txt" https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $ALO_PROVIDER_KEY" -H "content-type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"ok"}],"max_tokens":1}' || true
          {
            echo "### What the provider allows"
            echo
            echo '```'
            grep -i '^x-ratelimit-\|^retry-after\|^HTTP/' "$RUNNER_TEMP/limits.txt" || echo "no rate-limit headers"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Try the requests against the real model
        if: steps.own.outputs.mode == 'whole' || steps.way.outputs.way == 'some'
        env:
          ALO_PROVIDER_KEY: ${{ secrets.ALO_WALK_PROVIDER_KEY }}
          ALO_EVERY_TRY_ENDPOINT: https://api.openai.com
          ALO_EVERY_TRY_MODEL: gpt-4o-mini
          MODE: ${{ steps.own.outputs.mode }}
          WHOLE_TRIES: ${{ inputs.tries || '5' }}
          BASE: ${{ steps.own.outputs.base }}
          ALO_EVERY_TRY_ONLY: ${{ inputs.only || '' }}
        run: |
          # A change that owns nothing, or only raised the record, needs no
          # key: the check answers it before asking anybody, and says so.
          if [ -z "$ALO_PROVIDER_KEY" ]; then
            echo "There is no provider key for this run (ALO_WALK_PROVIDER_KEY is not available here): anything that needs the model cannot be tried." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$MODE" = own ]; then
            # Its own as many times as the bar says (`alo_every_try::the_bar`),
            # and held to it, or to every try where the record says it once
            # took every try; every other request three times, reported and
            # not counted. What was measured is kept for `reached`.
            export ALO_EVERY_TRY_BEFORE="$RUNNER_TEMP/before.txt"
            export ALO_EVERY_TRY_REACHED_BEFORE="$RUNNER_TEMP/reached-before.txt"
            export ALO_EVERY_TRY_MEASURED="$RUNNER_TEMP/every-try-measured.txt"
            export ALO_EVERY_TRY_OTHER_TRIES=3
            export ALO_EVERY_TRY_ONLY=
          else
            export ALO_EVERY_TRY_TRIES="$WHOLE_TRIES"
            export ALO_EVERY_TRY_MEASURED="$RUNNER_TEMP/every-try-measured.txt"
          fi
          # **Both levels**: at full access a change is done without asking; at
          # ask each time it is approved once and the turn goes on from what
          # the daemon told the person it did (docs/contracts/asking-socket.md).
          # Either failing fails the check.
          failed=0
          against=0
          export ALO_EVERY_TRY_AGAINST_BASE="$RUNNER_TEMP/against-base.txt"
          for level in full-access ask-each-time; do
            echo "## At $level" >> "$GITHUB_STEP_SUMMARY"
            code=0
            set -o pipefail
            ALO_EVERY_TRY_LEVEL="$level" ALO_EVERY_TRY_SUMMARY="$GITHUB_STEP_SUMMARY" target/release/alo-every-try 2>&1 | tee "$RUNNER_TEMP/change-$level.log" || code=$?
            # 3: an own request below the bar on all its tries, to be judged
            # against its base (the coordinator, 2026-11-20).
            if [ "$code" -eq 3 ]; then against=1; elif [ "$code" -ne 0 ]; then failed=$code; fi
          done
          if [ "$against" -eq 1 ] && [ "$failed" -eq 0 ]; then
            # **An own request below the floor, compared with its base**: the
            # base's own check tries each the same number of times, and the
            # pair is judged as a whole-set change is — no clear drop, the floor
            # where the base met it, and the ratchet.
            t="$RUNNER_TEMP"
            cp target/release/alo-every-try "$t/change-check"
            git worktree add --detach "$t/base" "$BASE"
            cargo build --release --locked -p alo-every-try --manifest-path "$t/base/Cargo.toml" --target-dir target
            cp target/release/alo-every-try "$t/base-check"
            : > "$t/base-own.txt"
            while IFS=$'\t' read -r level named count; do
              ALO_EVERY_TRY_LEVEL="$level" ALO_EVERY_TRY_TRIES="$count" ALO_EVERY_TRY_ONLY="$named" \
                ALO_EVERY_TRY_BEFORE= ALO_EVERY_TRY_REACHED_BEFORE= ALO_EVERY_TRY_MEASURED="$t/base-own.txt" \
                "$t/base-check" >> "$t/base-own.log" 2>&1 || true
            done < "$t/against-base.txt"
            awk -F'\t' 'NR==FNR { want[$1 FS $2] = 1; next } ($2 FS $3) in want' \
              "$t/against-base.txt" "$ALO_EVERY_TRY_MEASURED" > "$t/change-own.txt"
            echo "### Its own requests below the bar, compared with its base" >> "$GITHUB_STEP_SUMMARY"
            failed=0
            ALO_EVERY_TRY_SUMMARY="$GITHUB_STEP_SUMMARY" "$t/change-check" compare "$t/change-own.txt" "$t/base-own.txt" || failed=$?
            # A base whose check predates counting tries not asked is read from
            # its log: any such try makes the comparison not measured.
            if grep -q "could not ask the model" "$t/base-own.log" 2>/dev/null; then
              echo "**Nothing was measured** on the base: the model could not be asked on some of its tries." | tee -a "$GITHUB_STEP_SUMMARY"
              failed=2
            fi
          elif [ "$against" -eq 1 ]; then
            echo "A request of this change's own is to be compared with its base, but another level already failed, so the base was not asked." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$failed"

      # **Compare with main** (the owner, 2026-11-20): a change that owns the
      # whole set is tried, whole, beside its base, the bar's number of times
      # at both levels, all four runs at once. A fault on those tries is a
      # flag; each flagged request is tried the confirming number of times
      # more on both sides, and the verdict is on the totals
      # (`alo_every_try::compared_with_its_base`). The summary shows both
      # rounds.
      - name: Compare with its base
        if: steps.way.outputs.way == 'the-whole-set'
        env:
          ALO_PROVIDER_KEY: ${{ secrets.ALO_WALK_PROVIDER_KEY }}
          ALO_EVERY_TRY_ENDPOINT: https://api.openai.com
          ALO_EVERY_TRY_MODEL: gpt-4o-mini
          BASE: ${{ steps.own.outputs.base }}
        run: |
          set -u
          t="$RUNNER_TEMP"
          cp target/release/alo-every-try "$t/change-check"
          git worktree add --detach "$t/base" "$BASE"
          cargo build --release --locked -p alo-every-try --manifest-path "$t/base/Cargo.toml" --target-dir target
          cp target/release/alo-every-try "$t/base-check"
          read -r tries confirming < <("$t/change-check" the-bar)
          # One side at one level: what it measured goes to its own file.
          trying() {
            side=$1; level=$2; count=$3; only=$4; round=$5
            ALO_EVERY_TRY_LEVEL="$level" ALO_EVERY_TRY_TRIES="$count" ALO_EVERY_TRY_ONLY="$only" \
              ALO_EVERY_TRY_MEASURED="$t/$side-$round-$level.txt" \
              "$t/$side-check" > "$t/$side-$round-$level.log" 2>&1 || true
          }
          for level in full-access ask-each-time; do
            trying change "$level" "$tries" "" first &
            trying base "$level" "$tries" "" first &
          done
          wait
          cat "$t"/change-first-*.txt > "$t/change.txt" 2>/dev/null || : > "$t/change.txt"
          cat "$t"/base-first-*.txt > "$t/base.txt" 2>/dev/null || : > "$t/base.txt"
          echo "### On the first $tries tries" >> "$GITHUB_STEP_SUMMARY"
          code=0
          ALO_EVERY_TRY_FLAGGED="$t/flagged.txt" ALO_EVERY_TRY_SUMMARY="$GITHUB_STEP_SUMMARY" \
            "$t/change-check" compare "$t/change.txt" "$t/base.txt" || code=$?
          if [ "$code" -eq 2 ] && [ -s "$t/flagged.txt" ]; then
            # Each flagged request again, on both sides at once.
            for side in change base; do
              (
                n=0
                while IFS=$'\t' read -r level named; do
                  n=$((n + 1))
                  trying "$side" "$level" "$confirming" "$named" "confirm$n"
                done < "$t/flagged.txt"
              ) &
            done
            wait
            cat "$t/change.txt" "$t"/change-confirm*.txt > "$t/change-all.txt" 2>/dev/null
            cat "$t/base.txt" "$t"/base-confirm*.txt > "$t/base-all.txt" 2>/dev/null
            cp "$t/change-all.txt" "$t/change.txt"
            echo "### On $((tries + confirming)) tries, for what was flagged" >> "$GITHUB_STEP_SUMMARY"
            code=0
            ALO_EVERY_TRY_SUMMARY="$GITHUB_STEP_SUMMARY" \
              "$t/change-check" compare "$t/change-all.txt" "$t/base-all.txt" || code=$?
          fi
          cp "$t/change.txt" "$t/every-try-measured.txt"
          # **A try the model could not be asked, on either side, in either
          # round, is not a measurement** (2026-11-20: a provider out of credit
          # read as nought of ten on both sides and passed). The check reads
          # it from what was measured; a base whose check predates that is read
          # from its own log, which says so of every such try.
          if grep -l "could not ask the model" "$t"/change-*.log "$t"/base-*.log > "$t/not-asked.txt" 2>/dev/null; then
            echo "**Nothing was measured**: the model could not be asked on some tries, in $(wc -l < "$t/not-asked.txt") of the runs, so this says nothing about the change and the check does not pass." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          exit "$code"

      # **What was measured, for raising the record**: download it and run
      # `cargo run -p alo-every-try -- reached every-try-measured.txt`.
      - name: Keep what was measured
        if: always() && steps.own.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: every-try-measured
          # And every try's own line — took the road, left it, or could not
          # ask the model and why — so a refused try is never read as a wrong
          # one.
          path: |
            ${{ runner.temp }}/every-try-measured.txt
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
