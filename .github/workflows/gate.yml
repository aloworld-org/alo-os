# The gates that run on a hosted runner, on every change and every queue branch,
# posting `alo/gates-on-a-runner` — which is **not** the status `main` requires.
#
# **`alo/nine-gates` is a required check on `main` and nothing produces it but a
# lane.** Every status on every pull request was typed by hand with `curl`, by
# whichever lane was landing, and so was the *second* one each merge-queue branch
# needs. On 2026-09-28 that cost a pull request sitting at position 1 in the queue
# with nobody to attest it, another gated twice because the queue rebased it under
# the first attestation, and a lane that could not merge at all for most of a day.
# This file was written to end that and it does not, quite: five tests of 8,326
# cannot run here, so it posts a claim about a runner instead and the step at the
# bottom of this file says why at length. What it removes is the *guessing* — a
# lane still types the required status, but it no longer finds out from a queue
# what a machine would have told it in twenty minutes.
#
# **And until 2026-09-29 it removed nothing, because it had never once been green.**
# The gates step failed on every run — those five tests — and it was the step that
# decided the job, so every later step was skipped, including the one that posts
# `alo/gates-on-a-runner`. The status this file exists to produce had never been
# posted in 102 runs, and four changes were landed building on it. A red check on a
# pull request that a lane was going to attest by hand anyway is invisible: it looks
# exactly like a red you have already accounted for.
#
# Two things were wrong and only one of them was the condition. The other is that
# the run could only ask **which gate failed**, and `the workspace's tests` is the
# answer both when this runner cannot make a namespace and when a change under test
# broke something — so the run was silent about a real regression by construction.
# `.github/the-tests-a-hosted-runner-cannot-run.txt` names the five, the run compares
# what actually failed against it, and a failure outside that list fails the job.
#
# Until that afternoon this file could not have existed: the gates loaded BPF
# programmes into a privileged kernel, which no hosted runner will give. #217
# took the three boundary crates off the merge path and removed exactly that
# obstacle. `image.yml` and `release.yml` already run on hosted `ubuntu-24.04`,
# so the runner is proven; what was missing was a suite that could run there.
#
# # Why `merge_group` is the most important line here
#
# GitHub's merge queue builds its own branch — `gh-readonly-queue/main/pr-N-<base>`
# — and that commit is **not** the pull request's head: it is the change rebased
# onto the real current `main`. Branch protection asks it for `alo/nine-gates`
# too, and nothing produces that either. So `on: merge_group` is not a
# convenience, it is the half of the contract that is being met by a person
# typing a second `curl` — and this file running there is what tells them, before
# they type it, whether the rebase the queue performed still passes.
#
# It is also the design the owner decided on 2026-09-28, out of three that were
# put to them: **the queue branch is gated by CI, and `alo/nine-gates` on a pull
# request's head means this commit on the base it was written against.** A gate
# here takes tens of minutes while `main` lands a commit every fifteen to
# twenty, so the base moves during essentially every run; attesting the head and
# the queue branch separately is the normal case rather than the exception.
#
# # What this does not do
#
# **It does not change branch protection, and it no longer aims to.** The
# required check stays what it is and a lane keeps posting it. Making
# `alo/gates-on-a-runner` a required check, or adding it beside the other, is the
# owner's decision — a flag day in the middle of three lanes landing work is how a
# queue stops for a reason nobody can see. What would have to come first is the
# five tests. What is measured about them is only this: they fail here and they
# pass on all three lanes' machines, so it is this environment and not the work.
# All five re-run their own binary inside `unshare --map-root-user --net` and all
# five get **126** — found, but could not be executed.
#
# The two accessibility-bus tests that used to be on this list are **not** on it any
# more: they pass, since this job gained a compositor and a session bus. That is
# what the expiry rule in the declared-tests file is for — an excuse that has
# stopped being true is a permission, and the only way a list like this stays honest
# is if the run checks that every line on it still fails.
#
# The cause of the 126 is **not established**. The probe below makes the namespace
# as root, runs `ip` in it, and execs both `/bin/true` and a binary from this
# repository's own tree in it, all successfully; the kernel refuses `unshare` to the
# unprivileged `runner` user and allows it to root, and the gates are root. So the
# obvious explanation — Ubuntu 24.04 restricting unprivileged user namespaces —
# accounts for why they failed before the gates ran as root and **does not** account
# for why they fail now. Written as unfinished because it is unfinished: five wrong
# explanations were withdrawn on 2026-09-28 before the sixth was measured, and a
# cause invented to fill a gap is how the sixth nearly was not. The step
# *what a namespace can exec once the tests exist* is the next measurement, and it
# runs after the build because the binary the tests exec does not exist before it.
#
# **It does not build the image**, which no gate does either; `docs/quirks/`
# records that as its own finding.
#
# # What a green run here is not evidence of
#
# Written down rather than left to be inferred, because *"nine gates green"*
# already meant three different coverages on three machines on 2026-09-28: one
# lane carrying the `gates.rs` exclusions, one running `cargo test --workspace`
# with none at all, and one whose copy of the filter had drifted a merge behind.
#
# **A skip is the same colour as a pass.** `alo-shell::the_nested_fixtures`
# rejoined the merge path in #236, and it starts its own compositor — but on a
# host with no `weston` it **skips** rather than fails. A hosted runner has none
# unless this file installs one, so a green run here can cover 23 GLES fixtures
# fewer than a lane's green run and say nothing about the difference. Read the
# skip count, not only the colour: nextest prints it on the summary line as
# *N tests and M binaries skipped*.
#
# **And the survey that cleared this workflow had a hole of exactly that shape.**
# Before it was written the whole suite was run twice on one machine — once as
# that machine is, once with `WAYLAND_DISPLAY`, `XDG_RUNTIME_DIR` and `DISPLAY`
# unset to imitate a runner — and 8,161 tests passed identically both ways, with
# nothing red in either direction. That is the evidence this file rests on.
# **But the filter excluded `the_nested_fixtures` at the time, and that was the
# only binary the question was ever about.** So what was proved is that the merge
# path *as it was then defined* is indifferent to an inherited session. It proved
# nothing about the one test whose result is a property of the session — and that
# test is now back on the merge path.
#
# # One definition of the gates, three consumers
#
# Nothing here spells a gate. `tools/kernel-loop/src/gates.rs` is what the nine
# gates *are*, and `alo-kernel-loop gates` runs them. That subcommand was added
# for this workflow, because `verify` refuses without a handoff and a workflow
# has none.
#
# The alternative — writing the commands into this file — was rejected on
# evidence rather than taste. On the morning of 2026-09-28 `gates.rs` said
# `cargo test --workspace` while all three machines ran `cargo nextest` with an
# exclusion written nowhere in the tree, and one lane's script checked that it
# had run nine gates and was satisfied, because it counted them instead of
# reading them. A fourth copy here would recreate that drift in a place nobody
# thinks to look. It would also be shell where the constitution says Rust:
# "a language that is not Rust is a bug", and a workflow that *invokes* is
# configuration where one that *decides* is a program in the wrong language.
name: the nine gates

on:
  pull_request:
  merge_group:

# Only what it needs: read the tree, and write the one status it exists to post.
permissions:
  contents: read
  statuses: write

# A superseded run proves nothing about a commit nobody will merge. The queue's
# own branches are never cancelled, because the queue is waiting on exactly that
# answer and a cancelled run there stalls it until the sixty-minute timeout.
concurrency:
  group: the-nine-gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-24.04
    # A cold build of this workspace is tens of minutes; a warm one is minutes.
    # This is above the cold figure and well under the queue's own sixty-minute
    # timeout, so a genuinely stuck run is killed before the queue gives up on
    # it rather than after.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # **A queue commit says that it is waiting, in seconds, because silence here
      # is load-bearing and the window is sixty minutes.**
      #
      # The merge queue builds its own commit and branch protection asks *that*
      # commit for `alo/nine-gates`. Nothing produces it but a lane, and **nothing
      # tells the lane the commit exists.** So the commit sits until
      # `check_response_timeout_minutes` — 60 — ejects it, and a queued pull request
      # looks exactly like a patient one. It happened three times on 2026-09-28 and
      # 29, to two different lanes, and each time the only reason anybody noticed was
      # that a third lane was polling for the slot it wanted.
      #
      # That is *a gate that is absent and says nothing*, which this file argues
      # against twice — except worse, because the merge waits on the silence. The
      # failure is not a wrong answer; it is a branch that vanishes an hour later and
      # a lane that never learns why.
      #
      # # Why it is the first step and not the last
      #
      # **It was the last step, and that was a defect.** This job takes about
      # nineteen minutes, so an announcement at the end consumed a third of the
      # window before it spoke — and on 2026-09-29 a lane found one queue commit
      # announcing itself and another silent, and the difference was only that one
      # run had finished. Measured: `531e2126` started 11:38:28Z and completed
      # 11:57:01Z, so its status appeared eighteen and a half minutes in, while
      # `0fdbb8fb` had nothing on it at all because its run was still going.
      #
      # It sat at the end because it was grouped with `post alo/gates-on-a-runner` —
      # both are statuses, so they went together. **That is placement by resemblance
      # rather than by dependency**, and it is the same shape as a verdict computed
      # from the wrong operand: one of them reports a result and cannot be known
      # earlier, and this one announces a fact that is true at checkout and depends
      # on nothing. So it goes first.
      #
      # # Why a status of its own rather than relying on the run
      #
      # Measured before writing this, because the obvious answer was wrong: a red
      # check **already exists** on every queue commit. The Mac's ejected `pr-264`
      # commit read `gate | completed / failure` for all 57 of its minutes and neither
      # lane acted on it. A second red thing is not the fix. What was missing is that
      # a queue commit's `gate` is *indistinguishable from a pull request head's*
      # `gate` — same name, same colour, and neither says which sha needs what from
      # whom. So this posts a context whose **name** is the message and appears
      # nowhere else.
      #
      # # Why a failing state cannot block a landing
      #
      # Also measured rather than reasoned: `#258`'s queue commit `e24594e4` merged
      # while its own `gate` check was still `in_progress`. So `ALLGREEN` does not
      # hold a merge for every check, and a non-required red status cannot stop one.
      # Had that not been true this step would be a way to block every landing in the
      # repository, which is why it was checked first.
      #
      # It is posted on **every** `merge_group` run, because a lane must attest a
      # queue commit whatever the gates say — `alo/gates-on-a-runner` is a narrower
      # claim than the required check and never substitutes for it. The day this
      # workflow can post `alo/nine-gates` honestly, this step goes with the
      # distinction.
      - name: say that this queue commit is waiting on a lane
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.after || github.sha }}
        run: |
          # **140 characters is a silent limit.** A longer description is rejected
          # and the POST reports nothing useful, which would be a second silent gate
          # built inside the fix for the first. Checked here rather than trusted.
          said="gate this sha on a lane and post alo/nine-gates; the queue ejects it 60 minutes after it was built"
          if [ "${#said}" -gt 140 ]; then
            echo "REFUSED: the description is ${#said} characters and the limit is 140."
            echo "  A rejected POST would leave this queue commit as silent as it was before."
            exit 1
          fi
          echo "posting on $SHA: $said (${#said} characters)"
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context=alo/this-queue-commit-needs-a-lane \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="$said"

      # **And say it on the page a person actually looks at.**
      #
      # The step above puts the truth on the queue commit, which is where it is
      # true. Nobody looks there. On 2026-09-29 a pull request sat for two hours
      # reading *mergeable, checks passing* — which was accurate about its head —
      # while the thing blocking it was a different commit on a branch the page
      # never shows. **A lane watching its own pull request saw nothing wrong for
      # the entire life of the problem.** The place a person looks should say the
      # thing that is true.
      #
      # # What this claims, and why it is not a lie about the head
      #
      # A status on the head implying *the head's tree is broken* would be false.
      # This says something else: **this pull request's queue entry is waiting for
      # attestation, and here is its sha.** The subject is the pull request's
      # position in the queue, which is exactly what the page is for, and the sha
      # makes it checkable rather than trusted.
      #
      # # Nothing here derives a sha, and that is deliberate
      #
      # The pull request *number* is read from GitHub's own branch name — the queue
      # builds `gh-readonly-queue/main/pr-<n>-<base>`, so the number is GitHub's
      # encoding rather than this file's guess. The head **sha** is then read from
      # the API. A sha assembled from a branch name would be the fabricated-hash
      # fault with a machine doing the fabricating, and unlike a person's typo it
      # would land on a commit that exists.
      #
      # Every guard below **refuses rather than guesses**: a number that will not
      # parse, an API that returns no head, or a pull request that is not open all
      # post nothing and say why.
      #
      # # The deadline is in the sentence, because nothing can clear the worst case
      #
      # The attest script clears this when somebody attests. But it only runs when
      # somebody does — so it cannot clear an entry that **ejected on timeout** or a
      # pull request **abandoned**, which are precisely the cases this status exists
      # to make visible. A stale *waiting for attestation* would then sit in the one
      # place we are teaching people to trust: the failure being removed, arriving
      # through the door built to remove it.
      #
      # Carrying the queue sha alone makes the truth *available* — a reader who
      # thinks to check finds the branch gone. Carrying **the deadline** makes it
      # *unavoidable*: the sentence tells a reader when to stop believing it, judged
      # against a clock they already have. That is the same move as the format
      # number in an attestation payload — **the artifact carries what is needed to
      # weigh the artifact.**
      #
      # So the three cases are: attested, and the attest script clears it; ejected
      # and requeued, and the next `merge_group` run replaces it with a new sha and
      # a new deadline; ejected and abandoned, and nobody clears it — but the
      # deadline has passed and any reader can see so without leaving the page.
      - name: say on the pull request that its queue entry is waiting
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_SHA: ${{ github.event.after || github.sha }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "queue ref: ${QUEUE_REF:-(the event carried none)}"

          # The pull request number, read out of GitHub's own branch name.
          number=$(printf '%s' "${QUEUE_REF:-}" | sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p')
          if [ -z "$number" ]; then
            echo "Nothing posted: no pull request number in the queue ref."
            echo "  Guessing one would put a status on somebody else's pull request."
            exit 0
          fi
          echo "pull request: #$number"

          # Its head sha, and its state, read from the API rather than derived.
          read -r head state <<EOF
          $(gh api "repos/$REPO/pulls/$number" --jq '"\(.head.sha) \(.state)"' 2>/dev/null || true)
          EOF
          if [ -z "${head:-}" ] || [ "${#head}" -ne 40 ]; then
            echo "Nothing posted: the API returned no 40-character head sha for #$number."
            exit 0
          fi
          if [ "${state:-}" != "open" ]; then
            echo "Nothing posted: #$number is '$state', so nothing is waiting on it."
            exit 0
          fi
          echo "head: $head"

          # When the queue built this commit, so the sentence can carry its own
          # expiry. Read from the commit rather than assumed to be now: this job
          # starts shortly after the build, and *shortly* is not a measurement.
          built=$(gh api "repos/$REPO/commits/$QUEUE_SHA" --jq '.commit.committer.date' 2>/dev/null || true)
          if [ -z "$built" ]; then
            echo "Nothing posted: the queue commit's build time could not be read, so the"
            echo "  sentence could not carry the deadline that keeps it from going stale."
            exit 0
          fi

          said="queue entry ${QUEUE_SHA} wants alo/nine-gates; it ejects 60 minutes after $built"
          if [ "${#said}" -gt 140 ]; then
            said="queue entry ${QUEUE_SHA} wants alo/nine-gates; ejects 60 min after $built"
          fi
          if [ "${#said}" -gt 140 ]; then
            echo "Nothing posted: the description is ${#said} characters and the limit is 140."
            echo "  A rejected POST would leave this page as silent as it was before."
            exit 1
          fi

          echo "posting on $head: $said (${#said} characters)"
          gh api -X POST "repos/$REPO/statuses/$head" \
            -f state=failure \
            -f context=alo/queue-entry-waiting \
            -f target_url="${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}" \
            -f description="$said"

      # The pinned nightly the BPF gates need, beside the stable the rest use.
      # `crates/alo-bounding-kernel/rust-toolchain.toml` pins it and rustup
      # honours that file, so the version is not repeated here.
      - name: the toolchains this repository pins
        run: |
          rustup component add rustfmt clippy
          rustup toolchain install nightly-2026-06-01 --component rust-src

      # **The compositor the nested fixtures start for themselves.**
      # `alo-shell::the_nested_fixtures` starts its own parent since #232 rather
      # than borrowing whatever session it inherits, which is what let it rejoin
      # the merge path. But it can only start one if `weston` is on the host, and
      # **without it the binary skips rather than fails** — which is the same
      # colour as a pass and would quietly make a green run here cover 23 GLES
      # fixtures fewer than a lane's.
      #
      # So it is installed rather than left out, and the skip count is printed
      # after the gates so the difference is visible if this ever stops working.
      # Not asserted against a number: the right skip count is a property of the
      # suite on the day, and a threshold invented here without a runner to
      # measure on would be a guess dressed as a check.
      # **And the C libraries this workspace links against.** Measured on this
      # workflow's own first run: `clippy, warnings denied` failed because
      # `libudev-sys`' build script panicked — the development files were not
      # there. A hosted runner carries a compiler and not much else, and the
      # gates build a compositor.
      #
      # The list is the one `image/Containerfile`'s own build stage installs,
      # translated from Fedora's names to this runner's, so there is one answer
      # to *what does this workspace need to build* rather than two that drift.
      # `systemd-devel` is `libudev-dev` here, which is the one that failed.
      - name: the libraries this workspace links, and a compositor for the
              fixtures that start their own
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libwayland-dev libinput-dev libseat-dev libxkbcommon-dev \
            libpixman-1-dev libegl1-mesa-dev libgbm-dev libudev-dev \
            weston \
            dbus-x11 dbus-daemon gnome-keyring at-spi2-core \
            libgtk-3-bin
          weston --version
          # **The three programs `alo-adapters` starts a real application with**,
          # named here because that test refuses to skip when they are absent —
          # *skipping would report green on a machine with none* — which is the
          # rule `installed_in_a_virtual_machine.rs` states and the right one. It
          # asked for `broadwayd` and said so, and `gtk-builder-tool` and
          # `dbus-daemon` are the two it would have asked for next; all three are
          # checked here so the answer arrives in one run rather than three.
          # `libgtk-3-bin` carries the first two.
          for program in dbus-daemon broadwayd gtk-builder-tool; do
            printf '%-20s %s\n' "$program" "$(command -v "$program" || echo MISSING)"
          done

      # Cache invalidation dominates, not work: a queue-branch gate on one lane
      # ran clippy in 2 seconds warm against 85 on a rebase-invalidated run. So
      # this matters more than the runner's processor count.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\ntools/kernel-loop -> target"

      # **The linker the last two gates need**, and the one piece of this file
      # whose correctness cannot be settled from a lane.
      #
      # Measured on this workflow's first runs against other lanes' changes:
      # `error: linker 'bpf-linker' not found` — the BPF target's clippy gate
      # compiles `alo-bounding-kernel` and there is no such program on a runner.
      #
      # **It is not simply another package.** `crates/alo-bounding-kernel/rust-toolchain.toml`
      # says why in its own words: `bpf-linker` does not link objects, it reads
      # the LLVM bitcode `rustc` emits and runs LLVM's own passes over it, so the
      # LLVM it was built against **has to be** the LLVM that compiler emits. On
      # one lane's machine that pairing is bpf-linker 0.11.0 against LLVM 22.1.8,
      # arranged deliberately.
      #
      # Installing it here builds it against whatever LLVM this runner has, which
      # may or may not be the pinned nightly's. If it is not, the failure is the
      # one that file warns about rather than a missing program, and the honest
      # conclusion would be that the BPF gates cannot run on a hosted runner and
      # belong to a lane. That is a measurement nobody has made yet, and this
      # step is how it gets made — not an assumption that it works.
      # **And the LLVM it is built against.** Measured on the run before this
      # step existed: `bpf-linker` would not build at all —
      # *could not find llvm-config in directories specified by environment* —
      # which is a level below the version-matching question. A hosted runner
      # has no LLVM development files for this purpose.
      #
      # 22, because that is what the lane this was written on pairs with the
      # pinned nightly: bpf-linker 0.11.0 against LLVM 22.1.8, arranged
      # deliberately and for the reason `rust-toolchain.toml` gives. Ubuntu's own
      # archive does not carry 22, so it comes from apt.llvm.org, which is the
      # project's own.
      #
      # This is the expensive step in the file and it is worth saying so: it
      # downloads and installs a compiler toolchain on every run that the cache
      # does not cover. If it proves too slow, the honest alternative is to take
      # the two BPF gates off this workflow's path and have CI **say so in its
      # own output on every run** — a gate that is absent and says so is
      # information; one that is absent quietly is the same fault as a skip
      # reading like a pass.
      - name: the LLVM the BPF linker is built against
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 22
          # **Copied from the lane that works, not inferred.** The first attempt
          # set `LLVM_SYS_221_PREFIX` and `bpf-linker` still answered *could not
          # find llvm-config*, because that is not the variable it reads. The
          # machine where these gates have always passed does it with `PATH` and
          # `LLVM_PREFIX` — `gate-workspace.sh:77` — so that is what this does.
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          echo "LLVM_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          /usr/lib/llvm-22/bin/llvm-config --version

      - name: the linker the BPF target needs
        run: cargo +nightly-2026-06-01 install bpf-linker --locked

      - name: the test runner the gates name
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # **What this run will not cover, said before it runs rather than after.**
      #
      # The nine gates are what `tools/kernel-loop/src/gates.rs` defines, and that
      # definition excludes three packages and one test by name. One lane runs
      # `cargo test --workspace` with **no** exclusion at all, so its green covers
      # strictly more than this one's — and nobody reading a tick would know which
      # they were looking at. This is the *first* of two ways a green here is
      # narrower than a lane's; `alo/gates-on-a-runner` at the bottom of this file
      # is the second, and it is named the way it is for the same reason.
      #
      # Running unfiltered here is not the answer: the excluded packages attach
      # BPF programmes to a kernel, which is what #217 took off the merge path
      # and what no hosted runner can do. CI running something other than the
      # repository's own definition would be the drift this file exists to
      # prevent, pointing the other way.
      #
      # So it prints the exclusions instead. A reader comparing a green here
      # against a green on a lane can see the difference rather than infer it,
      # which is the same rule as the skip count below and as
      # *a gate that is absent should say so*.
      - name: what these gates do not cover
        run: |
          echo "the gates here are the ones gates.rs defines, which excludes:"
          # `\r$` first: a checkout with CRLF endings leaves the continuation
          # backslash followed by a carriage return, so `\\$` never matches and
          # the joined line comes out with a stray `\` in the middle of it.
          sed -n '/"-E",/,/",$/p' tools/kernel-loop/src/gates.rs \
            | sed -e 's/\r$//' -e 's/^ *//' -e 's/\\$//' \
            | tr -d '\n' | sed -e 's/^"-E",*//' -e 's/^ *"//' -e 's/",$//'
          echo
          echo "A lane running cargo test --workspace with no filter covers more than this."

      # **Built here rather than with `cargo run`, so two failures stay apart.**
      # A supervisor that does not compile and a gate that does not pass are
      # different things and should not share a step: one is a change to this
      # repository's own tooling, the other is a change under test, and a log
      # that conflates them sends whoever reads it to the wrong file.
      #
      # *Not* because `cargo run --manifest-path` is broken. On the machine this
      # workflow was written on, that form fails the readiness check for the
      # pinned nightly with `No such file or directory (os error 2)` while the
      # built binary runs the gates normally — same directory, same PATH, same
      # binary. The laptop's lane could not reproduce it: both forms behaved
      # identically there. So it is something about that one machine, with no
      # known cause, and it is recorded here rather than dressed up as a
      # property of the tool. Three explanations of it have already been wrong.
      - name: build the supervisor
        run: cargo build --quiet --manifest-path tools/kernel-loop/Cargo.toml

      # **That the runner ran the binary we think it ran, shown rather than
      # assumed.** Cargo decides what to rebuild by comparing modification times,
      # not contents, so a source that arrives older than the artefact built
      # before it is reported as current and the artefact keeps the old code.
      # Measured on one lane's machine on 2026-09-28: a source holding
      # `Some("gates")`, a binary seven seconds newer holding no such string, and
      # `Finished in 0.02s` over the top of both. One `touch` and it compiled.
      #
      # That was caught there because somebody read the mtimes. **Nobody reads
      # mtimes in CI.** So this asks the binary what it is instead: the usage text
      # lists every subcommand, and `gates` is the one this workflow depends on.
      # If the step fails, the build produced something older than this file
      # expects and the gates that follow would be measuring the wrong thing.
      #
      # It is checked here and not left to the gates themselves, because a stale
      # supervisor might still run nine gates perfectly well — on the wrong
      # definition of them.
      - name: the supervisor is the one this file expects
        run: |
          ./tools/kernel-loop/target/debug/alo-kernel-loop 2>&1 | tee /tmp/the-usage.log || true
          grep -q 'alo-kernel-loop gates' /tmp/the-usage.log || {
            echo "REFUSED: the built supervisor has no 'gates' subcommand."
            echo "Its usage above is what it actually offers. The build is older than"
            echo "this workflow expects, which is how a stale artefact passes a gate."
            exit 1
          }

      # **Can a namespace be made here at all.** `alo-nearby`'s IPv6 test and
      # `alo-asking`'s four office tests each make a network namespace of their
      # own with util-linux's `unshare`, inside a user namespace — deliberately,
      # and `asked_and_answered_over_ipv6.rs` says why in its own words: a
      # development machine may have IPv6 switched off outright (the WSL2 kernel
      # they were written on does) and a fresh namespace has it on, so what is
      # measured is the crate rather than however the host is configured.
      #
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor and
      # WSL2 does not, which is the likeliest reason those five passed on a lane —
      # including as uid 65534 — and failed here. Root is exempt, and the gates
      # below run as root, so this step changes nothing: it **states** what the
      # kernel is set to and whether a namespace can actually be made, as this
      # runner and as root. If the five fail again, these lines are where a reader
      # looks first, and they distinguish *the kernel forbids it* from *something
      # else is wrong* without another run to find out.
      - name: can a namespace be made
        run: |
          echo "kernel.apparmor_restrict_unprivileged_userns = $(
            cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null \
              || echo 'not a setting on this kernel'
          )"
          for who in "$(id -un)" root; do
            if [ "$who" = root ]; then as=sudo; else as=""; fi
            if $as unshare --user --map-root-user --net -- true 2>/dev/null; then
              echo "unshare as $who: a network namespace can be made"
            else
              echo "unshare as $who: REFUSED — the five namespace tests cannot pass this way"
            fi
          done

          # **Making the namespace is not the part that fails.** As root the line
          # above succeeds and the five tests still fail, with the inner shell
          # exiting **126** — found but not executable. So the question is not
          # whether the namespace can be made but what can be *run* inside it, and
          # these four lines ask that directly instead of leaving it to a theory.
          #
          # Each step is separate because `126` from `ip` and `126` from the test
          # binary are different faults with the same number: the tests run
          # `ip link set lo up && exec "$0"`, so a failure in the first is
          # indistinguishable from a failure in the second unless they are asked
          # apart. A binary from the repository's own tree is the last one, because
          # that is the only one the test actually execs.
          echo "--- what can be run inside a namespace, as root"
          # **`|| code=$?` and not a bare call.** A step here runs under `bash -e`,
          # so a probe that simply ran the command and read `$?` afterwards never
          # reached the `printf`: the first failing case aborted the step, skipped
          # the gates, and reported nothing about the very thing it was measuring.
          # That is what the first run of this block did, and it is the shape of
          # fault this whole file is about — a diagnostic that is silent in exactly
          # the case it exists for. Every line here must survive its own bad news.
          probe() {
            label="$1"
            shift
            code=0
            sudo unshare --map-root-user --net -- sh -c "$@" >/dev/null 2>/tmp/probe.err \
              || code=$?
            printf '%-46s exit %s %s\n' "$label" "$code" "$(tr '\n' ' ' < /tmp/probe.err)"
          }
          # 126 is the only answer that matters here: the supervisor with no
          # arguments prints its usage and exits non-zero on purpose, so *any*
          # other code means the binary ran and the fault is elsewhere.
          probe "a shell builtin"              'exit 0'
          probe "ip link set lo up"            'ip link set lo up'
          probe "exec /bin/true"               'exec "$0"' /bin/true
          probe "exec the supervisor (126?)"   'exec "$0"' \
            ./tools/kernel-loop/target/debug/alo-kernel-loop
          ls -l ./tools/kernel-loop/target/debug/alo-kernel-loop \
            || echo "the supervisor is not at that path, so the line above is 127 and not 126"
          echo "the tree is owned by: $(stat -c '%U:%G' .) ; target/ by: $(stat -c '%U:%G' target 2>/dev/null || echo 'no target yet')"

      # `/proc/uptime` rather than `date +%s`. A wall-clock delta is how one
      # lane printed `PASS clippy 42943s` on a run minutes old, after its guest
      # slept and NTP stepped the clock forward mid-gate.
      # **Inside a session bus, because twenty-four tests need one.** Measured on
      # the first run that got this far: 24 of 8,189 failed, and all of them for
      # one reason — `alo-secrets` wants the Secret Service, `alo-shell`'s
      # `the_tree_a_reader_finds` wants the accessibility bus, `alo-proxy` the
      # same. Those are D-Bus, and a hosted runner has no session bus at all.
      #
      # This is the hole in the survey that cleared this workflow, and it is the
      # second of exactly the same shape. That survey ran the suite twice with
      # `WAYLAND_DISPLAY`, `XDG_RUNTIME_DIR` and `DISPLAY` unset and found no
      # difference — but the machine still had a session bus throughout, so the
      # variable that mattered was never varied. A runner is a third session
      # again, and this is the part of it the survey could not see.
      #
      # `dbus-run-session` gives the gates a bus of their own that dies with
      # them; `gnome-keyring-daemon --unlock` puts a Secret Service on it with an
      # empty password, which is what the tests expect of a fresh login.
      #
      # **And as root, because uid 0 is part of what nineteen of them measure.**
      # A hosted runner is `runner`, uid 1001. A lane's machine gates as uid 0,
      # and so does every daemon here in production — `alo-brokerd` is the update
      # broker. `for_the_unit` writes a file mode 0644 and pins the refusal *"is
      # not root's, so the broker did not write it"*; owned by `runner` that
      # sentence is never reached, so the test fails while the code is right.
      #
      # Measured on a lane's machine on 2026-09-28, one binary run twice: as uid 0,
      # 5 of 5 passed; as uid 65534, 3 of the 5 failed with that sentence as the
      # panic. Those three are three of the eighteen `alo-brokerd` failures the
      # first session-bus run reported, with `alo-proxy`'s password-file test the
      # nineteenth. This is not a workaround for the tests — it is the environment
      # they describe.
      - name: the nine gates
        run: |
          began=$(cut -d. -f1 /proc/uptime)

          # `sudo` replaces the PATH with its own `secure_path`, which has no
          # cargo in it, and `-E` does not bring PATH back — it is on sudo's
          # blacklist by design. So the PATH is handed over explicitly, with the
          # cargo home's `bin` in front of it.
          #
          # And it is **checked here rather than discovered inside**: a root shell
          # with no cargo makes the gates fail, and a gate failure is a sentence
          # about the work. This one would be a sentence about this file, so it
          # says so in its own words. Watched failing exactly this way on a lane's
          # machine on 2026-09-28 before it was written down.
          gates_path="$HOME/.cargo/bin:$PATH"
          root_cargo=$(sudo -E env "PATH=$gates_path" bash -c 'command -v cargo' || true)
          if [ -z "$root_cargo" ]; then
            echo "no cargo on root's PATH. The gates are not what failed — this step is."
            echo "  the PATH handed over: $gates_path"
            exit 1
          fi
          echo "root runs $root_cargo"

          # **This step records what the gates did; it does not decide the job.**
          #
          # It used to. The gates fail here for five tests this runner cannot run,
          # so this step failed on every run, so every step after it was skipped —
          # including `post alo/gates-on-a-runner`, which is `if: success()`. **The
          # one status this whole file exists to produce could therefore never be
          # posted, and in 102 runs it never was.** Nobody noticed, because a red
          # check on a pull request that a lane is going to attest by hand anyway
          # looks exactly like a red check you have already accounted for.
          #
          # A workflow whose success path has never once executed is not a mechanism,
          # it is a plan; and this one was built on across four changes.
          #
          # So the code is captured and the decision is made further down, by a step
          # that can tell *the failures this runner is known to cause* from *a
          # failure in the change under test*. `|| code=$?` and not a bare call, for
          # the reason the namespace probe above gives at length: under `bash -e` a
          # step that fails before it prints is a diagnostic silent in exactly the
          # case it exists for.
          set -o pipefail
          code=0
          sudo -E env "PATH=$gates_path" "HOME=$HOME" \
            dbus-run-session -- bash -c '
              printf "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1 || true
              ./tools/kernel-loop/target/debug/alo-kernel-loop gates 2>&1
            ' | tee /tmp/the-gates.log || code=$?
          echo "$code" > /tmp/the-gates.code
          echo "the gates took $(( $(cut -d. -f1 /proc/uptime) - began ))s, and exited $code"

      # **The measurement the earlier probe could not make, made now that it can.**
      #
      # The probe before the gates asks what can be run inside a namespace and finds
      # that as root everything can: the namespace is made, `ip` runs in it, and a
      # binary from this repository's own tree execs in it. The five tests still fail
      # with **126**, and the gates run as root, so the usual explanation — Ubuntu
      # 24.04 refusing unprivileged user namespaces — does not account for it.
      #
      # The one thing that probe cannot try is the thing the tests actually exec: a
      # nextest binary under `target/debug/deps`, which does not exist until the
      # gates have built it. So this runs **after** them, as root, with the tests'
      # own invocation, and prints what a reader needs to weigh it: the binary's mode
      # and owner, the mount options of the filesystem it is on, and the exit code.
      #
      # `--list` rather than a test, because the question is whether the exec
      # happens at all, and a listing answers that in milliseconds without needing a
      # network. It fails the job under no circumstances: it is a measurement, and a
      # measurement that can turn a run red is a measurement people delete.
      - name: what a namespace can exec once the tests exist
        if: always()
        run: |
          # **It looks for the binary; it does not work out where the binary ought
          # to be.** The first version of this step read `target/debug/deps`, which
          # never exists here: the supervisor gives each checkout its own build
          # directory under `$HOME/alo-builds/<name>` and exports `CARGO_TARGET_DIR`
          # to it. So the probe measured nothing on the run that proved this job can
          # be green — and said so, rather than claiming a result, which is the only
          # reason it cost one run instead of a wrong conclusion.
          #
          # The tempting repair is to spell `$HOME/alo-builds/this-machine` here.
          # That is a second copy of a naming rule that lives in
          # `tools/kernel-loop/src/where_it_builds.rs`, and a second copy of a rule
          # is what this file's own header describes going wrong: one command became
          # three different commands on three machines. `alo-kernel-loop gates` does
          # not print the directory it chose — `run` and `publish` say it in a line
          # and `gates` does not — so there is nothing to read back, and that is worth
          # fixing in the supervisor by whoever owns it rather than worked around
          # here.
          #
          # So this **asks the filesystem** and names the places it asked. It makes no
          # claim about how the directory is named, and a fourth location is one word
          # on the `roots` line rather than a rule to keep in step.
          roots="$HOME/alo-builds ./target"
          echo "looking under: $roots"
          bin=$(find $roots -maxdepth 4 -type f -perm -u+x \
                  -name 'asked_and_answered_over_ipv6-*' ! -name '*.d' \
                  -printf '%T@ %p\n' 2>/dev/null \
                | sort -rn | head -1 | cut -d' ' -f2- || true)
          if [ -z "$bin" ]; then
            echo "no ipv6 test binary under any of them, so the gates did not get as far"
            echo "as building it — or it is somewhere none of those names reach. Nothing"
            echo "is measured here and nothing is claimed; add the place to \$roots."
            exit 0
          fi
          echo "binary   $bin"
          echo "mode     $(sudo stat -c '%A %U:%G' "$bin")"
          echo "on       $(df --output=source,fstype,target "$bin" | tail -1)"
          echo "mounted  $(findmnt -no OPTIONS --target "$bin")"

          code=0
          sudo unshare --map-root-user --net -- \
            sh -c 'ip link set lo up && exec "$0" --list' "$bin" \
            >/tmp/inner.out 2>/tmp/inner.err || code=$?
          echo "exec inside a namespace, as root: exit $code"
          echo "  it printed $(wc -l < /tmp/inner.out) lines, and on stderr: $(tr '\n' ' ' < /tmp/inner.err | cut -c1-300)"

          # And the same exec with no namespace at all, so the two differ in exactly
          # one thing. Without this line a 126 here is a fact about the binary and a
          # fact about the namespace at the same time, which is no fact at all.
          code=0
          sudo sh -c 'exec "$0" --list' "$bin" >/tmp/plain.out 2>/tmp/plain.err || code=$?
          echo "exec with no namespace,      as root: exit $code"
          echo "  it printed $(wc -l < /tmp/plain.out) lines, and on stderr: $(tr '\n' ' ' < /tmp/plain.err | cut -c1-300)"

      # Root compiled into `target/` and left files in the cargo home and under
      # `$HOME/.local`, so `runner` — which runs every step after this one, and the
      # cache's own save step — would meet files it cannot read. Handing them back
      # is part of gating as root rather than a separate concern, so it happens
      # whether the gates passed or failed.
      #
      # **`$HOME/.local` whole, not just the keyrings under it.** The first run
      # that gated as root ended with the cleanup step saying
      # `EACCES: permission denied, stat '/home/runner/.local/bin/git'` — the
      # keyring daemon had created `$HOME/.local` itself, owned by root and not
      # traversable, and everything already under it went out of reach with it. A
      # chown aimed at the leaf cannot repair a directory above the leaf, which is
      # the same lesson as the copy helper that can only touch what it transfers.
      - name: give the tree back to the runner
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            "$HOME/.cargo" "$HOME/.local" \
            target tools/kernel-loop/target 2>/dev/null || true
          echo "owned by $(id -un) again; $HOME/.local is $(stat -c '%U:%G %a' "$HOME/.local" 2>/dev/null || echo absent)"

      # **What was not run, beside what passed.** A skip is the same colour as a
      # pass, so this puts the count where somebody comparing a CI run against a
      # lane's run can see it. Measured on one lane's machine on 2026-09-28 for
      # comparison: *50 tests and 35 binaries skipped*, with weston present. A
      # number much larger than that here means something this runner has not
      # got, most likely the compositor above.
      #
      # It does not fail on the number. The right count is a property of the
      # suite on the day, and a threshold invented without a runner to measure on
      # would be a guess wearing the clothes of a check.
      - name: what was skipped
        if: always()
        run: |
          grep -oE '[0-9]+ tests and [0-9]+ binaries skipped' /tmp/the-gates.log | tail -1 \
            || echo "no skip line in the gates' output — the tests gate may not have run"

      # **The step that decides the job, and the only one that may.**
      #
      # Before this existed the gates step decided it, and the gates fail here for
      # five tests this runner cannot run — so the job failed every time, so
      # `post alo/gates-on-a-runner` never ran, so the status this file exists to
      # produce was never once posted. 102 runs, no successes.
      #
      # The old reasoning went as far as *which gate failed* and stopped. That is
      # too coarse by exactly one level: `the workspace's tests` is the answer both
      # when the runner cannot make a namespace **and** when a change under test
      # broke something. Treating the gate's name as the reason meant the run stayed
      # silent about a real regression, which is a true-looking signal about the
      # wrong subject — the fault this file argues against twice above and then
      # committed.
      #
      # So the question asked here is *which tests failed*, against a declared list.
      # Three answers and they are not the same:
      #
      #   every failure is declared      the runner's own gap, and nothing else; the
      #                                  job may pass and the status may be posted
      #   a failure is not declared      the change under test, or a new gap nobody
      #                                  has looked at; the job fails
      #   a declared test passed         the list is stale; said loudly, because a
      #                                  list of excuses nothing ever removes from
      #                                  becomes a list of things nobody may break
      #
      # The third is the liveness check, and it is the half that is usually left
      # out: an equality is worth nothing without one on its operands, because
      # absence reads as agreement. A declared list with no expiry would quietly
      # grow into permission.
      - name: whether anything failed that this runner can run
        if: always()
        run: |
          declared=.github/the-tests-a-hosted-runner-cannot-run.txt
          code=$(cat /tmp/the-gates.code 2>/dev/null || echo "")
          if [ -z "$code" ]; then
            echo "The gates step left no exit code, so it did not reach its end."
            echo "Nothing is inferred from that: this job fails and a person reads the log."
            echo "the gates step did not finish" > /tmp/the-verdict
            exit 1
          fi
          if [ "$code" = 0 ]; then
            echo "every gate passed on this runner, including the tests gate."
            echo "That has not happened before. If it is repeatable, $declared is empty"
            echo "in practice and the distinction between the two statuses can retire."
            echo "every gate passed here" > /tmp/the-verdict
            exit 0
          fi

          failed=$(sed -n 's/.*alo-kernel-loop: the gate `\(.*\)` did not pass.*/\1/p' \
            /tmp/the-gates.log 2>/dev/null | head -1)
          echo "the gate the supervisor named as failing: [${failed:-could not be read}]"
          if [ "$failed" != "the workspace's tests" ]; then
            echo
            echo "This is not the gate this runner is known to be unable to finish, so"
            echo "whatever it is, it is not this runner's doing. The job fails."
            echo "the runner's own '${failed:-unnamed}' gate failed" > /tmp/the-verdict
            exit 1
          fi

          # nextest's own naming, taken from its FAIL lines: `<crate>::<binary> <test>`.
          # **`|| true` on both, and the emptiness asked about afterwards.** A step
          # here runs under `-e -o pipefail`, and `grep -v` exits 1 when it selects
          # nothing — so a declared file that was emptied would abort this step
          # before it wrote a verdict, and an aborted decision step is a job that
          # fails for a reason nobody can read. Each pipeline is allowed to produce
          # nothing, and *nothing* is then a case with an answer rather than a crash.
          sed -n 's/.*FAIL \[[^]]*\] *([^)]*) *//p' /tmp/the-gates.log \
            | sort -u > /tmp/failed.txt || true
          grep -v '^[[:space:]]*#' "$declared" 2>/dev/null \
            | grep -v '^[[:space:]]*$' | sort -u > /tmp/declared.txt || true
          echo "failed here: $(wc -l < /tmp/failed.txt); declared: $(wc -l < /tmp/declared.txt)"

          # **An empty failure list is not agreement.** The tests gate failed, so
          # something failed; reading no FAIL lines means the parse broke, not that
          # nothing broke, and the difference is the whole point of this step.
          if [ ! -s /tmp/failed.txt ]; then
            echo
            echo "The tests gate failed and no FAIL line could be read from its output."
            echo "That is this step being unable to do its job, not the suite being fine."
            echo "the tests gate failed and no FAIL line could be read" > /tmp/the-verdict
            exit 1
          fi

          undeclared=$(comm -23 /tmp/failed.txt /tmp/declared.txt)
          passed_after_all=$(comm -13 /tmp/failed.txt /tmp/declared.txt)

          if [ -n "$passed_after_all" ]; then
            echo
            # **"did not fail" and not "passed".** A line that never appears among
            # the failures has two explanations — the test runs here now, or the
            # name is mistyped and has never matched anything — and this step cannot
            # tell them apart. Saying *passed* would pick one and be wrong half the
            # time, in a message whose whole job is to send somebody to look.
            echo "=== these are declared as unrunnable here and did NOT fail:"
            # Quoted and piped, never `printf '%s\n' $list`. A nextest name is
            # `<crate>::<binary> <test>` and contains a space, so an unquoted
            # expansion splits every entry in two and prints twice as many
            # half-names as there are tests.
            printf '%s\n' "$passed_after_all" | sed 's/^/  /'
            echo "Either the runner gained what they need, or a name there is mistyped and has"
            echo "never matched anything. Look, then delete the line: it is an"
            echo "excuse, and an excuse that has stopped being true is a permission."
          fi

          if [ -n "$undeclared" ]; then
            echo
            echo "=== these failed and are NOT declared:"
            printf '%s\n' "$undeclared" | sed 's/^/  /'
            echo
            echo "This runner is not known to cause these, so they belong to the change"
            echo "under test or to a gap nobody has measured. The job fails, and it is"
            echo "meant to: this is the case the old name-only check was silent about."
            printf 'tests failed that this runner is not declared to cause: %s\n' \
              "$(printf '%s' "$undeclared" | tr '\n' ' ')" > /tmp/the-verdict
            exit 1
          fi

          echo
          echo "every failure here is one this runner is declared to cause, and no other"
          echo "gate failed. The gates this runner can run, passed."
          echo "only the tests this runner cannot run failed" > /tmp/the-verdict
          {
            echo "### the gates a hosted runner can run"
            echo
            echo "All of them passed. \`$(wc -l < /tmp/declared.txt)\` tests could not run here and are"
            echo "declared in \`$declared\`; every one of them still fails, so none is stale."
            echo
            echo "This is **not** \`alo/nine-gates\`. That is posted by a lane, from a machine"
            echo "where all nine ran."
          } >> "$GITHUB_STEP_SUMMARY"

      # **`alo/gates-on-a-runner`, and deliberately not `alo/nine-gates`.**
      #
      # This workflow was written to post the status `main` requires, and it very
      # nearly did. Five tests re-run themselves inside a network namespace and
      # cannot exec there, so the workspace-tests gate does not pass here — and the
      # plan was for the run to *say so* while still posting.
      #
      # That plan was wrong and it was wrong in the shape this file argues against
      # twice above. `alo/nine-gates` means the nine gates passed. **Naming a gap
      # in a log does not make a status true**, and a green a reader has to go and
      # read a log to qualify is the same fault as a skip being the same colour as
      # a pass. It would also be a claim about the *repository's* gates made by the
      # weakest place they run.
      #
      # So this posts a different claim, and the name says **where it ran** rather
      # than how much of it ran. A count goes stale the day the runner gains or
      # loses a capability and then the name is lying again; the machine is the
      # durable fact. A reader seeing `alo/gates-on-a-runner` green and
      # `alo/nine-gates` absent knows exactly what they have — most of the gates,
      # on a hosted runner — without knowing today's arithmetic.
      #
      # `alo/nine-gates` stays what it is: posted by a lane, on a machine with a
      # kernel, meaning all nine. If this runner is ever made able to run
      # everything, this step can post both and the distinction retires on
      # evidence rather than by decision.
      #
      # On whichever commit is being gated — the pull request's head, or the queue
      # branch's own. `github.event.after` is the queue branch's head on a
      # `merge_group` event and empty otherwise. It runs only on success, because a
      # red status this workflow wrote would sit beside a commit somebody gated
      # properly.
      - name: post alo/gates-on-a-runner
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=success \
            -f context=alo/gates-on-a-runner \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="the gates that run on a hosted runner, by the workflow"

      # **And at the end, but only when the runner has learned something a lane does
      # not already know.**
      #
      # The announcement at the top says *a lane must gate this*. If the runner's own
      # gates then fail, it may have learned that the commit is broken — which saves
      # a lane eight to fourteen minutes of discovering it independently.
      #
      # # The version that was proposed would have been false nearly every time
      #
      # *Replace the announcement with "this will not pass" whenever the gates fail*
      # is the obvious form and it is wrong here. **This runner fails seven tests of
      # 8,200-odd on every healthy commit** — five want a network namespace the kernel
      # refuses, two want an accessibility bus — and all seven pass on all three
      # lanes' machines. So *the gates failed* is the **normal** state, and a status
      # reading *this will not pass* would be wrong on essentially every queue commit.
      #
      # That failure mode is worse than being wrong: a lane that learned to trust it
      # would start skipping runs on good commits. **A red that means nothing teaches
      # people to ignore a red**, which is the skip-is-the-colour-of-a-pass fault
      # inverted, and it degrades quietly while looking like efficiency.
      #
      # # What makes it safe is that all seven live in one gate
      #
      # The other eight gates this runner runs **completely**. So a failure in
      # formatting, clippy, rustdoc, the supervisor's three or either BPF gate is a
      # fact the runner genuinely learned and *this will not pass* is true. A failure
      # inside the workspace's tests tells a lane nothing, and the announcement stands.
      #
      # The failing gate is read from **the supervisor's own words** rather than from
      # a list kept here, because a list of gates the runner cannot run would be a
      # copy that drifts from `gates.rs` — which is the fault three lanes found in
      # their own scripts on 2026-09-29. And if the name cannot be read, this says
      # nothing: guessing would be worse than silence.
      - name: say if a gate the runner can fully run has failed
        if: failure() && github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.after || github.sha }}
        run: |
          # **It reads the verdict the decision step wrote; it does not derive its
          # own.** This used to re-read the log and ask *which gate failed*, and
          # answer `the workspace's tests` in two different situations: the five
          # tests this runner cannot run, and a change that broke a test. It then
          # stayed silent for both — so the one case worth posting about was the one
          # it could not see. Two readers of the same log, asking slightly different
          # questions, is how that happened; now there is one reader and one answer.
          verdict=$(cat /tmp/the-verdict 2>/dev/null || echo "")
          echo "the verdict: [${verdict:-none was written}]"

          if [ -z "$verdict" ]; then
            echo "Nothing is posted. The decision step wrote no verdict, which means the job"
            echo "failed before it ran — a toolchain, a library, the checkout. That is this"
            echo "file's own business and not a statement about the change, and the"
            echo "announcement posted at the top of this job already says a lane is needed."
            exit 0
          fi

          case $verdict in
            "only the tests this runner cannot run failed" | "every gate passed here")
              echo "Nothing is posted: the job did not fail for a reason about this change."
              exit 0
              ;;
          esac

          said="$verdict — so this will not pass as it stands"
          if [ "${#said}" -gt 140 ]; then
            said="a gate this runner can fully run has failed, so this will not pass as it stands"
          fi
          echo "posting on $SHA: $said (${#said} characters)"
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=failure \
            -f context=alo/this-queue-commit-needs-a-lane \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="$said"
