# Build `alo-installer.exe` and the environment it stages, and publish it as a
# pre-release for somebody to run on a real Windows. Never sign it, and never
# let it be mistaken for a release.
#
# # Why this exists
#
# `release.yml` runs on a tag and only on a tag, which is right: a tag is the
# owner's word that a version is a version, and `crates/alo-image`'s
# `runs_only_on_a_tag` holds it there. But that leaves no way to put a built
# installer in front of a person between tags, and on 2026-10-05 that gap cost
# an evening: `crt-static` landed on `main` as the fix for an installer that
# **did not start at all** on a clean Windows, and the only machine that could
# confirm it had nothing to run.
#
# A fix nobody can try is a fix nobody has tried.
#
# # What it is not, and the six ways it says so
#
# **Not a release**, and since ADR 0096 that is carried by six controls rather
# than by withholding the download. It used to upload an artefact, which needs
# a GitHub session — and a build only insiders can fetch gives no testing,
# which is the hole the NUC walk was in. Nobody else gates test builds: Debian
# and Ubuntu publish dailies publicly and unauthenticated.
#
#  1. it is marked `--prerelease`, so GitHub itself refuses to make it latest
#     (that endpoint is defined as the most recent non-prerelease, non-draft
#     release) — the one control enforced by the API rather than by us
#  2. its tag carries `candidate` and a date, and is never `v<pinned version>`
#  3. it never signs
#  4. it is never written into `image/pinned.toml`
#  5. the programme's own first line says it is a test build and gives the date
#     it was built, through ALO_INSTALLER_CANDIDATE_BUILT below
#  6. exactly one candidate exists at a time: this deletes the previous one
#     before publishing the next
#
# ADR 0046 reserves signing to a person holding a certificate; ADR 0036 reserves
# the image's signature the same way. An artefact from here is unsigned by
# design, Windows will say so, and that warning is correct.
#
# **The checksum beside it proves less than Debian's does, and the difference
# matters.** Debian signs its `SHA256SUMS` for daily builds; we cannot, because
# a signing key in CI is exactly what ADR 0036 rejected. So ours says *these
# are the bytes this workflow produced* — real against a corrupt download, and
# worth nothing against anybody who can write to that page. ADR 0096 says so
# plainly rather than leaving a reader to infer a parity we do not have.
#
# **Not a thing that runs by itself.** `workflow_dispatch` only, like
# `image.yml`, so there is never a red run nobody asked for.
#
# # What it checks before it hands anything over
#
# The same reading the release road does: the import table of the built
# executable, through `the_installer_starts_on_a_clean_windows`. A candidate
# that would die in the loader is worse than no candidate, because somebody
# would carry it to a machine and learn nothing.
name: Installer candidate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  environment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the boot environment the installer stages
        run: |
          podman build -f image/installing/Containerfile \
            --output type=local,dest=alo-installing .

      - name: List every file it is
        working-directory: alo-installing
        run: |
          find EFI -type f | LC_ALL=C sort | xargs sha256sum > alo-installing.sha256
          cat alo-installing.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: alo-installing
          path: alo-installing

  installer:
    needs: environment
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: alo-installing
          path: alo-installing

      - name: Hold this build to that environment
        shell: pwsh
        run: |
          $list = (Get-FileHash -Algorithm SHA256 alo-installing/alo-installing.sha256).Hash.ToLower()
          "ALO_INSTALLER_ENVIRONMENT_SHA256=$list" >> $env:GITHUB_ENV

      # **The date the programme says it was built on**, compiled in the same
      # way the environment hash above already is. ADR 0096's fifth control:
      # the first line on screen reads *this is a test build of alo OS from
      # <date>, it is not a release*. It is the only control that survives the
      # file outliving the page it came from, which is the characteristic
      # failure of a candidate — somebody who kept one and runs it in December
      # has no page to consult and no network, and the date tells them anyway.
      #
      # A release build does not set this, and `alo-installer` holds that in
      # both directions.
      - name: Say which day this build is from
        shell: pwsh
        run: |
          $day = (Get-Date -Format 'yyyy-MM-dd')
          "ALO_INSTALLER_CANDIDATE_BUILT=$day" >> $env:GITHUB_ENV
          "ALO_CANDIDATE_TAG=candidate-$day-$($env:GITHUB_SHA.Substring(0,7))" >> $env:GITHUB_ENV

      - name: Build the installer
        run: cargo build --release --locked -p alo-installer

      # The same reading the release road does, for the same reason: this
      # runner builds Rust, so it has the Visual C++ redistributable and
      # starting the program here would prove nothing about a machine that does
      # not. The import table says what Windows must find before `main`.
      - name: It starts on a Windows that has never built anything
        run: >
          cargo test --release --locked -p alo-installer
          --test the_installer_starts_on_a_clean_windows

      - name: Put the candidate together
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path candidate/alo-installing -Force | Out-Null
          Copy-Item target/release/alo-installer.exe candidate/
          Copy-Item -Recurse alo-installing/* candidate/alo-installing/
          Compress-Archive -Path candidate/* -DestinationPath alo-installer-candidate.zip

      - name: Say what it is, so nobody mistakes it for a release
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 alo-installer-candidate.zip).Hash.ToLower()
          "$hash  alo-installer-candidate.zip" | Out-File -Encoding ascii SHA256SUMS
          Get-Content SHA256SUMS
          "commit: $env:GITHUB_SHA" | Out-File -Encoding ascii -Append SHA256SUMS
          Get-Content SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: alo-installer-candidate
          path: |
            alo-installer-candidate.zip
            SHA256SUMS

      # **Exactly one candidate exists at a time** — ADR 0096's sixth control.
      # Deleted before the next is published, never after: a delete that ran
      # afterwards would take the one just made. No scheduler, so there is
      # nothing to fail on a timer and nothing that could delete a candidate
      # somebody is mid-walk on. Seven days is the stated intent and **nothing
      # enforces it**; what holds is that the candidate on that page is always
      # the newest, and that the programme says which day it is from.
      #
      # `|| true` because there is nothing to delete the first time, and a
      # first run that failed for having no predecessor would be a red run
      # about success.
      # **This step said nothing and could not fail until 2026-10-08.** It was
      # a `foreach` over the deletions followed by `exit 0`, with no output: a
      # `gh release delete` that failed left the step green, and a step that
      # deleted nothing looked identical to one that deleted three.
      #
      # It was found by the owner asking **what the delete step did** before a
      # dispatch they had authorised — and the honest answer was *we cannot
      # tell*, because both earlier dispatches found no previous candidate, so
      # the only branch ever exercised was the one that does nothing. A step
      # whose status cannot answer the question it exists to answer is not a
      # step that has been tested; it is one nobody can test.
      #
      # So it now names each tag as it goes, fails when a deletion fails, and
      # **asks the registry again afterwards** rather than inferring success
      # from having run.
      - name: Take down the previous candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = @(gh release list --limit 100 --json tagName,isPrerelease |
            ConvertFrom-Json |
            Where-Object { $_.isPrerelease -and $_.tagName -like 'candidate-*' })
          if ($old.Count -eq 0) {
            Write-Host "found no previous candidate to take down"
          }
          foreach ($one in $old) {
            Write-Host "deleting $($one.tagName)"
            gh release delete $one.tagName --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "could not delete $($one.tagName): gh exited $LASTEXITCODE"
            }
            Write-Host "deleted $($one.tagName)"
          }
          # **What it did, asserted rather than assumed.** This step's whole job
          # is that no candidate survives it, so it says so by asking again
          # instead of by having run. Control 6 is *exactly one candidate exists
          # at a time*: none after this step, one after the publish below.
          $left = @(gh release list --limit 100 --json tagName,isPrerelease |
            ConvertFrom-Json |
            Where-Object { $_.isPrerelease -and $_.tagName -like 'candidate-*' })
          Write-Host "candidates remaining: $($left.Count)"
          if ($left.Count -ne 0) {
            throw "a candidate survived this step: $($left.tagName -join ', ')"
          }

      # **Published as a pre-release, which is what keeps it off
      # `/releases/latest`** — GitHub defines that endpoint as the most recent
      # non-prerelease, non-draft release and refuses to make a pre-release
      # latest. That is the one control here enforced by the API rather than by
      # a test of ours, so it holds whether or not anybody understands why.
      #
      # `--latest` is never passed, and `crates/alo-image` refuses the file if
      # it ever is.
      - name: Publish it where a person can actually download it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          **This is a test build of alo OS. It is not a release.**

          Built from ``$env:GITHUB_SHA`` on $env:ALO_INSTALLER_CANDIDATE_BUILT.
          It is not signed, and it is not a version anybody decided to
          publish. If you are looking for alo OS, take the latest release
          instead — this build is not it and is never what an install
          resolves to.

          The programme says the same thing on its own first line, so you will
          know what you are holding even if you come back to this file months
          from now.

          ``SHA256SUMS`` beside the download is the checksum of these bytes as
          this workflow produced them. It is worth having against a corrupt
          download and it is not a signature.
          "@
          $notes | Out-File -Encoding utf8 candidate-notes.md
          gh release create $env:ALO_CANDIDATE_TAG --prerelease `
            alo-installer-candidate.zip SHA256SUMS `
            --title "alo OS test build $env:ALO_INSTALLER_CANDIDATE_BUILT (not a release)" `
            --notes-file candidate-notes.md
