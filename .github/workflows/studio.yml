name: alo Studio
on:
  pull_request:
    paths: ['apps/alo-studio/**', 'crates/alo-capture-provider/**', 'crates/alo-capture-remote/**', 'crates/alo-capture-protocol/**', 'crates/alo-media-server/**', 'engines/pipewire/**', 'engines/pipewire-gstreamer/**', 'image/Containerfile', 'image/usr/lib/systemd/system/alo-portald.service', 'Cargo.toml', 'Cargo.lock', '.github/workflows/studio.yml']
  push:
    branches: [main]
    paths: ['apps/alo-studio/**', 'crates/alo-capture-provider/**', 'crates/alo-capture-remote/**', 'crates/alo-capture-protocol/**', 'crates/alo-media-server/**', 'engines/pipewire/**', 'engines/pipewire-gstreamer/**', 'image/Containerfile', 'image/usr/lib/systemd/system/alo-portald.service', 'Cargo.toml', 'Cargo.lock', '.github/workflows/studio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Native desktop libraries
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwayland-dev libinput-dev libseat-dev libxkbcommon-dev libpixman-1-dev libegl1-mesa-dev libgbm-dev libudev-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev dbus-x11 dbus-daemon gnome-keyring at-spi2-core libgtk-3-bin
      - name: Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: studio-desktop
      - name: Optimized desktop regressions
        run: |
          cargo +1.97.0 test --locked --release -p alo-desktop -- --test-threads=1
          cargo +1.97.0 test --locked --release -p alo-shell --lib readback::
      - name: Strict desktop and shell checks
        run: |
          cargo +1.97.0 clippy --locked --release -p alo-desktop --all-targets -- -D warnings
          cargo +1.97.0 clippy --locked --release -p alo-shell --lib -- -D warnings
      - name: Build the desktop for installed recording verification
        run: |
          cargo +1.97.0 build --locked --release -p alo-desktop
          mkdir -p desktop-verification
          cp target/release/alo-desktop desktop-verification/alo-desktop
          git rev-parse HEAD > desktop-verification/source.txt
          cd desktop-verification
          sha256sum alo-desktop > sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: studio-desktop
          path: desktop-verification/
          if-no-files-found: error
          retention-days: 7
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Native libraries and test display
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libgtk-4-media-gstreamer at-spi2-core libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev gstreamer1.0-tools gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pipewire gstreamer1.0-pulseaudio pipewire pipewire-bin pipewire-pulse pulseaudio-utils wireplumber xvfb xdotool dbus-x11 appstream-util desktop-file-utils
      - name: Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/alo-studio
      - name: Format
        working-directory: apps/alo-studio
        run: cargo +1.97.0 fmt --all --check
      - name: Clippy
        working-directory: apps/alo-studio
        run: cargo +1.97.0 clippy --locked --all-targets --features verification -- -D warnings
      - name: Lifecycle and storage refusal tests
        working-directory: apps/alo-studio
        run: cargo +1.97.0 test --locked
      - name: Build the real app and framebuffer recording probe
        working-directory: apps/alo-studio
        run: |
          cargo +1.97.0 build --locked
          cargo +1.97.0 build --locked --features verification --examples
          cargo +1.97.0 build --locked --features verification
      - name: Record, pause, finalize, and decode a real framebuffer
        run: bash apps/alo-studio/packaging/verify-native.sh
      - name: Build the native capture publisher and permission-scoped remote
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/alo-studio/target
        run: cargo +1.97.0 build --locked -p alo-capture-provider -p alo-capture-remote
      - name: Build the capture plugin against the image's pinned base
        run: |
          base=$(sed -n 's/^ARG THE_BASE=//p' image/Containerfile)
          [[ "$base" == *@sha256:* ]]
          docker build --build-arg "THE_BASE=$base" -f engines/pipewire-gstreamer/verification.Containerfile -t studio-capture-verification .
      - name: Record, pause, resume and decode through the pinned native publisher
        run: docker run --rm --network=none -v "$PWD:/source:ro" studio-capture-verification
