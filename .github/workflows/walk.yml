# Walk a booted alo OS machine under KVM, unattended, and keep what it saw.
#
# **Stage 1 of the walk road: measure first.** This first version answers two
# questions and nothing else: is `/dev/kvm` usable on a GitHub-hosted runner,
# and how long do the image, the disk and the first boot take there. The walk
# itself (`crates/alo-walking`) replaces the boot step once those are known.
#
# The `push` trigger on this one branch is for the measurement only, because a
# `workflow_dispatch` workflow cannot be started until it is on main. It is
# removed before this lands.

name: Walk

on:
  workflow_dispatch:
  push:
    branches: [walks-on-kvm]

permissions:
  contents: read

jobs:
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # The image is always main's, whichever branch started this run: a walk
      # image is a walk of main, never of a branch, and is never pushed.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: image-source

      - name: Say which commit the image is built from
        working-directory: image-source
        run: |
          echo "the walk image is built from main at $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Measure the disk before and after making room
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h / /mnt || true

      # GitHub's own documented rule for KVM on its hosted Linux runners.
      - name: Give this job the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM: /dev/kvm is readable and writable by the job" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "KVM: /dev/kvm is not usable by the job" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          nproc; free -g

      - name: Install the emulator and its firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf
          qemu-system-x86_64 --version
          ls -l /usr/share/OVMF/

      - name: Build the walk image
        working-directory: image-source
        run: |
          start=$(date +%s)
          sudo podman build -f image/Containerfile -t localhost/alo-os:walk . > "$RUNNER_TEMP/image-build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/image-build.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/image-build.log"
          echo "image built in $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          sudo podman image prune -f > /dev/null
          sudo podman images
          df -h /

      - name: Write the walk disk
        run: |
          start=$(date +%s)
          mkdir -p walk
          truncate -s 20G walk/alo.raw
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            -v "$PWD/walk":/output \
            localhost/alo-os:walk \
            bootc install to-disk --via-loopback --wipe \
              --filesystem btrfs /output/alo.raw
          sudo chown "$(id -u):$(id -g)" walk/alo.raw
          echo "disk written in $(( $(date +%s) - start )) s, $(du -h walk/alo.raw | cut -f1) actual" | tee -a "$GITHUB_STEP_SUMMARY"
          sudo podman rmi localhost/alo-os:walk > /dev/null || true
          df -h /

      - name: Boot it under KVM and time the first boot
        run: |
          cp /usr/share/OVMF/OVMF_VARS_4M.fd walk/vars.fd
          : > walk/serial.log
          start=$(date +%s)
          qemu-system-x86_64 \
            -machine q35 -enable-kvm -cpu host -m 6144 -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=walk/vars.fd \
            -drive file=walk/alo.raw,format=raw,if=virtio \
            -device virtio-vga \
            -netdev user,id=net0 -device virtio-net-pci,netdev=net0 \
            -display none \
            -serial file:walk/serial.log \
            -qmp tcp:127.0.0.1:4444,server=on,wait=off \
            -no-reboot > walk/qemu.log 2>&1 &
          greeter=""; arrived=""
          while [ $(( $(date +%s) - start )) -lt 3600 ]; do
            sleep 10
            t=$(( $(date +%s) - start ))
            if [ -z "$greeter" ] && grep -aq "the sign-in screen is going up" walk/serial.log; then
              greeter=$t; echo "sign-in screen after $t s" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            if [ -z "$arrived" ] && grep -aq "of this machine's applications arrived" walk/serial.log; then
              arrived=$t; echo "applications after $t s: $(grep -a "of this machine's applications arrived" walk/serial.log | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "$greeter" ] && [ -n "$arrived" ]; then break; fi
            if ! pgrep -f "qemu-system-x86_64 -machine q35" > /dev/null; then
              echo "the machine stopped after $t s" | tee -a "$GITHUB_STEP_SUMMARY"; tail -5 walk/qemu.log; break
            fi
          done
          grep -ac "" walk/serial.log
          grep -aiE "kvm|lagging behind|too slow" walk/serial.log | head -10 || true
          pkill -f "qemu-system-x86_64 -machine q35" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: the-walk
          path: |
            walk/serial.log
            walk/qemu.log
          retention-days: 7
