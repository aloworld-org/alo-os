# Walk a booted alo OS machine under KVM, unattended, and keep what it saw.
#
# The walks before this were done by hand on a lane machine with no KVM, where
# qemu emulated the processor: about 75 minutes of first-boot installs, keys
# arriving 30 to 100 seconds late, shifted keys garbled when sent quickly, and
# screenshots that showed the screen before the key. A GitHub-hosted Linux
# runner exposes `/dev/kvm`, so the same disk boots there at the processor's
# own speed, and `crates/alo-walking` walks it: keys over QMP with explicit
# press and release, a picture once the screen has changed and settled, the
# serial log read for the journal's own sentences, and a pass or a fail for
# each check with its evidence. `docs/walks/walks-on-github.md` says how to run
# it and what it does and does not prove.
#
# **A walk image is not an image anybody installs.** CLAUDE.md's rule — *no
# real image is built while any branch but main exists* — is about images a
# person installs or that are called a candidate or a release. This one:
#
# - is built **from main**: from the commit that was merged when a merge
#   starts it, and from main as it stands when a person does — **unless the
#   person ticks the box to build it from the branch they started it on**:
#   the walk image of a branch CLAUDE.md allows, so a branch is tried on a
#   booted machine before it merges, and the summary names that branch and
#   commit. A walk after a merge is always main's;
# - is **never pushed, signed or published** — no registry is logged in to,
#   and the image is removed from the runner once the disk is written;
# - leaves the runner only as **pictures, a report and the serial log**, kept
#   for seven days. The disk itself is never uploaded.
#
# `crates/alo-walking/tests/the_walk_workflow_publishes_nothing.rs` holds this
# file to each of those.
#
# **It runs by itself after every merge to main**, and a person can also start
# it by hand. The owner decided this on 2026-11-14. A walk takes 25 to 45
# minutes, so walks of main do not pile up: one runs, and only the newest merge
# waits behind it; a merge that lands while another is waiting replaces it.
# Its result is a check on the merged commit, so a walk that fails shows as a
# failed check on main.
#
# **The provider's key is used on every walk after a merge.** By hand it is
# used only when the person ticks the box. Either way GitHub masks it in the
# log, the report says only how many characters were typed, and the serial log
# that is kept has it taken out (`crates/alo-walking/src/redacting.rs`).

name: Walk

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_the_provider:
        description: "Also add an AI provider, typing its key from the ALO_WALK_PROVIDER_KEY secret (a walk after a merge always does)"
        type: boolean
        default: false
      every_application:
        description: "Then ask alo to do one thing in every application a fresh machine ships (needs the provider)"
        type: boolean
        default: false
      image_from_this_branch:
        description: "Build the image from the branch this walk is started on, not from main, to try it before it merges (never published)"
        type: boolean
        default: false
      private_studio_package_run:
        description: "Private Studio recording check: successful manual package run from this exact commit, including its separate reference (requires branch image)"
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# One walk of main at a time; only the newest waits, and nothing running is
# cancelled, so every walk that starts also finishes and says how it ended.
concurrency:
  group: walk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # The image is main's: the merged commit itself after a merge, so the
      # check on that commit is about that commit, and main as it stands when a
      # person starts it — or, when they tick the box, the commit of the branch
      # they started it on, which the summary then names.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.image_from_this_branch && github.sha || 'main' }}
          path: image-source

      - name: Say which branch and commit the image is built from
        working-directory: image-source
        env:
          IMAGE_FROM: ${{ github.event_name != 'push' && inputs.image_from_this_branch && github.ref_name || 'main' }}
        run: |
          echo "The walk image is built from \`$IMAGE_FROM\` at \`$(git rev-parse HEAD)\`." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the walk harness
        run: cargo build --release --locked -p alo-walking

      - name: Check the exact private Studio package run
        if: github.event_name == 'workflow_dispatch' && inputs.private_studio_package_run != ''
        uses: actions/github-script@v7
        env:
          STUDIO_PACKAGE_RUN: ${{ inputs.private_studio_package_run }}
          BRANCH_IMAGE: ${{ inputs.image_from_this_branch }}
        with:
          script: |
            if (process.env.BRANCH_IMAGE !== 'true') throw new Error('Studio requires the matching private branch image');
            if (!/^[1-9][0-9]*$/.test(process.env.STUDIO_PACKAGE_RUN)) throw new Error('Use an exact package run id');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.STUDIO_PACKAGE_RUN)
            });
            if (run.head_sha !== context.sha || run.conclusion !== 'success' ||
                run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/studio-package.yml') {
              throw new Error('Studio packages must come from a successful manual package run at this exact source');
            }

      - name: Receive the normal package and separate private reference
        if: github.event_name == 'workflow_dispatch' && inputs.private_studio_package_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.private_studio_package_run }}
          pattern: studio-*
          path: walk/studio-products

      - name: Validate private package bytes and provenance
        if: github.event_name == 'workflow_dispatch' && inputs.private_studio_package_run != ''
        run: |
          python3 -I apps/alo-studio/verification/prepare_installed_walk.py \
            walk/studio-products/studio-flatpak walk/studio-products/studio-private-reference \
            walk/studio-inputs "$GITHUB_SHA"
          echo "Private Studio input checksums (normal verification features disabled):" >> "$GITHUB_STEP_SUMMARY"
          cat walk/studio-inputs/checksums.txt >> "$GITHUB_STEP_SUMMARY"

      # Nothing is deleted to make room: measured on 2026-11-14, the runner had
      # 86 GB free before anything ran, and the image and the disk together
      # used about 9 GB of it. Said on every run, so a smaller runner says so.
      - name: Say how much room the runner has
        run: df -h /

      # GitHub's own documented rule for KVM on its hosted Linux runners.
      - name: Give this job the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM: \`/dev/kvm\` is readable and writable by this job." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "KVM: \`/dev/kvm\` is not usable by this job, so nothing is walked." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install the emulator and its firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf
          qemu-system-x86_64 --version

      - name: Build the walk image from main, or from the branch asked for
        working-directory: image-source
        run: |
          start=$(date +%s)
          sudo podman build -f image/Containerfile -t localhost/alo-os:walk . > "$RUNNER_TEMP/image-build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/image-build.log"; exit 1; }
          echo "The image was built in $(( $(date +%s) - start )) s." | tee -a "$GITHUB_STEP_SUMMARY"
          sudo podman image prune -f > /dev/null
          df -h /

      - name: Write the walk disk
        run: |
          start=$(date +%s)
          mkdir -p walk
          truncate -s 20G walk/alo.raw
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            -v "$PWD/walk":/output \
            localhost/alo-os:walk \
            bootc install to-disk --via-loopback --wipe \
              --filesystem btrfs /output/alo.raw
          sudo chown "$(id -u):$(id -g)" walk/alo.raw
          echo "The disk was written in $(( $(date +%s) - start )) s, $(du -h walk/alo.raw | cut -f1) of it used." | tee -a "$GITHUB_STEP_SUMMARY"
          sudo podman rmi localhost/alo-os:walk > /dev/null || true
          cp /usr/share/OVMF/OVMF_VARS_4M.fd walk/vars.fd

      # The provider's key is typed on every walk after a merge, and by hand
      # only when the person ticks the box. Without the secret the variable is
      # empty and the walk skips that section and says so.
      - name: Walk it
        env:
          ALO_WALK_PROVIDER_KEY: ${{ (github.event_name == 'push' || inputs.with_the_provider) && secrets.ALO_WALK_PROVIDER_KEY || '' }}
          # A word of its own, because the walk redacts every variable it reads
          # from what it keeps: `yes` would be cut out of every log line.
          ALO_WALK_EVERY_APPLICATION: ${{ inputs.every_application && 'alo-walk-every-application' || '' }}
          ALO_WALK_PRIVATE_STUDIO: ${{ github.event_name == 'workflow_dispatch' && inputs.private_studio_package_run != '' && 'alo-walk-private-studio' || '' }}
        run: |
          if [ -n "$ALO_WALK_PRIVATE_STUDIO" ]; then
            target/release/studio-walk-files --inputs walk/studio-inputs --evidence the-walk/studio > "$RUNNER_TEMP/studio-transfer.log" 2>&1 &
            studio_transfer_pid=$!
            trap 'kill "$studio_transfer_pid" 2>/dev/null || true' EXIT
          fi
          target/release/alo-walk \
            --disk walk/alo.raw \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --variables walk/vars.fd \
            --out the-walk \
            --scratch walk

      - name: State the scope of private recording evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.private_studio_package_run != ''
        run: |
          echo 'The private Studio section checks the installed person flow. Its media still requires decoded continuity, synchronization, source isolation and real-agent permission checks. A completed section alone is not recording acceptance.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: the-walk
          path: the-walk
          retention-days: 7
          if-no-files-found: warn
