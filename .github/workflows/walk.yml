# Walk a booted alo OS machine under KVM, unattended, and keep what it saw.
#
# The walks before this were done by hand on a lane machine with no KVM, where
# qemu emulated the processor: about 75 minutes of first-boot installs, keys
# arriving 30 to 100 seconds late, shifted keys garbled when sent quickly, and
# screenshots that showed the screen before the key. A GitHub-hosted Linux
# runner exposes `/dev/kvm`, so the same disk boots there at the processor's
# own speed, and `crates/alo-walking` walks it: keys over QMP with explicit
# press and release, a picture once the screen has changed and settled, the
# serial log read for the journal's own sentences, and a pass or a fail for
# each check with its evidence. `docs/walks/walks-on-github.md` says how to run
# it and what it does and does not prove.
#
# **A walk image is not an image anybody installs.** CLAUDE.md's rule — *no
# real image is built while any branch but main exists* — is about images a
# person installs or that are called a candidate or a release. This one:
#
# - is built **from main**, whichever branch started the run, because a walk
#   here is a walk of what main is;
# - is **never pushed, signed or published** — no registry is logged in to,
#   and the image is removed from the runner once the disk is written;
# - leaves the runner only as **pictures, a report and the serial log**, kept
#   for seven days. The disk itself is never uploaded.
#
# `crates/alo-walking/tests/the_walk_workflow_publishes_nothing.rs` holds this
# file to each of those.
#
# The `push` trigger on this one branch exists only so the walk can run before
# the workflow is on main — a `workflow_dispatch` workflow cannot be started
# until it is — and is removed before this lands.

name: Walk

on:
  workflow_dispatch:
    inputs:
      with_the_provider:
        description: "Also add an AI provider, typing its key from the ALO_WALK_PROVIDER_KEY secret (unverified steps)"
        type: boolean
        default: false
  push:
    branches: [walks-on-kvm]

permissions:
  contents: read

jobs:
  walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # The image is always main's, whichever branch started this run.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: image-source

      - name: Say which commit the image is built from
        working-directory: image-source
        run: |
          echo "The walk image is built from main at \`$(git rev-parse HEAD)\`." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the walk harness
        run: cargo build --release --locked -p alo-walking

      - name: Make room on the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      # GitHub's own documented rule for KVM on its hosted Linux runners.
      - name: Give this job the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM: \`/dev/kvm\` is readable and writable by this job." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "KVM: \`/dev/kvm\` is not usable by this job, so nothing is walked." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install the emulator and its firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf
          qemu-system-x86_64 --version

      - name: Build the walk image from main
        working-directory: image-source
        run: |
          start=$(date +%s)
          sudo podman build -f image/Containerfile -t localhost/alo-os:walk . > "$RUNNER_TEMP/image-build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/image-build.log"; exit 1; }
          echo "The image was built in $(( $(date +%s) - start )) s." | tee -a "$GITHUB_STEP_SUMMARY"
          sudo podman image prune -f > /dev/null
          df -h /

      - name: Write the walk disk
        run: |
          start=$(date +%s)
          mkdir -p walk
          truncate -s 20G walk/alo.raw
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /var/lib/containers:/var/lib/containers \
            -v "$PWD/walk":/output \
            localhost/alo-os:walk \
            bootc install to-disk --via-loopback --wipe \
              --filesystem btrfs /output/alo.raw
          sudo chown "$(id -u):$(id -g)" walk/alo.raw
          echo "The disk was written in $(( $(date +%s) - start )) s, $(du -h walk/alo.raw | cut -f1) of it used." | tee -a "$GITHUB_STEP_SUMMARY"
          sudo podman rmi localhost/alo-os:walk > /dev/null || true
          cp /usr/share/OVMF/OVMF_VARS_4M.fd walk/vars.fd

      # The provider's key is typed only when a person ticks the box and the
      # secret exists; otherwise the variable is empty and the walk skips that
      # section and says so.
      - name: Walk it
        env:
          ALO_WALK_PROVIDER_KEY: ${{ inputs.with_the_provider && secrets.ALO_WALK_PROVIDER_KEY || '' }}
        run: |
          target/release/alo-walk \
            --disk walk/alo.raw \
            --firmware /usr/share/OVMF/OVMF_CODE_4M.fd \
            --variables walk/vars.fd \
            --out the-walk \
            --scratch walk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: the-walk
          path: the-walk
          retention-days: 7
          if-no-files-found: warn
