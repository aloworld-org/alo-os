[workspace]
resolver = "3"
members = [
  "crates/alo-agentd",
  "crates/alo-answering",
  "crates/alo-appearance",
  "crates/alo-asking",
  "crates/alo-applications",
  "crates/alo-bounding",
  "crates/alo-bounding-map",
  "crates/alo-capability",
  "crates/alo-choosing",
  "crates/alo-context",
  "crates/alo-dock",
  "crates/alo-driving",
  "crates/alo-egress",
  "crates/alo-files",
  "crates/alo-keeping",
  "crates/alo-models",
  "crates/alo-protocol",
  "crates/alo-record",
  "crates/alo-saying",
  "crates/alo-shortcuts",
  "crates/alo-strings",
  "crates/alo-turn",
]
exclude = [
  # The half that runs inside the kernel. It is a different target, a
  # different compiler channel and a different set of lints; `build.rs` in
  # `alo-bounding` is what builds it, and that crate's `main.rs` says why it
  # cannot be a member here.
  "crates/alo-bounding-kernel",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/aloworld-org/alo-os"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
serde_json = "1"
# The kernel, for the two questions the standard library will not answer on a
# stable compiler: who is at the other end of a Unix socket, and which of
# several descriptors has something on it. Reached only by `alo-agentd`, and
# only from `unix.rs`; see that file for why it is a crate rather than lines of
# `unsafe`.
rustix = { version = "1.1", features = ["net", "process", "fs", "event"] }

# The second thing the kernel will only be asked through somebody else's crate,
# and for the same reason as the first: installing a signal handler is
# `sigaction`, every spelling of it in Rust is `unsafe`, and `unsafe_code` is
# forbidden above. `signal-hook`'s self-pipe registration is the one safe API
# for it, and it does exactly what `alo-agentd`'s `stopping.rs` was shaped for —
# a handler that writes one byte to an already-open descriptor and does nothing
# else. Reached only by `alo-agentd`, and only from `signalling.rs`.
signal-hook = { version = "0.4", default-features = false }

# The constitution, expressed where the compiler can enforce it. CLAUDE.md law 3
# forbids stubs and `unwrap()` outside tests; a rule only a reviewer enforces is
# a rule that survives until the reviewer is busy.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
missing_docs_in_private_items = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
