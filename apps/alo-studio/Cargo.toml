[package]
name = "alo-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
description = "A quiet, local-first screen recorder for alo OS"
repository = "https://github.com/aloworld-org/alo-os"

# An installed application, released independently of the operating system.
[workspace]

[features]
verification = []

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
gdk-wayland = { package = "gdk4-wayland", version = "0.10" }
gst = { package = "gstreamer", version = "0.24", features = ["v1_22"] }
gst-app = { package = "gstreamer-app", version = "0.24", features = ["v1_22"] }
gst-video = { package = "gstreamer-video", version = "0.24", features = ["v1_22"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
enumflags2 = "0.7"
futures-channel = "0.3"
futures-util = "0.3"

[[example]]
name = "verify-recording"
required-features = ["verification"]

[[example]]
name = "verify-portal"
required-features = ["verification"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

