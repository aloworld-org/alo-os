[package]
name = "alo-access"
version = "0.0.1"
description = "What each accessibility setting is, and what it changes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The values two of these settings change: the palette a shell draws with, the
# size text is drawn at, and the contrast arithmetic a palette is held to. This
# crate decides accessibility and never colour, so it reads that crate's tokens
# and hands back values in its types.
alo-appearance = { path = "../alo-appearance" }
# The chords the shell ships, so that a keyboard road can be held against them:
# every action that has a chord must also have a Tab stop.
alo-approving = { path = "../alo-approving" }
alo-shortcuts = { path = "../alo-shortcuts" }
# How the attributes a surface of alo's own tree carries are spelt — the
# surface's typed name, a setting's old name, and the key for one no page draws
# yet. The crate that reads them keeps the spelling; this one publishes it
# through `tree` and `old_names` unchanged. Kept there, not here, because this
# crate depends on `alo-approving` and so on `alo-turn`, and `alo-turn` offers
# the reader's two verbs: the spelling here would be a cycle.
alo-adapters = { path = "../alo-adapters" }
# The sentences a person reads about each setting. Hardcoded English is a bug
# (CLAUDE.md), and a setting nobody can find in their own language is the bug
# this crate exists to prevent.
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
thiserror = { workspace = true }
# The file a person's settings are kept in (ADR 0038), in the shape every other
# settings file in this repository is written in.
toml = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The scheme a palette is asked for, in a test that reads one.
alo-appearance = { path = "../alo-appearance" }
# The walk with the screen off asks a question in Greek and is answered in
# Greek: which language a question was written in is that crate's decision, and
# this test holds the sequence rather than repeating the decision.
alo-instructing = { path = "../alo-instructing" }
# The same walk reads each sentence out of the machine's whole vocabulary, not
# out of this crate's constants, because what a person hears is what the
# assembled machine says.
alo-saying = { path = "../alo-saying" }
