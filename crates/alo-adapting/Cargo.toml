# Who the fine-tune runs as, and the grant it runs under.
alo-capability = { path = "../alo-capability" }
# The sentences a person reads about what their model will learn from.
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
thiserror = { workspace = true }

