[package]
name = "alo-agent"
version = "0.0.1"
description = "The agent: a person's words, a model asked what to do, and the machine doing it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The two things that cross the door, and the envelope they cross in. This
# crate composes no JSON: it writes what `FromAnAgent` serialises and reads
# what `ToAnAgent` parses, so the dialect has one owner.
alo-protocol = { path = "../alo-protocol" }
# The verbs the machine has, which are what a model is told about. Read and
# never decided from: the list comes from the daemon's own registry.
alo-capability = { path = "../alo-capability" }
# What a model is shown, including a turn already in progress. **The only
# place any text a model reads is written** — a sentence composed here would be
# a second author of the one thing every grade is a statement about.
alo-instructing = { path = "../alo-instructing" }
# The list of verbs this machine offers, from the one place that builds it. An
# agent cannot ask the daemon for it: `FromAnAgent` has three messages and none
# is *what may I ask for*, because `docs/contracts/agent-verbs.md` is the answer
# for whoever writes an adapter. Nothing else in `alo-turn` is used here — this
# process carries out no verb and holds no machine.
alo-turn = { path = "../alo-turn" }
# `SO_PEERCRED` on this process's input, which is how ADR 0109's road says which
# person asked. `std::os::unix::net::UnixStream::peer_cred` is unstable —
# feature `peer_credentials_unix_socket`, rust-lang #42839 — and `CLAUDE.md`
# forbids `unsafe` workspace-wide, so a `getsockopt` by hand is not available
# either. `alo-agentd`, `alo-broker` and `alo-sessiond` rent the same crate for
# the same question; this is the fourth.
rustix = { workspace = true, features = ["net", "process"] }
thiserror = { workspace = true }

[dev-dependencies]
# The real verbs and the real words a turn is about, so the tests script shapes
# the daemon really sends rather than hand-made ones.
alo-files = { path = "../alo-files" }
alo-strings = { path = "../alo-strings" }
