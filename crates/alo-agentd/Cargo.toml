[package]
name = "alo-agentd"
version = "0.0.1"
description = "The agent service: the socket, which door a caller is on, and the turn it holds."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Everything in this crate is a Unix socket and the credentials a kernel keeps
# for one. On any other host it compiles to nothing at all rather than to a
# version of itself that pretends; `lib.rs` is the whole of that argument.
[target.'cfg(target_os = "linux")'.dependencies]
# The one rented thing here, and `unix.rs` is the only file that names it.
# `UnixStream::peer_cred` and waiting on several descriptors at once are both
# outside what std will do on a stable compiler, `CLAUDE.md` forbids unsafe, and
# a daemon nobody else can build on a stable compiler is not a daemon we ship —
# so asking the kernel who is on the other end, and which end has something on
# it, is a crate.
rustix = { workspace = true }
thiserror = { workspace = true }

# What crosses the socket, and what is behind it. Since item 21d this crate
# holds a turn, so it reaches both: `alo-protocol` for the two doors' requests
# and answers, and `alo-turn` for the order the steps happen in. It decides
# nothing either of them decides — `alo-capability` is here for the grants a
# turn is begun with and the one refusal a number nobody proposed gets,
# `alo-context` for what an invocation offered, and `alo-strings` because every
# sentence that goes back is rendered from the machine's own vocabulary.
alo-capability = { path = "../alo-capability" }
alo-context = { path = "../alo-context" }
alo-protocol = { path = "../alo-protocol" }
alo-strings = { path = "../alo-strings" }
alo-turn = { path = "../alo-turn" }

# What a machine is arranged out of, for the tests only. The service is handed a
# `Machine` rather than building one, so which resolver, which indicator and
# where the record goes stay one decision made in one place — and that place is
# the process (queue item 21e), not this crate.
[target.'cfg(target_os = "linux")'.dev-dependencies]
alo-egress = { path = "../alo-egress" }
alo-files = { path = "../alo-files" }
alo-keeping = { path = "../alo-keeping" }
alo-record = { path = "../alo-record" }

[lints]
workspace = true
