[package]
name = "alo-agentd"
version = "0.0.1"
description = "The agent service: the socket, which door a caller is on, and the turn it holds."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Everything in this crate is a Unix socket and the credentials a kernel keeps
# for one. On any other host it compiles to nothing at all rather than to a
# version of itself that pretends; `lib.rs` is the whole of that argument.
[target.'cfg(target_os = "linux")'.dependencies]
# The one rented thing here, and `unix.rs` is the only file that names it.
# `UnixStream::peer_cred` and waiting on several descriptors at once are both
# outside what std will do on a stable compiler, `CLAUDE.md` forbids unsafe, and
# a daemon nobody else can build on a stable compiler is not a daemon we ship —
# so asking the kernel who is on the other end, and which end has something on
# it, is a crate.
rustix = { workspace = true }
thiserror = { workspace = true }

# The second rented thing, and `signalling.rs` is the only file that names it.
# A service is asked to stop by `SIGTERM`, installing a handler for one is
# `sigaction`, and there is no safe spelling of that anywhere — so the choice is
# this crate or `unsafe`, which the workspace forbids. What is used of it is one
# function: register a signal to write one byte to a descriptor we already hold.
signal-hook = { workspace = true }

# What a machine says about itself, and the one format it says it in. TOML
# rather than the JSON the record and the protocol use, because those two are
# written by programs and read by programs and this one is typed by whoever
# stands a machine up — a trailing comma is a machine that will not start, and a
# comment is how the person after them finds out why a number is what it is.
serde = { workspace = true }
toml = { workspace = true }

# What crosses the socket, and what is behind it. Since item 21d this crate
# holds a turn, so it reaches both: `alo-protocol` for the two doors' requests
# and answers, and `alo-turn` for the order the steps happen in. It decides
# nothing either of them decides — `alo-capability` is here for the grants a
# turn is begun with and the one refusal a number nobody proposed gets,
# `alo-context` for what an invocation offered, and `alo-strings` because every
# sentence that goes back is rendered from the machine's own vocabulary.
alo-capability = { path = "../alo-capability" }
alo-context = { path = "../alo-context" }
alo-protocol = { path = "../alo-protocol" }
alo-strings = { path = "../alo-strings" }
alo-turn = { path = "../alo-turn" }

# What the process assembles a machine out of, which is queue item 21f and the
# reason the first two moved up here out of the dev-dependencies below: a
# resolver and an indicator were something only a test made until there was a
# `main` to make the real ones. `alo-saying` is where the machine's one
# vocabulary comes from, and this crate is the process that adds its own three
# strings on top of it.
alo-egress = { path = "../alo-egress" }
alo-files = { path = "../alo-files" }
alo-saying = { path = "../alo-saying" }

# The sixth, and the first that is reached for something a machine is *told*
# rather than something a turn does: `Keeping` is how long the record is kept,
# which ADR 0004 gives to the organisation that manages the machine, and a
# description that named a number of days of its own would be a second answer
# beside the one `alo-keeping` already writes into the record's first line.
alo-keeping = { path = "../alo-keeping" }

# Somewhere for a test's machine to write what happened that is not a file on a
# disk. The process writes to `alo-keeping`'s real one; a test wants to read the
# entries back and count them, which is what `alo_record::Record` is.
[target.'cfg(target_os = "linux")'.dev-dependencies]
alo-record = { path = "../alo-record" }

# The service, as a machine really runs it. `src/lib.rs` is every decision and
# this is the process that makes them in order — thin on purpose, because what a
# process does is one sequence and one exit code, and everything it decides on
# the way is in `starting.rs` where a test can reach it.
[[bin]]
name = "alo-agentd"
path = "src/main.rs"

[lints]
workspace = true
