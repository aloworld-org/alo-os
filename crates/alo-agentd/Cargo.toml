[package]
name = "alo-agentd"
version = "0.0.1"
description = "The socket the agent service listens on, and which of its two doors a caller is on."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Everything in this crate is a Unix socket and the credentials a kernel keeps
# for one. On any other host it compiles to nothing at all rather than to a
# version of itself that pretends; `lib.rs` is the whole of that argument.
[target.'cfg(target_os = "linux")'.dependencies]
# The one rented thing here, and `unix.rs` is the only file that names it.
# `UnixStream::peer_cred` is unstable in std (rust-lang#42839), `CLAUDE.md`
# forbids unsafe, and a daemon nobody else can build on a stable compiler is not
# a daemon we ship — so asking the kernel who is on the other end is a crate.
rustix = { workspace = true }
thiserror = { workspace = true }

# The whole point of a door is what comes through it, so the test that says
# these two doors are the protocol's two doors reads a real request off a real
# socket with the reader the door chose. Nothing here is compiled into the
# crate: a door that knew what was being carried through it would be two
# responsibilities in one place.
[target.'cfg(target_os = "linux")'.dev-dependencies]
alo-protocol = { path = "../alo-protocol" }

[lints]
workspace = true
