[package]
name = "alo-appearance"
version = "0.0.1"
description = "What a machine looks like: the background, the lock screen, light and dark, and the text size — and which of it a person chose."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The rule `appearance.toml` is kept by: only the difference, refused whole when
# wrong, written whole or not at all (ADR 0038).
alo-capability = { path = "../alo-capability" }
alo-kept = { path = "../alo-kept" }
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Checks the snapshot's recorded revision in `a_palette_with_one_source.rs`.
# Figma exposes no file version through the interface this repository can
# reach, so the committed export's SHA-256 is what identifies the inspected
# state — and a hash written in a document that nothing compares is a
# description the file cannot contradict, which is the fault that let the
# manifest's byte count sit stale through a refresh.
sha2 = { workspace = true }
# Reads `docs/design/palette.toml` in `a_palette_with_one_source.rs`. A
# dev-dependency deliberately: the shell carries the six as constants and must
# never parse a file to draw a frame — what reads the source is the test holding
# those constants to it.
toml = { workspace = true }

[lints]
workspace = true
