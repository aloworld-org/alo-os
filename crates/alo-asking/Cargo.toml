[package]
name = "alo-asking"
version = "0.0.1"
description = "Putting a question to a model, with what leaves the machine decided and shown first."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **Off, and off is what a machine builds.** `trust-a-test-authority` compiles
# `src/an_authority_a_test_made.rs`, which lets a test name a certificate
# authority of its own so that a server it owns can be verified for real. It is
# turned on by a `dev-dependencies` entry and by nothing else; the image builds
# `--package alo-agentd --package alo-boundaryd`, which resolves no
# dev-dependency, and `alo-secrets/tests/nothing_ships_the_fixture.rs` refuses
# any manifest that enables it outside a `dev-dependencies` table.
[features]
trust-a-test-authority = []

[dependencies]
# The place a question may go, and the failure it becomes when it does not
# answer. This crate never decides where a question goes; it carries out a
# decision `alo-answering` already made, and hands back the failure that crate
# is the only maker of.
alo-answering = { path = "../alo-answering" }
# Whose authority the egress is under.
alo-capability = { path = "../alo-capability" }
# Law 1. Nothing here opens a socket without a `Departing`, and the only maker
# of one is the indicator.
alo-egress = { path = "../alo-egress" }
# The provider, its key, and where an answer came from.
alo-models = { path = "../alo-models" }
# Two refusals a person reads, in the language they read.
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# The record is nobody's dependency here — this crate hands back the departure
# and writes nothing down. The integration test walks the whole journey into it
# to prove the handing back is enough.
alo-record = { path = "../alo-record" }

# The person's settings, which this crate never writes. `Vetting` tests a
# provider and saves nothing; the integration test walks from the test to the
# one door that does save — `alo_choosing::Choosing::adding`, unchanged — to
# prove that a provider which did not work writes nothing, and that a person
# may still save it if they say so. A dev-dependency and not a dependency
# because the direction matters: a crate that puts questions on a socket has no
# business holding a door to somebody's settings file.
alo-choosing = { path = "../alo-choosing" }

# The machine's one vocabulary, which is what a process really holds. This
# crate's own tests are written against its own list and its neighbours'; the
# integration test asks the question those cannot — whether every sentence a
# provider test can produce is one the whole machine can say. A dev-dependency
# for the direction every crate here takes: a crate that says something is
# collected by `alo-saying`, and never reaches for it.
alo-saying = { path = "../alo-saying" }

[lints]
workspace = true
