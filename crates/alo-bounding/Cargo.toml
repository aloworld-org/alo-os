[package]
name = "alo-bounding"
version = "0.0.1"
description = "The boundary a turn runs inside: the BPF LSM loaded, the cgroup made, and the one grant the kernel is told about."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

# Everything in this crate is a BPF program, a cgroup and a map the kernel
# holds. On any other host it compiles to nothing at all rather than to a
# version of itself that pretends, which is `alo-agentd`'s argument and the same
# one: a boundary that could be constructed on a machine that cannot impose it
# would be a type whose existence means nothing.
[target.'cfg(target_os = "linux")'.dependencies]
# The one rented thing on this side, and `bounding.rs` is the only file that
# names it. ADR 0015 chose it: Rust on both sides, no `libbpf`, no third
# language. What is used of it is loading an object, filling two maps and
# attaching one program.
aya = "0.14"
thiserror = { workspace = true }

# The map, as both halves read it. The other half is
# `crates/alo-bounding-kernel`, which this crate's `build.rs` compiles and
# embeds.
alo-bounding-map = { path = "../alo-bounding-map" }

# The one sentence a person reads when a turn could not be bounded. Every other
# reason in `failing.rs` keeps its English for whoever stands the machine up;
# this is the crossing the 9-series makes every crate that says anything take.
# It is not in `alo-saying`'s list, for the reason `alo-agentd` is not: this
# crate is Linux, and a vocabulary one string shorter on one host would be a
# translation refused on that host and accepted on another.
alo-strings = { path = "../alo-strings" }

# Only so this crate's one sentence can be held to the rule every other list is
# held to: that nothing alo OS says names something alo OS rents. `alo-saying`
# asks it of the machine's whole vocabulary and this list is not in that
# vocabulary, so asking here is what stops the exemption being a hole.
[target.'cfg(target_os = "linux")'.dev-dependencies]
alo-saying = { path = "../alo-saying" }

[lints]
workspace = true
