[package]
name = "alo-by-hand"
version = "0.0.1"
description = "Every verb alo OS ships, held to naming how a person does the same thing without the agent."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The verbs themselves, read out of the registry the machine enforces rather
# than out of a list written beside it. Nothing here declares a verb; this crate
# is handed the same `Verbs` a daemon would be.
alo-capability = { path = "../alo-capability" }
# The findings are sentences whoever is adding a verb acts on, and each one
# names the verb it is about. This crate says nothing to a person in their own
# language — see `crate` documentation for why an author's English is right here
# and `alo-strings` is not.
thiserror = { workspace = true }

[dev-dependencies]
# Every verb alo OS ships, on the one list, with the crates that declare them.
# It is the measurement rather than the method, so it is here and not above:
# this crate checks whatever list it is handed, and the test is what hands it
# the real one. Until 2026-09-17 the real one was written out here and again in
# `alo-software`'s test of the same verbs, and two copies of it broke three
# lanes in a day for changes none of them made. `alo-declared` depends on this
# crate for the workspace walk, which is a dependency cycle only through these
# dev-dependencies and is what Cargo allows them for.
alo-declared = { path = "../alo-declared" }
# The verbs the fixtures below are about, declared the way the real ones are.
# Nothing in this crate holds a verb's name, so a fixture needs real verbs to be
# a fixture about anything.
alo-files = { path = "../alo-files" }

[lints]
workspace = true
