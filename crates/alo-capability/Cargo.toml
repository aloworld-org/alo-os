[package]
name = "alo-capability"
version = "0.0.1"
description = "What an agent may reach, and under whose authority (ADR 0001)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Every refusal in this crate is read by a person, and `CLAUDE.md` calls
# hardcoded English a bug. `alo-strings` depends on nothing itself, so the crate
# whose value is being small enough to audit stays that way.
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# **To read the choice back as a person's settings file holds it.** A test that
# compared the enum to itself would prove the enum; what matters is that the
# words a person sees in their own file mean what this crate thinks, and that a
# spelling it does not know is refused rather than becoming a permission.
toml = { workspace = true }

[lints]
workspace = true
