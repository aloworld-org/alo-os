[package]
name = "alo-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# **The process that stands a person's desktop up, and the one that reads their
# machine to fill it.**
#
# A package of its own rather than another binary inside `alo-shell`, and the
# reason is a rule rather than tidiness: the shell shows and never measures, and
# shell task 15's constraint is that no call into `/sys`, the media server or
# the network manager is added *from `crates/alo-shell`*. A binary living in
# that directory reading a battery would be that call, whatever the module
# boundary said. So the reading lives here, beside the process it is for, and
# `alo-shell` keeps taking its readings as data.
[target.'cfg(target_os = "linux")'.dependencies]
# **How this binary starts an application, and why it is wired here.**
#
# `alo_portals::activated` sends `Activate` to an application's own bus name —
# D-Bus activation, the same call `Open` is. `alo-shell` deliberately does not
# depend on `alo-portals` for real: the compositor has no business reaching
# portal *policy*, which is what that crate holds. So the shell carries the ask
# and this binary carries the sending, which is what a binary is for.
alo-portals = { path = "../alo-portals" }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Everything a desktop is drawn from, and the loop that draws it.
alo-shell = { path = "../alo-shell" }
# Where this machine keeps its record, read from its description so the shell is
# told rather than reads it. Already in this binary's graph through alo-shell.
alo-recounting = { path = "../alo-recounting" }
# Where this machine keeps the keyboard a person chose, so this binary reads the
# same file the greeter does. Named here rather than reached through alo-shell:
# a path is a fact about the machine and this is the crate that reads machines.
alo-keyboards = { path = "../alo-keyboards" }
# The four readings a status area shows, each from the entry point the crate
# that owns it already has. Read here and handed over; none of them is decided.
alo-power = { path = "../alo-power" }
alo-sound = { path = "../alo-sound" }
alo-networks = { path = "../alo-networks" }
alo-formats = { path = "../alo-formats" }
# What the desktop itself is made of, handed to the shell the same way.
alo-appearance = { path = "../alo-appearance" }
# The canvas layout a person left, and where their folder is. **The shell asks
# this binary for the layout and tells it when the layout moved**, because the
# shell shows and never measures — and a file in a person's folder is a reading
# like the battery and the network above.
alo-arranging = { path = "../alo-arranging" }
alo-choosing = { path = "../alo-choosing" }
# The keyring a provider's key is kept in, and the flow that says what a
# person typed. Both are here rather than in alo-shell because saving is a
# writing of the machine, and that crate shows rather than measures.
alo-secrets = { path = "../alo-secrets" }
# The key and the reference to it, which WhatToSave carries and this binary
# has to be able to name on the way to the keyring.
alo-models = { path = "../alo-models" }
alo-setting-up = { path = "../alo-setting-up" }
# The task a request becomes.
alo-tasks = { path = "../alo-tasks" }
alo-shortcuts = { path = "../alo-shortcuts" }
alo-access = { path = "../alo-access" }
alo-dividing = { path = "../alo-dividing" }
alo-dock = { path = "../alo-dock" }
# **What this machine has installed**, which is the other half of the Dock's
# default pins: `alo-dock` holds the roles and this crate reads the machine, and
# only a binary sees both. See `crate::what_this_machine_offers`.
alo-software = { path = "../alo-software" }
alo-applications = { path = "../alo-applications" }
# What applications this machine has and what each calls its icon, read off
# its desktop entries. The shell may not take a reading of the machine; this
# binary is where readings are taken and handed over as data.
alo-installed = { path = "../alo-installed" }
# Where the icon one of them named actually is, by the icon theme rules.
alo-icons = { path = "../alo-icons" }
# The one decoder in this workspace, already pinned by alo-shell at the same
# version. PNG only here: nothing in this repository rasterises an SVG, and
# ADR 0101 puts a rasteriser behind the dependency and ADR process.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

# Where this person's grants and pairings are kept, which Settings reads at the
# moment a person opens it. For those two paths only: `this_persons_grants`
# asks the kernel whose session this is, so this crate keeps its own rule that
# a desktop never takes a person's number from a variable.
alo-remembering = { path = "../alo-remembering" }
# For one path: the socket this person's daemon listens on, which a revocation
# in Settings knocks at. Named by the crate that owns the door rather than
# spelled here, and keyed by the same one kernel question as the grants above.
alo-changing = { path = "../alo-changing" }
# The windows a person put aside. Held here because the panel at the edge is
# drawn from it, and empty because nothing in this binary puts one aside yet.
alo-put-aside = { path = "../alo-put-aside" }
alo-egress = { path = "../alo-egress" }
alo-indicator = { path = "../alo-indicator" }
alo-saying = { path = "../alo-saying" }
alo-strings = { path = "../alo-strings" }
# The machine's own clock, for the one reading that has no device to ask.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

[[bin]]
name = "alo-desktop"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# A real Secret Service on a bus nobody else can reach, so the save road is
# measured against the implementation a machine would really have rather than
# against a stub whose refusals we wrote ourselves.
alo-keyring-fixture = { path = "../alo-keyring-fixture" }

# **The door that shows an egress, for the one test that makes a real request.**
#
# `a_provider_a_person_added_really_answers_tests.rs` asks a live provider
# whether the key this road saved works. It reached `alo_models::Trying`
# directly until 2026-10-22, which is the wire with no indicator — caught by
# `alo-asking`'s own guard, *nothing that ships reaches the wire except through
# the door that shows it*. `Vetting` is that door.
#
# **Dev only, and the direction matters.** `alo-desktop` does not test a
# provider as part of what it does; it saves one. A `--package` release build
# compiles no dev-dependency, so this links nothing into the shipped binary and
# says nothing about whether the desktop may depend on the asking crate.
alo-asking = { path = "../alo-asking" }

# Whose authority an egress is under, which `Vetting::under` requires by name
# so that what the indicator shows and what a record says cannot disagree about
# who asked. Dev only, for the same reason as `alo-asking` above.
alo-capability = { path = "../alo-capability" }
