[package]
name = "alo-dividing"
version = "0.0.1"
description = "Which window has which share of a display, and how the shares hold together while a person works."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# A keyboard split is a shortcut, and the chord it answers to is that crate's
# value: this crate reads what a chord does and never binds one of its own.
alo-shortcuts = { path = "../alo-shortcuts" }
alo-strings = { path = "../alo-strings" }
# A remembered division is written to the person's folder (ADR 0038), which is
# the first thing this crate keeps. What is written is applications and shares
# — never a window's title or a document's name — and the file is TOML, as
# every other settings file in this repository is.
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true

# The walk through a working morning meets five crates' words at once, because a
# person does not meet them one crate at a time. Test-only: nothing this crate
# ships reads any of them.
[dev-dependencies]
alo-clipboard = { path = "../alo-clipboard" }
alo-desktops = { path = "../alo-desktops" }
alo-handing = { path = "../alo-handing" }
alo-keyboards = { path = "../alo-keyboards" }
alo-menus = { path = "../alo-menus" }
alo-saying = { path = "../alo-saying" }
