[package]
name = "alo-dock"
version = "0.0.1"
description = "Where the dock sits, which way it runs, and when a name gives way to an icon — the layout model, measured rather than judged by eye."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The rule `dock.toml` is kept by: only the difference, refused whole when
# wrong, written whole or not at all (ADR 0038).
alo-kept = { path = "../alo-kept" }
alo-appearance = { path = "../alo-appearance" }
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Reads the text of `dock.toml` in `keeping.rs`'s tests, to hold the list of
# keys to what a change writes.
toml = { workspace = true }

[lints]
workspace = true
