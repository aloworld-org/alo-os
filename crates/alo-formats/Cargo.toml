[package]
name = "alo-formats"
version = "0.0.1"
description = "Regional formats and timezones, per language, from rented CLDR data."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The 24 languages this machine carries, and nothing about how they are written.
alo-strings = { path = "../alo-strings" }
# CLDR itself, rented and never edited (ADR 0011, and this plan's constraint):
# how a date, a time and a number are written in each language is Unicode's
# answer, kept up to date by people who do that work, and a table of our own
# would be a second answer that drifts from it in the languages nobody here
# reads.
icu = { version = "2", features = ["compiled_data"] }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
