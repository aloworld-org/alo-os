[package]
name = "alo-formats"
version = "0.0.1"
description = "Regional formats and timezones, per language, from rented CLDR data."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The 24 languages this machine carries, and the words this crate says.
alo-strings = { path = "../alo-strings" }
# The one rule every file in a person's folder is kept by (ADR 0038):
# `formats.toml` is written whole or not at all, and a file that does not read
# is refused whole rather than half-honoured.
alo-kept = { path = "../alo-kept" }
# CLDR itself, rented and never edited (ADR 0011, and this plan's constraint):
# how a date, a time and a number are written in each language is Unicode's
# answer, kept up to date by people who do that work, and a table of our own
# would be a second answer that drifts from it in the languages nobody here
# reads.
#
# `unstable` is for one thing: what each region is called, in the person's own
# language (`icu::experimental::displaynames`). CLDR has every country's name
# in all 24 languages, and a list of names of our own would be wrong first in
# Maltese and Irish. It is confined to `region_names.rs`, so an upgrade that
# moves that API breaks one file loudly rather than anything quietly. ADR 0136
# records the decision and what to check on every upgrade of icu.
icu = { version = "2", features = ["compiled_data", "unstable"] }
serde = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
