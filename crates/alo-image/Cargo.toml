[package]
name = "alo-image"
version = "0.0.1"
description = "What the image owes the two daemons, and whether the files it ships agree with each other."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

# The retention rule, as the crate that owns it says it. ADR 0004 gives how
# long a record is kept to the organisation that manages the machine, so the one
# thing an image may write is `forever` — and asking `alo_keeping::Keeping`
# whether that is what it says is one answer rather than a second spelling of
# the same question in this crate.
alo-keeping = { path = "../alo-keeping" }

# What a session hands a daemon started inside it. The agent's unit states the
# person's runtime directory and bus, and asking the crate that derives them
# from a sign-in is one answer rather than a second spelling of `/run/user` in a
# checker — which is exactly the drift this crate exists to catch elsewhere.
alo-entering = { path = "../alo-entering" }

# Where a sign-in looks for the accounts this machine has. The one thing an
# image is answerable for about that file is that it does **not** ship one, and
# asking the crate that owns the path is one answer rather than a second
# spelling of `/etc/alo/accounts.toml` in a checker — which is the drift this
# crate exists to catch everywhere else.
alo-accounts = { path = "../alo-accounts" }

# Where the one privileged thing that turns a password into a session opens its
# door (ADR 0024). The unit's `RuntimeDirectory=` and the path `alo-sessiond`
# binds are written in two files, and a service whose directory is not where its
# own code looks is a door that is never opened — asking the crate that owns the
# path is one answer rather than a second spelling of `/run/alo-sessiond` here.
alo-sessiond = { path = "../alo-sessiond" }

# The catalogue, for the one question the recipe cannot answer about itself:
# whether the model it carries is one somebody measured. `docs/features.md`
# promises a catalogue *measured by us, not claimed by the publisher*, so a
# recipe naming a model the catalogue never heard of — or one nobody put to
# `alo-driving` — is that promise broken in a build argument. Reading the
# catalogue is one answer rather than a list of model names copied into a
# checker, which is the drift this crate exists to catch.
alo-models = { path = "../alo-models" }

[lints]
workspace = true
