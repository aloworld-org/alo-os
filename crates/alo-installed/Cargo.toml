[package]
name = "alo-installed"
version = "0.0.1"
description = "What applications this machine has, read from its desktop entries."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The shape of the answer. This crate is the reading `alo-applications` says it
# holds no opinion about — see this crate's own header for why that boundary is
# honoured by a separate crate rather than bent inside that one.
alo-applications = { path = "../alo-applications" }
# The kinds a declaration is read into, which this crate names only in its tests
# and in what it hands back; the type is alo-opening's.
alo-opening = { path = "../alo-opening" }

[lints]
workspace = true
