[package]
name = "alo-installed"
version = "0.0.1"
description = "What applications this machine has, read from its desktop entries, and what each flatpak package lets it reach."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The shape of the answer. This crate is the reading `alo-applications` says it
# holds no opinion about — see this crate's own header for why that boundary is
# honoured by a separate crate rather than bent inside that one.
alo-applications = { path = "../alo-applications" }
# The closed list of applications drawn by Chromium, which an application
# built on Electron joins (`built_on_electron`).
alo-launching = { path = "../alo-launching" }
# The kinds a declaration is read into, which this crate names only in its tests
# and in what it hands back; the type is alo-opening's.
alo-opening = { path = "../alo-opening" }
# The language a person reads, for the name a sentence calls an application by
# (`what_a_person_calls_it`).
alo-strings = { path = "../alo-strings" }

[lints]
workspace = true
