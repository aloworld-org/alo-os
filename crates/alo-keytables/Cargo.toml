[package]
name = "alo-keytables"
version = "0.0.1"
description = "What each key types on each of the layouts the installer offers, as a table generated by asking xkbcommon and checked in — so that the one program running as root in the install environment turns a keycode into a letter with no C library and no parser of anybody else's format."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# **No dependencies, and that is the point of the crate existing.**
#
# `alo-installing` is built static against musl so that what is copied into the
# install environment depends on nothing in it, and it is the one program in
# this repository that runs as root against a disk it is about to overwrite.
# Putting this table in `alo-keyboards` would have reached that program through
# `alo-shortcuts` and `alo-kept` for the sake of one lookup; linking
# `libxkbcommon` there would have spent the static property outright. So the
# table is its own crate with nothing under it.
[dependencies]

[lints]
workspace = true
