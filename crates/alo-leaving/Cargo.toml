[package]
name = "alo-leaving"
version = "0.0.1"
description = "Leaving a machine: logging out in an order that lets every application save, switching user behind a lock, and what was open — applications and where, never what was in them."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The seat, read and never edited. Locking is task 1's decision and this crate
# makes none of its own about it: switching user locks through
# `alo_locking::Seat::locked`, and a locked machine answers this crate's two
# doors with `alo_locking::NotWhileLocked` — the lock screen's own sentence,
# because what the lock screen says is also task 1's.
alo-locking = { path = "../alo-locking" }
# The agent's overlay, closed by locking the seat on the way to the sign-in.
alo-overlay = { path = "../alo-overlay" }
# Whose accounts the screen is handed to, and what the greeter stands at. Read:
# nothing here authenticates anybody, and nothing here opens or ends a session.
alo-accounts = { path = "../alo-accounts" }
alo-greeting = { path = "../alo-greeting" }
# What an application's identifier is, declared once. What was open is kept as
# the identifier a grant is made over and never as the name a packager wrote.
alo-applications = { path = "../alo-applications" }
# The name the shell knows a screen by, which is what *which display* means
# here and in `alo-displays`.
alo-appearance = { path = "../alo-appearance" }
# What a split of a screen is called. `alo_dividing::Place` is read off the
# geometry by the crate that owns divisions; this one only writes down which
# one a window was in.
alo-dividing = { path = "../alo-dividing" }
# The rule `leaving.toml` is kept by: only the difference, refused whole when
# wrong, written whole or not at all (ADR 0038).
alo-kept = { path = "../alo-kept" }
# Every sentence this crate can say, declared rather than written into a file.
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The machine's one vocabulary, for the test that asks whether what this crate
# says is collected at all.
alo-saying = { path = "../alo-saying" }
# Reads the text of `leaving.toml` in `keeping.rs`'s tests, to hold the list of
# keys to what a change writes.
toml = { workspace = true }

[lints]
workspace = true
