# The one directory this road needs, and the mode of it is the decision.
#
# `systemd-tmpfiles` reads this. It belongs in `usr/lib/tmpfiles.d/` on a
# machine and lives beside the crate until the image carries this program —
# `crates/alo-letting-go/tests/forgetting_is_the_persons_own_act.rs` holds every
# line of it, and `image/usr/lib/tmpfiles.d/alo.conf` is where it goes.
#
# /run/alo is already made there, 0755 root:root, so nothing here makes it.

# Where a person's session leaves the act it was approved for
# (ADR 0045 point 5, `crates/alo-letting-go/src/asking.rs`).
#
# **1733, and every digit of it is an argument.**
#
# - `7` for root, which is the only thing that reads this folder: the privileged
#   unit walks it, takes everything in it and removes it.
# - `3` for the group and `3` for everybody — write and search, and **no read**.
#   Anybody may leave an asking, because everybody with a session on this
#   machine is a person who may forget their own undo. Nobody may list what is
#   in it, because who has asked to forget their own history is nobody else's
#   business.
# - The sticky bit, so that one person cannot remove or rename another's asking.
#   Without it a machine with two people on it has a way for one of them to stop
#   the other asking, which is a small thing that would be very hard to notice.
#
# **And nothing in it carries authority.** An asking names no person, no folder,
# no path and no turn: whose act it is, is the user the filesystem records as
# having written it. So a folder anybody may write to is exactly the right shape
# for this and could not be made dangerous by widening it — the worst a stranger
# with a session can do by leaving a name here is start a unit that reads their
# own settings folder's owner and finds nothing of theirs to forget.
#
# On /run, and that is a promise too: it is cleared when the machine starts, so
# an approval to forget can never outlive the session it was given in.
d /run/alo/asked-to-forget 1733 root root -
