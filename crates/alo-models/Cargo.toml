[package]
name = "alo-models"
version = "0.0.1"
description = "The models alo OS will run, and what may be done with them."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Every refusal and every description in this crate is read by a person, and
# `CLAUDE.md` calls hardcoded English a bug. `alo-strings` depends on nothing
# itself, so nothing is added behind this crate but a list of sentences.
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
# SHA-256, for the digest the runtime's store names a brought file by
# (`src/handing_over.rs`). Already compiled for every build through `ureq`'s
# `rustls`, so this adds no code to the tree.
ring = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
