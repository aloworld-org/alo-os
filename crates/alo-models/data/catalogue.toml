# The one entry anybody has measured, on 2026-09-04. Ollama 0.33.3 serving
# `phi3:3.8b-mini-4k-instruct-q4_K_M` — the weights this entry's `upstream`
# names, at the quantisation it states — on four CPU cores, twenty attempts over
# two rounds of the fixed set. This machine would have acted on none of them:
# it produces the envelope and loses the argument list. `docs/quirks.md` has
# what it wrote and why that is ADR 0007's prediction rather than a surprise.
#
# `min_ram_gb` and `on_cpu` are untouched, and deliberately: a grade is a
# property of the weights and travels between machines, while what a model
# costs in memory and how fast it feels are properties of the machine it was
# run on. Neither was measured by `alo-driving`, so neither is changed here.
[[model]]
id = "phi-3-mini-instruct"
name = "Phi-3 Mini Instruct"
publisher = "Microsoft"
parameters_b = 3.8
quantisation = "Q4_K_M"
download_bytes = 2_400_000_000
min_vram_gb = 4.0
min_ram_gb = 6.0
on_cpu = "comfortable"
drives_verbs = "rarely"
upstream = "https://huggingface.co/microsoft/Phi-3-mini-4k-instruct"
licence = { name = "MIT", spdx = "MIT", commercial_use = "permitted" }

