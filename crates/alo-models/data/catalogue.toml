# ── small enough for a machine with no graphics card (ADR 0007) ─────────────
#
# These carry the default experience. A three-billion-parameter model that
# answers in seconds is a better agent than a nine-billion one that answers in
# minutes, because a turn is several calls and the waiting multiplies.

