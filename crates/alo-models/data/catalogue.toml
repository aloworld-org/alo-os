# forty of the bar once held to the protocol's envelope (ADR 0032). Rule 1 read
# first: both repositories state `license: apache-2.0` in their own metadata and
# ship the Apache License 2.0 as `LICENSE` (revisions `1cfa9a72` and `b968826d`,
# read 2026-09-14). The artefacts are the runtime library's quantisation-pinned
# tags rather than `qwen3:4b` and `qwen3:8b`: on the same day the bare `qwen3:4b`
# named a different file (2,497,280,480 bytes) from `qwen3:4b-q4_K_M`
