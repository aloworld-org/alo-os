# ── trained for tool calls, rather than chosen for being small ──────────────
#
# The five above are general chat models, and all five failed at the **shape**
# rather than at the reasoning: the envelope right and the argument list wrong,
# a fence round the answer, the prompt's own placeholders copied back. Models
# whose publishers train them for tool calling and constrained output are a
# different population, and on 2026-09-11 two of them were put to the same fixed
# ten on the same box — chosen for that training, and only then filtered to what
# 5,926 MB can load.
#
# **Both graded `rarely`**, which is the finding rather than a disappointment:
# `qwen3:1.7b` drove 3 of 20 and `granite3.2:2b` drove 1 of 20, and neither is
# close to nine in ten. Training for tool calls did not carry a model of this
# size over the bar, so the gap task 10 waits on is not one more curated small
# entry. `docs/quirks.md` has what each of them wrote, which is the part a grade
# cannot carry.

