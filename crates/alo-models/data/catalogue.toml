# ── small enough for a machine with no graphics card (ADR 0007) ─────────────
#
# These carry the default experience. A three-billion-parameter model that
# answers in seconds is a better agent than a nine-billion one that answers in
# minutes, because a turn is several calls and the waiting multiplies.
#
# All four were measured on 2026-09-04, on the same box and by the same method
# as `phi-3-mini-instruct` above: Ollama 0.33.3, four CPU cores, the weights
# each entry's `upstream` names at the quantisation it states, two rounds of
# the fixed ten. **All four are `rarely`.** Three of the eighty attempts
# produced a call this machine would have acted on — one from
# `qwen2.5-3b-instruct`, two from `gemma-2-2b-instruct`, none at all from the
# other two. So the section that carries the default experience carries no
# agent, and the smallest model here is not the worst of them.
#
# **What the four disagree about is how they fail, and the grade cannot say
# it.** `llama-3.2-3b-instruct` gets the argument shape right and then loses
# the punctuation: twenty answers, twenty unreadable, most of them a brace
# short or a brace over. `qwen2.5-3b-instruct` puts the door and the verb name
# where they belong and collapses `given` into a bare object of name to value.
# `gemma-2-2b-instruct` is the only entry here whose answers get past the
# daemon's door at all — it asked a change through the read door twice and
# invented a verb called `CLOSE` twice — and the only one that wrote a markdown
# fence. `smollm2-1.7b-instruct` copies the prompt's own placeholders,
# `"verb":"NAME"` and `"named":"ARGUMENT"`, rather than filling them in. Four
# failures, one grade — which is `drives_verbs` doing its job, since a machine
# deciding whether to hand somebody's files to a model does not care which way
