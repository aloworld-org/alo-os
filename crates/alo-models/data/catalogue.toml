# The models alo OS offers.
#
# Data, not code: adding a model is a change to this file, never a release.
#
# Six rules for anyone editing it:
#
# 1. **Verify the licence against upstream before adding an entry.** Model
#    licences change between versions and families, and a catalogue that states
#    a licence wrongly is worse than one that omits the model — it invites an
#    organisation into a breach while showing them a tidy licence name. Where
#    commercial use carries conditions, write them down; the loader refuses an
#    entry that says "conditions apply" without saying which.
# 2. **Sizes are what the disk and the card actually lose**, for the artefact
#    named. "It worked for me" is not a useful report without one. Rule 5 says
#    what an entry that names no artefact states instead, and the loader checks
#    both.
# 3. **`drives_verbs` is a measurement you ran, or it is "not-measured".**
#    Run `alo-driving` against the model — a fixed set of requests, scored
#    through the daemon's own door and the same validation a real turn does —
#    and write down the grade it gives. Guessing from a parameter count is the
#    one thing this field exists to stop: it is the only property here that
#    decides whether a machine hands somebody's files to a model, and ADR 0007
#    says it is measured by us and never claimed by the publisher.
#
#    **A grade names the machine it was earned on**, in a `[model.measured]`
#    block beside it: the machine with its memory, the date, and the runtime
#    with its version. The loader refuses a grade without one and a block
#    beside `not-measured`. Until 2026-09-13 the seven grades here said where
#    they came from only in comments below, which a reader of one entry had no
#    reason to find; they were given their blocks from the runs' own reports.
# 4. **A stated `quantisation` names an artefact, in `artefact`, or the entry
#    states no quantisation.** The two fields are one claim and the loader
#    refuses half of it. `upstream` says where a model comes from; `artefact`
#    says *which file* — what the pinned runtime (ADR 0006) fetches, spelled the
#    way it spells it, or a publisher's own repository where the runtime's
#    library has no entry. It is also what `ALO_DRIVING_MODEL` is set to, so the
#    grade in `drives_verbs` and the artefact it was earned against are written
#    in the same place instead of in the head of whoever last ran it.
#
#    The rule exists because this file broke it. `teuken-7b-instruct` said
#    `Q4_K_M` and openGPT-X publishes no GGUF of Teuken at all — every Q4_K_M of
#    it is a stranger's requantisation — so the entry named a file this
#    catalogue had never chosen and could not have measured without silently
#    borrowing somebody else's. A third party's artefact is allowed here, but it
#    is **named**, never implied; an entry that can point at nothing claims no
#    quantisation. `teuken-7b-instruct` and `eurollm-9b-instruct` did exactly
#    that until 2026-09-11, when rule 6's price was paid for both and each of
#    them named the upload it means.
#
# 5. **A size, a `min_vram_gb` and a `min_ram_gb` belong to an artefact this
#    entry names.** Rule 4 made the quantisation point at a file and left the
#    numbers beside it pointing at nothing: both entries above kept the four-bit
#    `download_bytes` they were added with after they had stopped claiming any
#    four-bit artefact, so those figures answered a question the entry no longer
#    asked. **The road this catalogue took is the publisher's own release**, not
#    a stranger's requantisation: where no first-party quantised artefact
#    exists, the entry states the weights its publisher actually publishes —
#    read off that repository's own file list — because that is the one thing
#    left that a reader can go and check, and because choosing whose
#    requantisation this catalogue vouches for is a decision with nobody's name
#    on it. The consequence is honest and visible: such an entry is large,
#    `on_cpu = "slow"`, and needs a machine most people do not have. That is the
#    true sentence about a model nobody has quantised for us.
#
#    Both halves are arithmetic and the loader refuses them:
#
#    - `download_bytes ÷ parameters_b` lands near 0.6 bytes per parameter for a
#      four-bit artefact and at 2.0 for a `bfloat16` release, and an entry
#      whose size sits on the wrong side of 1.5 for what it claims fails to
#      load. So a four-bit figure cannot be left behind on an entry that has
#      given up its quantisation, which is exactly what happened here.
#    - `min_vram_gb` and `min_ram_gb` are never below the size: a machine that
#      cannot hold the weights cannot run them at any speed, and ten gigabytes
#      beside fifteen gigabytes of weights is a figure somebody would check
#      their laptop against and be wrong.
#
#    Rule 6 is what an entry may do **instead** of falling back to the
#    publisher's own release, and the price of doing it. Both entries that were
#    written from this rule have since paid it, so the fallback above is now the
#    shape an entry takes on its way in rather than one anything here stands in
#    — which is the right place for it, and not a reason to soften it.
#
# 6. **An artefact somebody other than the publisher made may be named, and
#    naming one costs three statements.** ADR 0026 took this decision: refusing
#    every third-party requantisation sounds like caution and is really an
#    eligibility rule that tracks whether a publisher has a distribution team —
#    it is why the two entries this catalogue leads with, `eurollm-9b-instruct`
#    and `teuken-7b-instruct`, are the two it can say least about. What this
#    catalogue borrows is a **file**, never a measurement: `drives_verbs` is
#    still a grade we ran (rule 3, ADR 0007), and nothing a requantiser claims
#    becomes one.
#
#    So an entry whose `artefact` its publisher did not publish states a
#    `[model.requantised]` block, and the loader refuses it with any part
#    missing:
#
#    - `by` — **who made it**, as they publish under, because a name read out of
#      a URL is a name nobody wrote down and choosing whose requantisation this
#      catalogue vouches for is a decision that carries one. Never the
#      publisher: that is a first-party artefact and needs no block.
#    - `sha256` — **which file exactly**, as its own repository publishes the
#      digest, in sixty-four lowercase hexadecimal characters. A tag can be
#      re-pointed after we measured it; a pin is what makes *the file we graded*
#      and *the file a machine fetches* the same file or a failed fetch.
#
#      **Where that is kept, and what it can promise.** `src/ollama.rs` asks the
#      runtime which file it ended up with and refuses the fetch when it is not
#      this one, naming both digests; a runtime that will not say is also a
#      refusal, because a check that could not be made has not passed. Measured
#      against the real runtime in `tests/the_pin_an_entry_states.rs`, failing
#      case first. What a pin cannot promise is that no bytes moved: the check
#      is of what arrived, so a re-pointed tag is caught **after** the download
#      rather than before it. It is the download that is wasted, never the
#      answer.
#    - `note` — **what a reader needs to know**: how it was made where the
#      uploader says so, and any terms the upload carries beyond the model's
#      own. Rule 1's "say which conditions" one field over — and the part that
#      cannot be written by somebody who has not looked at the file.
#
#    Two more halves of the same rule, both arithmetic in the loader:
#
#    - **A grade belongs to the artefact it was earned against**, so an entry
#      that names no artefact may not carry one at all. A measurement with no
#      file behind it is a number about no weights in particular.
#    - **A field this file's shape does not know fails to load**, rather than
#      being ignored. A block spelled `[model.requantized]` would otherwise
#      vanish in silence and leave an entry looking first-party, which is the
#      confusion this whole rule is about.
#
#    Where the three statements cannot be produced, rule 5 is the fallback and
#    the entry is **carried rather than omitted**: no quantisation, the
#    publisher's own release, `not-measured`. That is where both European
#    entries stood when this rule was written, and on 2026-09-11 the price was
#    paid for both: `eurollm-9b-instruct` names `bartowski`'s upload and
#    `teuken-7b-instruct` names `mradermacher`'s, each with the digest off that
#    repository's own file list and a note saying how it was made. Two things
#    that choosing taught, for the curator who does it next:
#
#    - **Read the licence against the uploader's repository too**, not only the
#      publisher's. Teuken is published twice under two licences, and its two
#      best-known requantisers took the **research** release — so the popular
#      upload would have put a research artefact behind an Apache-2.0 entry,
#      which is rule 1's harm arriving through rule 6's door.
#    - **The grounds go in the note.** Four people had quantised EuroLLM and
#      the one named is the one whose repository states the fullest recipe;
#      that is a judgement, and a judgement nobody wrote down reads a year
#      later as a coin toss.
#
# Seven entries have been measured and seven have not, and the seven unmeasured
# are the ones a 6 GB development box cannot hold: everything from seven billion
# parameters upward wants ten gigabytes or more, and the machine every
# measurement here was run on has six. That is a fact about the measuring
# machine rather than about the models, which is why they say "not-measured"
# and not something worse.
#
# On 2026-09-11 that fact was tested rather than assumed. `mistral-7b-instruct`
# was fetched at the quantisation stated below and put to `alo-driving` on that
# box twice: the model loads, and loading alone takes longer than the five
# minutes `alo_models` waits for an answer; loaded, it is 5.0 GB inside a 5.9 GB
# guest and runs against swap at a quarter of a token a second, so the first
# exercise's 715-token prompt passed the wait with three tokens written. The
# guest itself went down between the two attempts. Nothing was loosened to get
# a number out of it, so the three 7B entries still say "not-measured" — which
# is the true sentence: nobody has run the measurement, and this box cannot.
# `docs/quirks.md` has the numbers.
#
# On the same day, two entries were **added** and measured: `qwen3-1.7b` and
# `granite-3.2-2b-instruct`, chosen because their publishers train them for tool
# calls and constrained output rather than because they are small, and both
# small enough for the box that measured them. Both graded "rarely". So the
# catalogue is two entries longer and no entry nearer the bar, which is a
# stronger sentence about small models than the five before them were: it is not
# only that small chat models lose the shape, it is that training for the shape
# does not recover it at this size.
#
# **On 2026-09-13 the first 7B entry was measured**, on a machine that could
# hold it: `qwen2.5-7b-instruct`, on an Apple M3 with 8 GB of unified memory,
# Ollama 0.34.0 — the pinned runtime — serving the weights on the GPU. The whole
# fixed ten took thirty-three seconds, against a quarter of a token a second on
# the box above. It drove 4 of 10, which is `rarely`. It is also the first entry
# to fail by **door** rather than by punctuation: every read went through `read`
# correctly, and every change named its verb where the door belongs instead of
# `propose`. `docs/quirks.md` has the ten answers' shape; the report the grade
# came from has them verbatim.
#
# **The same evening every other entry was put to the same machine** (task 2 of
# `docs/autonomy/v0-5-the-models-measured-plan.md`). `mistral-7b-instruct` drove
# 0 of 10 and `llama-3.1-8b-instruct` 1 of 10: both `rarely`. (Mistral's grade
# waited a few hours on `alo-image`'s test, which used it as its example of an
# unmeasured entry; that test now reads its example off this file.) The other four
# could not be measured there, and **each says why** in a `[model.unmeasured]`
# block rather than leaving `not-measured` to read as *probably fine*: on 8 GB of
# unified memory the GPU has about 5.4 GB, `gemma-2-9b-instruct` and `eurollm-9b-instruct`
# spilled onto the processor and did not answer within the five minutes
# `alo_models` waits, and `mixtral-8x7b-instruct` is 26.4 GB and was not fetched.
# `teuken-7b-instruct` ran out of GPU memory on its first try and was graded on
# 2026-09-14 once it carried its publisher's chat template (task 8): 0 of 20
# asked freely, 1 of 20 in the envelope — its answers cut paths short and misspell
# them, which no template or envelope reaches.
# A reason is about the machine that measured, never the reader's; a larger
# machine removes it by running the measurement. No entry was removed for
# failing, and the bar did not move.
#
# A machine reading this catalogue still offers no local model the agent — but
# it says so for the reason that is true of it, which is that what was measured
# did not clear the bar rather than that nobody has measured anything. Those are
# different sentences and they send a person to different places.
#
# `min_vram_gb` is what the model needs to run at a *useful* speed. The
# certified machine in docs/hardware.md has 24 GB, so an entry above that is
# offered with its cost visible rather than hidden.

# ── European models first, because nobody else lists them ───────────────────
#
# Not because others are excluded: the catalogue carries whatever is good and
# openly licensed. European models are first because a catalogue assembled
# anywhere else would omit them, and somebody in Europe looking for a model
# trained on their own languages should not have to go hunting.

# utter-project publishes EuroLLM as safetensors and no GGUF of its own, and
# the pinned runtime's library has no `eurollm` at all, so every Q4_K_M of it is
# a third party's requantisation. Under rule 4 this entry therefore claimed no
# quantisation at all, and under rule 5 it stated the publisher's own `bfloat16`
# release — 18_304_683_360 bytes over 9_152_319_488 parameters, 20.5 GB of video
# memory and 24.0 GB of system memory — which was honest and was not a model
# anybody runs.
#
# **Rule 6 is now paid, on 2026-09-11.** Four uploads of a Q4_K_M exist
# (`bartowski`, `lmstudio-community`, `QuantFactory` and `NikolayKozloff`'s Q8
# only); the one named is `bartowski`'s, chosen because its repository states
# the most complete recipe of them — the llama.cpp release it was built with and
# the calibration dataset the importance matrix came from — and because its own
# metadata carries the model's licence and no other. The `sha256` is that file's
# own, off the repository's file list the same day; the size, the card and the
# memory are that artefact's rather than the release it came from.
[[model]]
id = "eurollm-9b-instruct"
name = "EuroLLM 9B Instruct"
publisher = "EuroLLM (EU Horizon project)"
parameters_b = 9.2
quantisation = "Q4_K_M"
artefact = "hf.co/bartowski/EuroLLM-9B-Instruct-GGUF:Q4_K_M"
download_bytes = 5_582_838_496
min_vram_gb = 8.0
min_ram_gb = 12.0
# Nine billion parameters at four bits is what `gemma-2-9b-instruct` is, and
# that entry is "slow" for the same reason: the weights fit an ordinary laptop's
# memory and the arithmetic does not fit its processor at a speed anybody wants
# across the four model calls a turn makes.
on_cpu = "slow"
drives_verbs = "not-measured"
upstream = "https://huggingface.co/utter-project/EuroLLM-9B-Instruct"
licence = { name = "Apache-2.0", spdx = "Apache-2.0", commercial_use = "permitted" }

[model.requantised]
by = "bartowski"
sha256 = "785a3b2883532381704ef74f866f822f179a931801d1ed1cf12e6deeb838806b"
note = """An importance-matrix quantisation, made with llama.cpp release b4240 \
from utter-project/EuroLLM-9B-Instruct, with the calibration dataset published \
as a gist the repository links — the fullest recipe of the four uploads of this \
model, which is why it is the one named. The upload's own Hugging Face metadata \
states `license: apache-2.0`, the model's own licence, and attaches no terms \
beyond it. Read 2026-09-11."""

# **Tried, on 2026-09-15, and the reason is now an attempt rather than a
# subtraction.** With the development VM stopped, this machine holds the file:
# `Ollama::fetch` fetched it by this entry's id and it answered *"I'm ready to
# help with your question or instruction."* Loaded it is 6,494,638,568 bytes with
# 4,608,848,035 of them on the graphics processor — 1.9 GB of a nine-billion
# model resident nowhere fast. A nineteen-token question held to the envelope came
# back in **168 seconds**; the fixed set's own prompt, which carries every verb
# this machine has, did not come back at all inside the **300 seconds**
# `alo-models` waits, in three runs — asked freely, asked in the envelope, and
# asked in the envelope under the instructions a turn shows. So the entry keeps
# its reason, which says exactly this: not that the file will not load, but that
# the machine cannot answer with it inside the time a person is waiting.
[model.unmeasured]
because = "too-large-for-the-measuring-machine"
machine = "Apple M3, 8 GB unified memory, macOS 26.5.2, weights on the GPU through Metal"
date = "2026-09-15"
runtime = "Ollama 0.34.0"

# openGPT-X publishes this model twice, under two different licences: the
# `-research-v0.4` release is `license: other` and the `-commercial-v0.4`
# release is Apache-2.0. This entry named the research one and stated
# Apache-2.0 with commercial use permitted, which is rule 1's harm exactly — an
# organisation told it may rely commercially on a release licensed for
# research. Corrected on 2026-09-11 by naming the release the licence line was
# always true of; the size is unchanged, because the two differ in their
# licence rather than in their weights. Neither release ships a first-party
# GGUF, which is the case rule 4 was written from: the entry said `Q4_K_M` and
# no such artefact exists outside strangers' requantisations, so it now states
# no quantisation and names no artefact, and a grade for it waits on somebody
# choosing one rather than only on a machine with room — under rule 6, which
# says what that choice costs. `docs/quirks.md` has both findings.
#
# Its `parameters_b` was 7.0 — the publisher's product name rather than the
# count in its own manifest, which is what every other entry here states — and
# is 7_452_725_248 rounded. It then stated the commercial release's own
# `bfloat16` shards, 14_905_484_192 bytes with 17.0 and 21.0 beside them, under
# rule 5.
#
# **Rule 6 is now paid, on 2026-09-11**, and the choice turns on the licence
# rather than on popularity. openGPT-X's two releases are requantised by
# different people: `bartowski` and `QuantFactory` publish the **research**
# release, which is `license: other`, and naming either would put a research
# artefact behind this entry's Apache-2.0 line — rule 1's harm returning by the
# other door. `mradermacher` publishes the commercial release, states how
# (static quants, no importance matrix, with its conversion type and quantize
# version written down) and carries the model's own licence. So the artefact is
# that one, and the size, the card and the memory are its. `on_cpu` returns to
# "workable": five gigabytes of four-bit weights is what that word was always
# true of, and it was "slow" for as long as this entry could name no such file.
# No grade moved — `drives_verbs` is measured by `alo-driving`, this box cannot
# hold a 7B model at four bits, and naming a file is not running one.
[[model]]
id = "teuken-7b-instruct"
name = "Teuken 7B Instruct"
publisher = "OpenGPT-X"
parameters_b = 7.5
quantisation = "Q4_K_M"
artefact = "hf.co/mradermacher/Teuken-7B-instruct-commercial-v0.4-GGUF:Q4_K_M"
download_bytes = 5_018_868_512
min_vram_gb = 6.5
min_ram_gb = 10.0
on_cpu = "workable"
drives_verbs = "rarely"
drives_verbs_in_the_envelope = "rarely"
upstream = "https://huggingface.co/openGPT-X/Teuken-7B-instruct-commercial-v0.4"
licence = { name = "Apache-2.0", spdx = "Apache-2.0", commercial_use = "permitted" }


[model.chat_template]
# openGPT-X's own template for this release, rendered for the one shape alo OS
# asks in — a single message from a person — in the runtime's template language.
# It is `gptx_tokenizer.py`'s `default` (the English system message, which that
# file spells with no space after the first full stop, where the model card's
# example has one) followed by the Jinja template's `User: ` line and its
# generation prompt, `Assistant: `. The model card says the model "must be used
# with the provided prompt template". Read 2026-09-14.
text = """System: A chat between a human and an artificial intelligence assistant.The assistant gives helpful and polite answers to the human's questions.
User: {{ .Prompt }}
Assistant: """
published_at = "https://huggingface.co/openGPT-X/Teuken-7B-instruct-commercial-v0.4/blob/e91cc26f0a5b1082c1375fd161ccb8cc0a05b291/gptx_tokenizer.py"
[model.requantised]
by = "mradermacher"
sha256 = "03fd13daafb6f20c1c5f4b908d163841cdd96803a6f5a7c0c39dd236a2b1630b"
note = """A static quantisation — no importance matrix — of \
openGPT-X/Teuken-7B-instruct-commercial-v0.4, the one of that model's two \
releases this entry's Apache-2.0 line is true of; the uploader states the \
conversion type and quantize version rather than a llama.cpp release, and \
publishes the whole quant ladder from the one run. A weighted set of the same \
release exists at `-i1-GGUF` and is deliberately not what this entry names. The \
upload's own Hugging Face metadata states `license: apache-2.0`, the model's \
own licence, and attaches no terms beyond it. Read 2026-09-11."""

[model.measured]
machine = "Apple M3, 8 GB unified memory, macOS 26.5.2, weights on the GPU through Metal"
