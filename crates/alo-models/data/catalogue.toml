# The models alo OS offers.
#
# Data, not code: adding a model is a change to this file, never a release.
#
# Five rules for anyone editing it:
#
# 1. **Verify the licence against upstream before adding an entry.** Model
#    licences change between versions and families, and a catalogue that states
#    a licence wrongly is worse than one that omits the model — it invites an
#    organisation into a breach while showing them a tidy licence name. Where
#    commercial use carries conditions, write them down; the loader refuses an
#    entry that says "conditions apply" without saying which.
# 2. **Sizes are what the disk and the card actually lose**, for the artefact
#    named. "It worked for me" is not a useful report without one. Rule 5 says
#    what an entry that names no artefact states instead, and the loader checks
#    both.
# 3. **`drives_verbs` is a measurement you ran, or it is "not-measured".**
#    Run `alo-driving` against the model — a fixed set of requests, scored
#    through the daemon's own door and the same validation a real turn does —
#    and write down the grade it gives. Guessing from a parameter count is the
#    one thing this field exists to stop: it is the only property here that
#    decides whether a machine hands somebody's files to a model, and ADR 0007
#    says it is measured by us and never claimed by the publisher.
# 4. **A stated `quantisation` names an artefact, in `artefact`, or the entry
#    states no quantisation.** The two fields are one claim and the loader
#    refuses half of it. `upstream` says where a model comes from; `artefact`
#    says *which file* — what the pinned runtime (ADR 0006) fetches, spelled the
#    way it spells it, or a publisher's own repository where the runtime's
#    library has no entry. It is also what `ALO_DRIVING_MODEL` is set to, so the
#    grade in `drives_verbs` and the artefact it was earned against are written
#    in the same place instead of in the head of whoever last ran it.
#
#    The rule exists because this file broke it. `teuken-7b-instruct` said
#    `Q4_K_M` and openGPT-X publishes no GGUF of Teuken at all — every Q4_K_M of
#    it is a stranger's requantisation — so the entry named a file this
#    catalogue had never chosen and could not have measured without silently
#    borrowing somebody else's. A third party's artefact is allowed here, but it
#    is **named**, never implied; an entry that can point at nothing claims no
#    quantisation, which is what `teuken-7b-instruct` and `eurollm-9b-instruct`
#    now do.
#
# 5. **A size, a `min_vram_gb` and a `min_ram_gb` belong to an artefact this
#    entry names.** Rule 4 made the quantisation point at a file and left the
#    numbers beside it pointing at nothing: both entries above kept the four-bit
#    `download_bytes` they were added with after they had stopped claiming any
#    four-bit artefact, so those figures answered a question the entry no longer
#    asked. **The road this catalogue took is the publisher's own release**, not
#    a stranger's requantisation: where no first-party quantised artefact
#    exists, the entry states the weights its publisher actually publishes —
#    read off that repository's own file list — because that is the one thing
#    left that a reader can go and check, and because choosing whose
#    requantisation this catalogue vouches for is a decision with nobody's name
#    on it. The consequence is honest and visible: such an entry is large,
#    `on_cpu = "slow"`, and needs a machine most people do not have. That is the
#    true sentence about a model nobody has quantised for us.
#
#    Both halves are arithmetic and the loader refuses them:
#
#    - `download_bytes ÷ parameters_b` lands near 0.6 bytes per parameter for a
#      four-bit artefact and at 2.0 for a `bfloat16` release, and an entry
#      whose size sits on the wrong side of 1.5 for what it claims fails to
#      load. So a four-bit figure cannot be left behind on an entry that has
#      given up its quantisation, which is exactly what happened here.
#    - `min_vram_gb` and `min_ram_gb` are never below the size: a machine that
#      cannot hold the weights cannot run them at any speed, and ten gigabytes
#      beside fifteen gigabytes of weights is a figure somebody would check
#      their laptop against and be wrong.
#
# Seven entries have been measured and seven have not, and the seven unmeasured
# are the ones a 6 GB development box cannot hold: everything from seven billion
# parameters upward wants ten gigabytes or more, and the machine every
# measurement here was run on has six. That is a fact about the measuring
# machine rather than about the models, which is why they say "not-measured"
# and not something worse.
#
# On 2026-09-11 that fact was tested rather than assumed. `mistral-7b-instruct`
# was fetched at the quantisation stated below and put to `alo-driving` on that
# box twice: the model loads, and loading alone takes longer than the five
# minutes `alo_models` waits for an answer; loaded, it is 5.0 GB inside a 5.9 GB
# guest and runs against swap at a quarter of a token a second, so the first
# exercise's 715-token prompt passed the wait with three tokens written. The
# guest itself went down between the two attempts. Nothing was loosened to get
# a number out of it, so the three 7B entries still say "not-measured" — which
# is the true sentence: nobody has run the measurement, and this box cannot.
# `docs/quirks.md` has the numbers.
#
# On the same day, two entries were **added** and measured: `qwen3-1.7b` and
# `granite-3.2-2b-instruct`, chosen because their publishers train them for tool
# calls and constrained output rather than because they are small, and both
# small enough for the box that measured them. Both graded "rarely". So the
# catalogue is two entries longer and no entry nearer the bar, which is a
# stronger sentence about small models than the five before them were: it is not
# only that small chat models lose the shape, it is that training for the shape
# does not recover it at this size.
#
# A machine reading this catalogue still offers no local model the agent — but
# it says so for the reason that is true of it, which is that what was measured
# did not clear the bar rather than that nobody has measured anything. Those are
# different sentences and they send a person to different places.
#
# `min_vram_gb` is what the model needs to run at a *useful* speed. The
# certified machine in docs/hardware.md has 24 GB, so an entry above that is
# offered with its cost visible rather than hidden.

# ── European models first, because nobody else lists them ───────────────────
#
# Not because others are excluded: the catalogue carries whatever is good and
# openly licensed. European models are first because a catalogue assembled
# anywhere else would omit them, and somebody in Europe looking for a model
# trained on their own languages should not have to go hunting.

[[model]]
id = "eurollm-9b-instruct"
name = "EuroLLM 9B Instruct"
publisher = "EuroLLM (EU Horizon project)"
parameters_b = 9.2
# No `quantisation` and no `artefact`, under rule 4: utter-project publishes
# EuroLLM as safetensors and no GGUF of its own, and the pinned runtime's
# library has no `eurollm` at all. Every Q4_K_M of it on Hugging Face is a
# third party's requantisation (`bartowski`, `QuantFactory`, `lmstudio-community`
# and others), read 2026-09-11, and this catalogue has chosen none of them. So
# the entry claims no quantisation, and it cannot be graded until one is chosen.
#
# The three numbers below are therefore the publisher's own release, under
# rule 5, read off the file list of the `upstream` repository on 2026-09-11:
# four `bfloat16` safetensors shards of 4_991_396_632, 4_983_059_672,
# 4_999_836_776 and 3_330_390_280 bytes over 9_152_319_488 parameters — two
# bytes each, as `bfloat16` is. They were 5_600_000_000, 8.0 and 12.0, which is
# a four-bit download this entry no longer names. `on_cpu` was already "slow"
# and is more so.
download_bytes = 18_304_683_360
min_vram_gb = 20.5
min_ram_gb = 24.0
on_cpu = "slow"
drives_verbs = "not-measured"
upstream = "https://huggingface.co/utter-project/EuroLLM-9B-Instruct"
licence = { name = "Apache-2.0", spdx = "Apache-2.0", commercial_use = "permitted" }

# openGPT-X publishes this model twice, under two different licences: the
# `-research-v0.4` release is `license: other` and the `-commercial-v0.4`
# release is Apache-2.0. This entry named the research one and stated
# Apache-2.0 with commercial use permitted, which is rule 1's harm exactly — an
# organisation told it may rely commercially on a release licensed for
# research. Corrected on 2026-09-11 by naming the release the licence line was
# always true of; the size is unchanged, because the two differ in their
# licence rather than in their weights. Neither release ships a first-party
# GGUF, which is the case rule 4 was written from: the entry said `Q4_K_M` and
# no such artefact exists outside strangers' requantisations, so it now states
# no quantisation and names no artefact, and a grade for it waits on somebody
# choosing one rather than only on a machine with room. `docs/quirks.md` has
# both findings.
#
# Its four numbers are the commercial release's own, under rule 5, read off
# that repository's file list on 2026-09-11: four `bfloat16` shards of
# 4_936_228_560, 4_929_565_048, 4_929_565_072 and 110_125_512 bytes over
# 7_452_725_248 parameters. `parameters_b` was 7.0 — the publisher's product
# name rather than the count in its own manifest, which is what every other
# entry here states — and the size, the card and the memory were 4_600_000_000,
# 6.0 and 10.0: four-bit figures for the artefact this entry stopped claiming.
# `on_cpu` moves with them. Fifteen gigabytes of `bfloat16` weights on a
# processor is not "workable" by the definition `OnCpu` gives, and the word had
# been true of a four-bit download rather than of this one. No grade moved:
# `drives_verbs` is measured by `alo-driving` and nothing here measures driving.
[[model]]
id = "teuken-7b-instruct"
name = "Teuken 7B Instruct"
publisher = "OpenGPT-X"
parameters_b = 7.5
download_bytes = 14_905_484_192
min_vram_gb = 17.0
min_ram_gb = 21.0
on_cpu = "slow"
drives_verbs = "not-measured"
upstream = "https://huggingface.co/openGPT-X/Teuken-7B-instruct-commercial-v0.4"
licence = { name = "Apache-2.0", spdx = "Apache-2.0", commercial_use = "permitted" }

