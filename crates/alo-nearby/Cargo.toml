[package]
name = "alo-nearby"
version = "0.0.1"
description = "What a machine says about itself on a local network, which is that it exists (ADR 0003)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# What a pairing permits, in the language the person deciding reads it in.
alo-strings = { path = "../alo-strings" }
# The kernel's randomness, for the one identity this machine keeps. It is
# reached from `machine.rs` and nowhere else, and the argument for why the
# identity is random rather than derived is in that file.
getrandom = { workspace = true }
# The key a pairing leaves each side holding, and the proof each message
# carries (ADR 0031). Every primitive comes from here and none is written in
# this crate: `keying.rs` agrees and derives, `proof.rs` signs, `proven.rs`
# verifies.
ring = { workspace = true }
# The file a machine keeps its pairings in between restarts (`keeping.rs`):
# TOML, because it sits beside the grants file and the machine description,
# and a person who opens it should find one notation. Nothing on the wire is
# written with these — the wire's lines are spelt by hand in `carried.rs` and
# `confirming.rs`, where every field is on a named list.
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
alo-strings = { path = "../alo-strings" }

[lints]
workspace = true
