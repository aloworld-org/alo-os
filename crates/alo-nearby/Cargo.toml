[package]
name = "alo-nearby"
version = "0.0.1"
description = "What a machine says about itself on a local network, which is that it exists (ADR 0003)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
