[package]
name = "alo-portals"
version = "0.0.1"
description = "What a portal request from an application is, and how it is judged: a grant in the sense of ADR 0001, refused like one."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# What decides. A portal request is judged by `Grants::allowing`, against the
# same list an agent's verb is, so what a grant covers, whose it is and when it
# ends are ruled on in one crate and never restated here.
alo-capability = { path = "../alo-capability" }

# What opens what. An open-with request is answered from
# `alo_applications::WhatOpensWhat` and nowhere else, so which application opens
# a kind of file is decided in one crate, from the person's choice or the
# applications' declarations, and never restated here.
alo-applications = { path = "../alo-applications" }

# What the person set for how the machine looks. The Settings portal answers
# `org.freedesktop.appearance` from `alo_appearance::Appearance`, resolved at the
# moment of asking, so light and dark and the accent are decided in one crate
# and never restated here. A workspace crate, so it adds nothing to the tree.
alo-appearance = { path = "../alo-appearance" }

# How far this machine reaches. The NetworkMonitor portal is answered from
# `alo_networks::Reaching` and nowhere else, so what the rented network manager
# reports is read in the one crate that speaks to it (ADR 0011) and never
# restated here. A workspace crate, so it adds nothing to the tree.
alo-networks = { path = "../alo-networks" }

# How long what happened on this machine is kept. The answers file is shortened
# under the machine's `[record].keeping` rule, read as `alo_keeping::Keeping`
# and asked `oldest_kept` and `keeps`, so what the organisation set for the
# agent's record and what it holds for applications' requests is one rule,
# never restated here. A workspace crate, so it adds nothing to the tree.
alo-keeping = { path = "../alo-keeping" }

# Everything a person reads: what each portal lets an application do, and why a
# request was refused.
alo-strings = { path = "../alo-strings" }

# The one derive this crate rents, for the error its own string list can return
# to whoever is fixing that list, and for why an answer could not be kept.
thiserror = { workspace = true }

# The answers file: one JSON line per answer, the notation the agent's record
# file (`docs/contracts/record-file.md`) is already written in, so whoever reads
# both reads one. Both are workspace dependencies already, so this adds no
# crate to the tree.
serde = { workspace = true }
serde_json = { workspace = true }

# The bus the backend answers on. Already in the workspace for the keyring
# (`alo-secrets`), at the same version and with the same runtime, so this adds
# no crate to the tree. Linux only: the portals are a Linux session bus's, and
# a file handed over the bus is a Unix descriptor.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(unix)'.dependencies]
# The process behind a request, held by a descriptor (`pidfd_open`) rather than
# named by a number that can be given to another process while its sandbox is
# read — Linux's — and, on any Unix, the two questions the answers file asks
# before it is believed: which user this process runs as, and the flag that
# refuses to open a symbolic link. Already a workspace dependency
# (`alo-agentd`, `alo-accounts`, `alo-remembering`) with the features this
# needs, so it adds no crate to the tree.
rustix = { workspace = true }

[dev-dependencies]
# What a file is, named in the open-with test's assertions about what opens it.
alo-opening = { path = "../alo-opening" }

# The machine's one vocabulary, so the acceptance test can ask whether what
# this crate says is collected beside everybody else's.
alo-saying = { path = "../alo-saying" }

# A real bus for the backend test to serve on and call through, started with no
# service activation — the one fixture that does, rather than a second that
# drifts from it. It depends on `alo-secrets`, which depends on this crate: a
# cycle Cargo allows through dev-dependencies, and one that only the
# integration tests, which link this crate's one library, ever cross.
[target.'cfg(target_os = "linux")'.dev-dependencies]
alo-keyring-fixture = { path = "../alo-keyring-fixture" }
# A named pipe in place of a caller's `.flatpak-info`, so a test can end the
# caller at the exact moment its sandbox is being read.
rustix = { workspace = true }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
