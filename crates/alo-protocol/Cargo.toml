[package]
name = "alo-protocol"
version = "0.0.1"
description = "What a client may ask alo-agentd, and what it may not."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# What an argument can be when it arrives off a socket. `Given` is the one type
# in this workspace whose whole job is being the untrusted side of a boundary,
# and this crate is that boundary. Nothing else is needed from it: a `Call` is
# made by `Verbs::call` inside a turn, and never here.
alo-capability = { path = "../alo-capability" }
# What a read found, on the way back: `Answer`'s six shapes, the rule a name is
# held to before it can be shown, and the bound a read is held to — which is
# where `LONGEST_ANSWER` comes from. The wire shape is made here rather than
# derived there, because a path is not always text; `naming.rs` is the whole of
# that argument. Light enough to be safe: `alo-files` is `std::fs` and no more.
alo-files = { path = "../alo-files" }
# What an installation answered with, and whether it is sandboxed. A leaf, the
# same layer as `alo-files`, and here for the same reason: this crate turns what
# a verb did into what crosses the wire, so it has to know the shapes. **Not
# `alo-turn`**, which stays a dev-dependency — the wire does not know what a
# turn is, and `Done` therefore has one constructor per family rather than one
# taking `alo_turn::WhatAVerbDid`.
alo-software = { path = "../alo-software" }
# What the record answered about a file. Here for `alo-files`' and
# `alo-software`' reason — this crate turns what a verb did into what crosses
# the wire, so it has to know the shapes — and light for the same reason:
# `alo-record` holds `alo-capability`, `alo-egress` and `alo-strings`, all
# leaves. It was a dev-dependency until 2026-10-18, when the record gained a
# verb and its answer had to cross.
alo-record = { path = "../alo-record" }
# What another process's indicator is showing, on the way to the desktop (ADR
# 0134): `alo_egress::Reported` is the one shape a line takes on the wire. A
# leaf already in this crate's graph through `alo-record`; a dev-dependency
# until 2026-10-27.
alo-egress = { path = "../alo-egress" }
# Every refusal in this crate is read by somebody, so none of them is English.
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

# The whole point of a request is what a turn does with it, so the test that
# says these are requests is one that carries them through a real turn onto a
# real disk. None of this is compiled into the crate.
[dev-dependencies]
alo-context = { path = "../alo-context" }
alo-turn = { path = "../alo-turn" }
# What an application is. Used only by
# `tests/an_installation_as_a_client_sees_it.rs`, which has to really install
# something to get hold of an `alo_software::Installed` — that type has no
# public constructor, deliberately, because one of them is evidence an
# installation happened.
alo-applications = { path = "../alo-applications" }
