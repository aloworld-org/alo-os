[package]
name = "alo-record"
version = "0.0.1"
description = "What an agent did, and what it was stopped from doing (ADR 0001 §7)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alo-capability = { path = "../alo-capability" }
alo-egress = { path = "../alo-egress" }
# A refusal arrives as what it was, not as words: the record says it in the
# language the person was told it in, so the screen and the record are one
# rendering of one moment.
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }

[dev-dependencies]
# Only the tests name a source: what the record keeps about an answer from
# somewhere else is the departure it caused, and a departure is `alo-egress`'s.
alo-models = { path = "../alo-models" }
serde_json = { workspace = true }

[lints]
workspace = true
