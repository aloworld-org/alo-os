[package]
name = "alo-running"
version = "0.0.1"
description = "A command the person chose, run inside the sealed box the kernel locks down."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Everything here is a control group, a boundary the kernel holds and a program
# started inside it. On any other host it compiles to nothing at all rather
# than to a version of itself that pretends, which is `alo-bounding`'s argument
# and the same one: a box that could be constructed on a machine that cannot
# close it would be a type whose existence means nothing.
[target.'cfg(target_os = "linux")'.dependencies]
# The boundary, the control group and the bound. This crate starts a program
# and that crate does not; ADR 0117 is why they are two crates.
alo-bounding = { path = "../alo-bounding" }
# Which of ADR 0064's three levels the person chose. Read, never decided here.
alo-capability = { path = "../alo-capability" }
# Where a run is written down. ADR 0064 keeps the record on at every level, and
# `somewhere_to_write.rs` is what makes that unskippable rather than remembered.
alo-record = { path = "../alo-record" }
alo-keeping = { path = "../alo-keeping" }
# The sentences a person reads when a command did not run. The words themselves
# are `alo-capability`'s, and `failing.rs` says why they are not this crate's.
alo-strings = { path = "../alo-strings" }
thiserror = { workspace = true }
# Asking whether the person's input has anything in it before reading it, so a
# `try` in the background of a terminal is not stopped by it
# (`carrying_what_it_says.rs`).
rustix = { workspace = true, features = ["event"] }

[lints]
workspace = true

# The small program that puts itself inside a box and then becomes the command.
# ADR 0117 says why the admission is an ordinary program rather than a hook
# between `fork` and `exec`: `pre_exec` is `unsafe`, `CommandExt::exec` is not.
[[bin]]
name = "alo-enter-the-box"
path = "src/bin/alo-enter-the-box.rs"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The tests write an entry down and read it back as JSON, which is how an
# absence is held to being an absence.
serde_json = { workspace = true }
# A terminal for the carrier to be in the background of, which is the one way
# to reproduce what stopped `try` on a booted machine on 2026-11-02.
rustix = { workspace = true, features = ["pty"] }
