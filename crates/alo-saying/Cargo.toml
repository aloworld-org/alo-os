[package]
name = "alo-saying"
version = "0.0.1"
description = "Everything this machine can say, and the translations it says it in."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The machinery. Every type here is one of this crate's: a vocabulary to fill,
# a translation to check against it, and the lookup that comes out.
alo-strings = { path = "../alo-strings" }

# Every crate that declares a word. This crate is reached by whatever assembles
# a process, and it reaches all of them — which is the price of one vocabulary
# for the whole machine rather than one per process, and `lib.rs` is why that
# price is worth paying. It inherits their dependencies with them, `alo-asking`'s
# TLS stack included; nothing here uses any of it.
alo-adapting = { path = "../alo-adapting" }
alo-access = { path = "../alo-access" }
alo-accounts = { path = "../alo-accounts" }
alo-adapters = { path = "../alo-adapters" }
alo-answering = { path = "../alo-answering" }
alo-appearance = { path = "../alo-appearance" }
alo-applications = { path = "../alo-applications" }
alo-approving = { path = "../alo-approving" }
alo-asking = { path = "../alo-asking" }
alo-capability = { path = "../alo-capability" }
alo-bluetooth = { path = "../alo-bluetooth" }
alo-cameras = { path = "../alo-cameras" }
alo-power = { path = "../alo-power" }
alo-capturing = { path = "../alo-capturing" }
alo-sound = { path = "../alo-sound" }
alo-changing = { path = "../alo-changing" }
alo-changing-network = { path = "../alo-changing-network" }
alo-choosing = { path = "../alo-choosing" }
alo-clipboard = { path = "../alo-clipboard" }
alo-context = { path = "../alo-context" }
alo-converting = { path = "../alo-converting" }
alo-corridor = { path = "../alo-corridor" }
alo-desktops = { path = "../alo-desktops" }
alo-dividing = { path = "../alo-dividing" }
alo-dock = { path = "../alo-dock" }
alo-egress = { path = "../alo-egress" }
alo-files = { path = "../alo-files" }
alo-finding = { path = "../alo-finding" }
alo-granted = { path = "../alo-granted" }
alo-greeting = { path = "../alo-greeting" }
alo-handing = { path = "../alo-handing" }
alo-in-use = { path = "../alo-in-use" }
alo-indicator = { path = "../alo-indicator" }
alo-installer = { path = "../alo-installer" }
alo-installing = { path = "../alo-installing" }
alo-keeping = { path = "../alo-keeping" }
alo-keeping-up = { path = "../alo-keeping-up" }
alo-keyboards = { path = "../alo-keyboards" }
alo-locking = { path = "../alo-locking" }
alo-measuring = { path = "../alo-measuring" }
alo-menus = { path = "../alo-menus" }
alo-models = { path = "../alo-models" }
alo-nearby = { path = "../alo-nearby" }
alo-opening = { path = "../alo-opening" }
alo-overlay = { path = "../alo-overlay" }
alo-picking = { path = "../alo-picking" }
alo-portals = { path = "../alo-portals" }
alo-printing = { path = "../alo-printing" }
alo-protocol = { path = "../alo-protocol" }
alo-proxy = { path = "../alo-proxy" }
alo-recounting = { path = "../alo-recounting" }
alo-sessiond = { path = "../alo-sessiond" }
alo-setting-up = { path = "../alo-setting-up" }
alo-shortcuts = { path = "../alo-shortcuts" }
alo-sleeping = { path = "../alo-sleeping" }
alo-software = { path = "../alo-software" }
alo-telling = { path = "../alo-telling" }
alo-turn = { path = "../alo-turn" }

# `alo-agentd` is deliberately not here: it is Linux, and a vocabulary that was
# three strings shorter on one host would be a translation refused on that host
# and accepted on another. It declares its own three on top of this one, which
# is the rule `docs/contracts/translations.md` states for anything that
# assembles a vocabulary.

serde = { workspace = true }
# A translation is typed by a translator, so it is TOML for the reason
# `docs/contracts/machine-description.md` is: a comment is how the person after
# them finds out why a sentence is worded the way it is.
toml = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
