[package]
name = "alo-secrets"
version = "0.0.1"
description = "Where a provider's key is kept, and where the bus that keeps it is."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Everything in this crate is a Unix socket, a uid and a keyring that only
# exists on Linux. On any other host it compiles to nothing at all rather than
# to a version of itself that pretends — `alo-bounding`'s argument, and the same
# one: a credential store that could be constructed on a machine that has none
# would be a type whose existence means nothing.
[target.'cfg(target_os = "linux")'.dependencies]
# The person's own uid, asked of the process rather than of an environment.
# `getuid` is a syscall and this workspace forbids `unsafe` outside
# `alo-bounding-kernel`, so it is asked through a crate that has already made
# that call safely.
rustix = { workspace = true }

# The key itself, and the handle that names one. `alo-secrets` implements what
# `alo_models::SecretRef` refers to and never widens it: nothing here can render
# a key, because `Secret` is what it hands back.
alo-models = { path = "../alo-models" }
alo-strings = { path = "../alo-strings" }

# The Secret Service, spoken over a connection **we** made. ADR 0022's amendment
# of 2026-09-08 chose this over `libsecret` for one measured reason: no libsecret
# API accepts a `GDBusConnection`, so a daemon using it reaches whichever bus the
# environment names. `SecretService::connect_with_existing` takes the connection,
# and `zbus::blocking::connection::Builder::address` is where that connection's
# address comes from — this crate's, derived from a uid.
#
# `crypto-rust` rather than `crypto-openssl`: the encrypted session is pure Rust
# and brings no second C library. The session is **encrypted** (`EncryptionType::Dh`)
# and not plain, because a secret crossing the bus in clear is a secret in
# whatever else can read that bus.
secret-service = { version = "5.2", default-features = false, features = [
  "crypto-rust",
  "rt-async-io",
] }
zbus = { version = "5.19", default-features = false }

[lints]
workspace = true

# The routing test drives both ways of getting a bus: the one this crate uses,
# and the environment's own — which it has to reach for directly, because
# nothing in the crate will.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5.19", default-features = false }
rustix = { workspace = true }

# The real keyring these tests ask questions of, shared with `alo-agentd` so
# that there is one fixture rather than two drifting apart. **Dev only**: it is
# never published and a `--package` release build compiles none of it.
alo-keyring-fixture = { path = "../alo-keyring-fixture" }
secret-service = { version = "5.2", default-features = false, features = [
  "crypto-rust",
  "rt-async-io",
] }
