[package]
name = "alo-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
# The type of the session the sign-in screen hands over to, and nothing else:
# `tests/sign_in_source.rs` holds this crate to naming `alo_accounts::Session`
# and never the accounts themselves, which only `alo-greeting` asks.
# What a screen reader is told about every surface drawn here: the role, the
# name and the state of every control, decided there and never in this crate.
# `tests/the_tree_a_reader_finds.rs` reads the tree back off a real bus.
alo-access = { path = "../alo-access" }
alo-accounts = { path = "../alo-accounts" }
alo-appearance = { path = "../alo-appearance" }
# Lock policy, regional wording, and bounded image/time engines. No network lookup.
# Whether going back to the build before can be offered at all, and every
# sentence the recovery screen shows — the offer, the two moments, and each
# reason it cannot be offered. Read, never acted on:
# `tests/recovery_source.rs` holds the screen to carrying no rollback out.
alo-keeping-up = { path = "../alo-keeping-up" }
alo-locking = { path = "../alo-locking" }
alo-formats = { path = "../alo-formats" }
alo-overlay = { path = "../alo-overlay" }
alo-egress = { path = "../alo-egress" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# The sentence a person approves: a change that is really waiting, put in
# front of them once and answered once. This crate draws the question and
# carries keys to it; every answer goes back through `alo_approving::Approving`
# and nothing here approves, declines or words anything itself.
alo-approving = { path = "../alo-approving" }
# The number a question is answered by, and the grants an approval is checked
# against again at the moment it runs — handed through, never decided here.
alo-capability = { path = "../alo-capability" }
# The person's half of a change to what has been granted to what: one call,
# `Changing::revoked`, for a grant and a pairing alike. Settings lists and
# revokes through it and grants nothing — `tests/settings_source.rs` holds it
# to that.
alo-changing = { path = "../alo-changing" }
# The person's own choice of what answers their questions, where their folder
# is, and the only door that changes the choice.
alo-choosing = { path = "../alo-choosing" }
# Where the dock is, and so which corner is the status area the egress
# indicator is drawn in. Read, never written.
# Which screens a person has, where each sits, how large each draws, and what
# each wears: the background behind its windows, the edge its dock sits on and
# how warm night light draws it. Read, never written — `tests/screens_source.rs`
# holds the desk's files to never making an arrangement of their own.
alo-displays = { path = "../alo-displays" }
alo-power = { path = "../alo-power" }
alo-sound = { path = "../alo-sound" }
alo-networks = { path = "../alo-networks" }
alo-dividing = { path = "../alo-dividing" }
alo-desktops = { path = "../alo-desktops" }
alo-dock = { path = "../alo-dock" }
# The list of grants a person sees: rows derived from the machine's own grants,
# and the words for revoking one. Read, and revoked only through `alo-changing`.
alo-granted = { path = "../alo-granted" }
# Everything the sign-in screen does that is not drawing — authenticate, then
# knock — composed once, there, and called here.
alo-greeting = { path = "../alo-greeting" }
# The egress indicator's model: the one picture of what is leaving that a
# compositor is handed, made from the machine's own `alo_egress::Indicator`.
# This crate draws it and never decides what may leave.
alo-indicator = { path = "../alo-indicator" }
# What on this machine is watching or listening, and what a status area draws
# beside the egress indicator to say so: the mark, the word and the position
# ADR 0010 asks for beside a colour. Read, never decided — which thing is in
# use, who has it and where its line sits are all that crate's answers.
alo-in-use = { path = "../alo-in-use" }
# What is running and what is filling the disk: the readings and the count the
# two desktop windows draw, every number as the kernel or the count gave it.
# Read, never acted on — `tests/desktop_source.rs` holds the windows to that.
alo-measuring = { path = "../alo-measuring" }
# What a pairing permits, and the list Settings reads to show them. Read, never
# written: the pairings file is the daemon's alone.
alo-nearby = { path = "../alo-nearby" }
# The record's own question, asked of the whole record: `Asking::anything()`
# and nothing narrower, so the record window has no filter that could hide a
# refusal. Read, never written — `tests/record_source.rs` holds it to that.
alo-record = { path = "../alo-record" }
# Afterwards, ask what it did: the account `alo_recounting::Recounting` reads
# off the disk and hands the compositor. This crate draws that account and
# words nothing in it.
alo-recounting = { path = "../alo-recounting" }
# The grants and the pairings as the machine kept them, read once when Settings
# opens. Settings never calls a writer here: `alo-changing` does, for a grant.
alo-remembering = { path = "../alo-remembering" }
# The four ways alo OS runs, in the order and the words setup offers them.
alo-setting-up = { path = "../alo-setting-up" }
# Every sentence this machine can say, for the one caller that has nobody to be
# handed them by: the compositor a machine boots to, which must word a refusal
# at a sign-in screen before any session exists to carry words into it.
alo-saying = { path = "../alo-saying" }
alo-shortcuts = { path = "../alo-shortcuts" }
alo-strings = { path = "../alo-strings" }
# The turn a question was asked inside, borrowed for the length of one call so
# an answer reaches the one road that carries a change out and records it.
alo-turn = { path = "../alo-turn" }
# The engine the sign-in screen is drawn with on a machine whose graphics card
# this shell has no renderer on. Smithay's `PixmanRenderer` is a safe API over
# it, which is why it is here at all: every road to a GLES renderer runs through
# an `unsafe fn` and `unsafe_code` is forbidden above, so the engine is rented
# the way `signal-hook` and `getrandom` are. Pinned to the version Smithay's own
# `renderer_pixman` resolves to; named here only because `Offscreen` must be
# asked for a `pixman::Image` by its type. Reached only by
# `crates/alo-shell/src/software_scanout.rs`.
pixman = "=0.2.1"
cosmic-text = { version = "=0.14.2", default-features = false, features = ["std", "swash"] }
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "renderer_gl", "backend_winit", "backend_session_libseat", "backend_libinput", "backend_udev", "use_system_lib", "desktop", "renderer_pixman"] }
rustix.workspace = true
thiserror.workspace = true
# The accessibility bus the tree is answered on. The bus is the rented
# at-spi2's (ADR 0011) and this crate serves its own surfaces on it; no
# reader of our own is written, here or anywhere.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
drm = "=0.14.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# An application to say who is using a camera in the in-use indicator's tests.
# Never a dependency of the shipped surface, which only draws.
alo-applications = { path = "../alo-applications" }
# The agent's own reader, used to read this machine's tree back off the bus:
# one description, read by the reader a blind person uses and by the one an
# agent uses, is the claim `alo_access::tree` makes and this measures it.
alo-adapters = { path = "../alo-adapters" }
alo-portals = { path = "../alo-portals" }
# The opener's wire words, for a door in a test that answers the way the real
# one does. Never a dependency of the shipped screen.
alo-sessiond = { path = "../alo-sessiond" }
# Real departures for the egress indicator's tests: permitted by the machine's
# own indicator, by an agent a grant names, to a source a model is answered
# at. Never a dependency of the shipped surface, which only draws.
alo-egress = { path = "../alo-egress" }
alo-models = { path = "../alo-models" }
# A whole turn for the approval surface's tests — the invocation, the file
# verbs on a real disk and the record — so *one approval, one execution* is a
# file that moved once rather than a count the test kept.
alo-context = { path = "../alo-context" }
alo-files = { path = "../alo-files" }
alo-keeping = { path = "../alo-keeping" }
tempfile = "3"
drm-ffi = "=0.9.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

# The compositor a machine boots to. One binary, and it is the only thing in
# this package that is a process rather than a library: everything it does is
# `crate::booting`'s, and what is in the file is the order and the exit codes.
[[bin]]
name = "alo-compositor"
path = "src/bin/alo-compositor.rs"

# The desktop a person arrives at after they sign in. A second process rather
# than a mode of the first, because the two belong to different people: the
# greeter is the machine's, standing in front of somebody who has not signed in,
# and this is the person's.
[[bin]]
name = "alo-desktop"
path = "src/bin/alo-desktop.rs"

[lints]
workspace = true
