[package]
name = "alo-shell"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
alo-appearance = { path = "../alo-appearance" }
alo-shortcuts = { path = "../alo-shortcuts" }
alo-strings = { path = "../alo-strings" }
cosmic-text = { version = "=0.14.2", default-features = false, features = ["std", "swash"] }
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "renderer_gl", "backend_winit", "backend_session_libseat", "backend_libinput", "backend_udev", "use_system_lib", "desktop"] }
rustix.workspace = true
thiserror.workspace = true
drm = "=0.14.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"
drm-ffi = "=0.9.1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[lints]
workspace = true
