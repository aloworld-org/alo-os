# Where the Settings window's icons came from.
#
# Taken from the design file on 2026-10-31 with the Figma connector's
# `download_assets`, one call per icon, on the icon's own *Group* node, and
# committed byte for byte as it answered — the links the connector hands out
# expire after seven days. The frames are on page 544:30910, which the owner
# approved the same day; docs/design/the-settings-window.md records them.
#
# Each file's viewBox is the group's drawing with its stroke, so it is a little
# larger than the group. `frame` is the icon's square in the design, and
# `group` is where the group sits in it — left, top, width, height, in the
# frame's units, from the insets get_design_context reported. The artwork is
# drawn centred on the group: a stroke spreads equally to every side, so the
# viewBox's centre is the group's.
#
# The colours in the files are the design's light values for where each was
# taken from. What is drawn is the palette's colour for where it is used, so the
# icons follow the person's accent, contrast and appearance.

