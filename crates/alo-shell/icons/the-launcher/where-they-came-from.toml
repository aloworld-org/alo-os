# Where the launcher's icons came from.
#
# Exported from the design file on 2026-11-01 with the Figma plugin API's
# `exportAsync({ format: 'SVG_STRING' })` on each icon's own frame, in the
# launcher the owner approved that day (`561:275`, *Find, open, or ask · the
# launcher*), and committed as it answered. Each file's viewBox is the icon's
# whole frame, so the artwork is drawn into that square and nothing else.
#
# The alo mark is the path alone from the tile `561:340`; its ground — the
# 32 × 32 `accent/soft` square at corner 8 — is drawn by the launcher, not by
# this file, so a person's appearance can colour it.
#
# The colours in the files are the design's light values. What is drawn is the
# palette's colour for where each is used.

