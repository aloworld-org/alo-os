# Where the record window's icons came from.
#
# Exported from the design file on 2026-11-01 with the Figma plugin API's
# `exportAsync({ format: 'SVG_STRING' })` on each icon's own frame, in the
# record window the owner approved that day (`560:142`, *What alo did*), and
# committed as it answered. Each file's viewBox is the icon's whole frame, so
# the artwork is drawn into that square and nothing else.
#
# Three files lost a wrapper on the way in, and nothing that draws: a
# `clip-path` group whose clip is the whole frame (agent, refused-small), and in
# what-alo-did the 16 x 16 `bg/cool` tile at corner 4, which the window draws
# itself so a person's appearance can colour it. The clip there was the
# 12 x 12 inside the tile, which every path already is.
#
# The colours in the files are the design's light values. What is drawn is the
# palette's colour for where each is used.

file = "nDxyF5Ho9oC4RObjVzwBNJ"
fetched = "2026-11-01"

