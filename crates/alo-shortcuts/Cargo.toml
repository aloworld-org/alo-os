[package]
name = "alo-shortcuts"
version = "0.0.1"
description = "What a key combination does, what a person changed it to, and what two of them wanting the same keys means."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The rule `shortcuts.toml` is kept by: only the difference, refused whole when
# wrong, written whole or not at all (ADR 0038).
alo-kept = { path = "../alo-kept" }
alo-strings = { path = "../alo-strings" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Reads the text of `shortcuts.toml` in `keeping.rs`'s tests, to see what went
# under which key.
toml = { workspace = true }

[lints]
workspace = true
