[package]
name = "alo-software"
version = "0.0.1"
description = "Installing, updating and removing a sandboxed application, from the places a person or their organisation enabled."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# What an application is and what it is known by: the identifier a grant is
# over, checked by the rules an `application` argument is checked by. Read,
# never widened here.
alo-applications = { path = "../alo-applications" }

# The one list of grants, so removing an application ends what it held in the
# same act, and the one verb an agent proposes an installation through. Nothing
# here makes a grant: there is no call in this crate that could.
alo-capability = { path = "../alo-capability" }

# Installing, looking for updates and updating all leave the machine, so each is
# an `alo_egress::Errand` and nothing here reaches the rented tool for them
# without the `Underway` that proves the line is on the indicator.
alo-egress = { path = "../alo-egress" }

# The one proxy this machine has, on the road the tool takes: installing an
# application, looking for updates and fetching one all leave the machine, and
# on a great many company networks there is no other route out. Read, never
# decided here — `alo_proxy::the_way` decides, and this crate carries.
alo-proxy = { path = "../alo-proxy" }

# Everything a person reads here.
alo-strings = { path = "../alo-strings" }

# The list of what a fresh machine ships is data beside this manifest
# (`shipped.toml`), read the way the rest of this workspace reads its files.
serde = { workspace = true }
toml = { workspace = true }

# The configuration alo OS ships with the browser (`browser.json`) is written in
# the browser's own published policy notation, which is JSON, because it is a
# file that application reads rather than anything this crate executes — a
# rented engine is configured and never patched. A workspace dependency already,
# so this adds no crate to the tree.
serde_json = { workspace = true }

thiserror = { workspace = true }

[dev-dependencies]
# The list a person sees, read before and after an installation to show nothing
# new arrived on it, and after a removal to show what the application held is
# gone from it.
alo-granted = { path = "../alo-granted" }

# Every verb alo OS ships, on one list as a daemon is handed them, so the test
# that no verb reaches the terminal is asked of all of them and not of the ones
# this crate declares.
alo-converting = { path = "../alo-converting" }
alo-files = { path = "../alo-files" }
alo-finding = { path = "../alo-finding" }
alo-measuring = { path = "../alo-measuring" }
alo-printing = { path = "../alo-printing" }
alo-adapters = { path = "../alo-adapters" }
# The workspace read for which crates declare verbs, so that list cannot drift
# from the one handed to the terminal's check.
alo-by-hand = { path = "../alo-by-hand" }

[lints]
workspace = true
