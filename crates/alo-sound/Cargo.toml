# vocabulary — so the test that holds it holds the real ones.
alo-bluetooth = { path = "../alo-bluetooth" }
alo-cameras = { path = "../alo-cameras" }
alo-capability = { path = "../alo-capability" }
alo-measuring = { path = "../alo-measuring" }
alo-opening = { path = "../alo-opening" }
alo-power = { path = "../alo-power" }
alo-saying = { path = "../alo-saying" }

[lints]
workspace = true
