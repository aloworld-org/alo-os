[package]
name = "alo-starting"
version = "0.0.1"
description = "The menu a machine with two systems on it starts at, the one place the last choice is kept, and the way out of alo OS into the Windows beside it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# ADR 0062 decided that the menu a machine starts at is alo OS's and that
# Windows stands behind it. This crate is that decision as code: the loader's
# configuration, generated rather than patched; the environment block the last
# choice is kept in, which is the only copy of it there is; and the firmware's
# next start, which is what `Restart into Windows` sets and the only thing it
# sets.
#
# It mounts nothing, and could not: it depends on no disk service, names no
# filesystem, and reaches Windows by handing the firmware's own loader over.

[dependencies]
# The broker's closed list, for the one verb this crate is the person's half of,
# and the identity a start-up entry is named by.
alo-broker = { path = "../alo-broker" }
# The broker answers with one of the record's own reasons.
alo-record = { path = "../alo-record" }
# Every sentence a person reads.
alo-strings = { path = "../alo-strings" }
thiserror = { workspace = true }

[lints]
workspace = true
