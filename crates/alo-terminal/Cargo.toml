[package]
name = "alo-terminal"
version = "0.0.1"
description = "A pseudoterminal running a person's own shell, and the grid of cells its output becomes."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# ADR 0114: the VT state machine, the grid, the scrollback and the pty are a
# pinned upstream engine behind our own interface, never written here and never
# patched. What this crate owns is the interface in front of it.
alacritty_terminal = "0.26.0"
# The typed line arrives base64 encoded, because a command may contain `;`,
# `ESC`, or bytes that are not text at all (`docs/contracts/shell-integration-marks.md`).
# **Already in `Cargo.lock` at this version under `alacritty_terminal`**, which
# this crate already pins, so nothing new enters the tree — this only makes it a
# dependency somebody declared rather than one inherited by accident.
base64 = "0.22"
# `CLAUDE.md`: user-facing strings are externalized from day one, which makes
# hardcoded English a bug. The gutter's four words are the strings this crate
# says, and `alo-strings` depends on nothing itself.
alo-strings = { path = "../alo-strings" }
thiserror = { workspace = true }

# `tcgetpgrp`, to ask the pseudoterminal which process is in front. The shell is
# the child; the command a person is waiting on is whatever the shell put in the
# foreground, and asking about the wrong one answers "waiting for the keyboard"
# every time. Linux only, as the reading of `/proc` beside it is.
[target.'cfg(target_os = "linux")'.dependencies]
# `termios` asks the terminal what it has in front; `process` signals it.
# There are two callers of the second and they want opposite things:
# `stopping_the_command_in_front.rs` sends the gentle interrupt and says why,
# and `a_shell_on_a_pseudoterminal.rs`'s `Drop` sends `SIGHUP` and then
# `SIGKILL` — because the engine's own `Drop` waits for the child with no
# deadline, and `SIGHUP` is a signal a process may ignore.
rustix = { workspace = true, features = ["termios", "process"] }

# Test-only, and nothing new in the tree: `tempfile` is already in
# `Cargo.lock` because `alo-shell` uses it, and a dev-dependency never reaches a
# shipped binary. The alternative was a second hand-rolled temporary directory
# beside the one in `the_snippet_a_person_installs_tests.rs`, and two of those
# is one more than the crate needs.
[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
