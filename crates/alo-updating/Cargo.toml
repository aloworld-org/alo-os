[package]
name = "alo-updating"
version = "0.0.1"
description = "Applying an update through the base, reading which build is running, and writing down that the machine updated."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# What an update is and what the base may be told — every decision here is
# that crate's, and this one only carries it out.
alo-keeping-up = { path = "../alo-keeping-up" }
# The entry saying the machine updated, and the entries an undo is read from.
alo-record = { path = "../alo-record" }
# Whether a verb answered a question or changed something. Read off the entry
# the record already kept, never decided here: `putting_back.rs` is the one
# place the record and what `alo-keeping-up` decides are put beside each other,
# and the column it turns on is that one.
alo-capability = { path = "../alo-capability" }
# Where that entry is written.
alo-keeping = { path = "../alo-keeping" }
# The one proxy this machine has, on the road the base takes: staging an update
# pulls a system onto the disk, and on a great many company networks there is no
# other route out. Read, never decided here.
alo-proxy = { path = "../alo-proxy" }
# Every sentence a person reads.
alo-strings = { path = "../alo-strings" }
# The base's status answer is JSON.
serde_json = { workspace = true }
thiserror = { workspace = true }

# Nothing else: no HTTP client and no container library. The base fetches and
# stages the build itself (ADR 0011); this crate runs one program with the
# arguments `alo_keeping_up::Staging` decided, and reads what it answers.

[dev-dependencies]
alo-egress = { path = "../alo-egress" }
alo-saying = { path = "../alo-saying" }
# The four clauses a person reads *afterwards*, when they look at what their
# machine did: that it updated, that it went back, that something was put back
# and that something could not be. Half of *what a person is told, before and
# after* is the after, and those four sentences are that crate's rather than
# `alo-keeping-up`'s — so the walk that ends at *it is rolled back* cannot be
# written without them. A test's alone: nothing in `src/` reads an account back.
alo-recounting = { path = "../alo-recounting" }
# Every verb alo OS ships, so the acceptance for putting something back is
# written against the machine's own `move_file` and its own words rather than
# against a verb this test invented, which could agree with a machine that
# does not exist.
alo-declared = { path = "../alo-declared" }

[lints]
workspace = true
