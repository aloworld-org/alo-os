[package]
name = "alo-walking"
version = "0.0.1"
description = "Walks a booted alo OS machine in qemu, unattended: keys with explicit press and release over QMP, screenshots taken once the screen has changed and settled, the serial log read for the journal's own sentences, and a pass or fail for each check with its evidence."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A test instrument, never shipped: nothing in the image depends on this
# package, and no crate that ships depends on it. `.github/workflows/walk.yml`
# runs its binary on a runner with KVM.

[[bin]]
name = "alo-walk"
path = "src/bin/alo-walk.rs"

[dependencies]
# The sentences the desktop says on its log for alo's acts, and the door's own
# words for what it answered — read by the walk from the same declarations the
# desktop writes them from, so the two cannot drift apart.
alo-acting = { path = "../alo-acting" }
# **alo's pointer, from the source the compositor draws it with**, so the
# pointer checks compare the screen with the same pixels `alo-shell` asks
# `alo-cursors` for, never with a picture somebody saved.
alo-appearance = { path = "../alo-appearance" }
alo-cursors = { path = "../alo-cursors" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
alo-applications = { path = "../alo-applications" }
# Reads the pictures a walk kept, in `tests/fixtures`, so a check is held to
# the screen it was wrong about. The version the workspace already locks.
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[lints]
workspace = true
