# ---------------------------------------------------------------------------
# Measured and not adopted
# ---------------------------------------------------------------------------
#
# Real variables in the design file that `palette.toml` deliberately does not
# carry. Here so that nobody has to rediscover them, and so that *absent from
# the palette* is distinguishable from *absent from the design*.
#
# The spacing and radius variables are not palette — `palette.toml`'s own header
# refuses to become the undifferentiated bucket `tokens.css` had become. The two
# extra colours were seen once each and have no role assigned.

