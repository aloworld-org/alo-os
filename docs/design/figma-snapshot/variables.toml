# ---------------------------------------------------------------------------
# Typography, measured and unadopted — and it disagrees with the brief
# ---------------------------------------------------------------------------
#
# **Eight type variables, and the family is Manrope.**
# `docs/design/figma-brief.md` says *Type: Inter throughout, EB Garamond for the
# few editorial moments*. The design file binds none of those two and binds these
# instead. Neither Inter nor EB Garamond appears as a variable in any node
# queried.
#
# **Recorded and not acted on.** The owner approved twelve **colour** roles on
# 2026-10-04 and said nothing about type; a font is a licensing decision and a
# rendering decision as well as a design one, and `palette.toml` is a palette.
# **So this is a flagged discrepancy for the owner, not a change** — and it is
# here rather than only in a report because the next lane to need a font will
# otherwise read the brief and use Inter.
#
# Measured from `8:2`; `Label/Medium` also appears in `8:8`.

