# The design file's colour variables, as measured — so the palette check runs
# here rather than against a live Figma.
#
# `docs/design/palette.toml` is what this repository reads. **This file is the
# evidence for it**: what was measured in the design file, from which node, on
# which day, and by which method. `a_palette_with_one_source.rs` compares the two
# and names any disagreement.
#
# It exists because the development PC and the Mac have **no Figma access at
# all** — a check only one machine can run is a check nobody can verify.
#
# # Provenance
#
# file key   nDxyF5Ho9oC4RObjVzwBNJ
# page       70:28  *03 — alo OS · Living canvas*
# measured   2026-10-04, by the third PC, on the owner's own Figma account
# method     the Figma MCP server's `get_variable_defs`, per node
#
# # How the method limits this, stated before any value is read
#
# **Three limits, each measured rather than assumed.** They are here and not in a
# commit message because a reader meets this file before trusting the check.
#
# **1. The set cannot be enumerated.** `get_variable_defs` returns the variables
# a node's *subtree uses*, never the collection. Every node queried added names:
# twelve from the Foundations frame, ten more from one dark screen, two more from
# one notification. **Twenty-four observed and no way to ask for the list.**
# `search_design_system` returns nothing for these names because the file's
# variables are local rather than published to a library, and
# `list_file_components_for_code_connect` refuses on plan tier — *you need a Dev
# or Full seat on an Organization or Enterprise plan*; this account is Pro.
#
# **2. The name-to-value map is not mode-coherent, at any level.** The design has
# a dark mode binding the same names to different values, and a single response
# flattens whatever its subtree used. The swatch named *alo on dark*
# (`258:16061`) returns `accent/default = #77C8C6` — the dark value — beside
# `bg/surface = #FFFFFF` and `border/default = #E7EBEF`, which are light. **One
# swatch, two modes, one map.**
#
# So *which* value a name resolves to depends on which node is asked, and
# `accent/default` is the colour ADR 0067 reserves for the agent. Measured from
# `258:16048` instead of `8:8`, this file would have carried the dark teal as the
# light palette and the check would have agreed.
#
# **3. Collection, mode and variable identifiers are not exposed.** No tool here
# returns them, and the owner's direction of 2026-10-04 asks for them — so this
# is an **explicit gap, not an omission**. The Figma REST endpoint
# `/v1/files/:key/variables/local` returns all three and needs a personal access
# token this machine does not hold.
#
# So the `[light]` and `[dark]` tables below are **this file's own grouping of
# what was observed**, not Figma's modes. They carry no mode id because none was
# available, and `[provenance]` says so in the file rather than only here. A
# later change that obtains a token should replace the grouping with the real
# collection and mode identifiers rather than annotate it.
#
# # Audit gaps, which are gaps and not omissions
#
# **Unbound fills.** The variables do not describe every rendered surface.
# `get_variable_defs` on the minimized rail (`337:23664`) returns `{}` — its
# fills are not bound to variables at all. **So a surface agreeing with this file
# is not the same as a surface being correct**, and the rail's own material
# specification — base, opacity, blur, border, shadow — is not here and must be
# measured from the fills and effects rather than inferred from a hex.
#
# **Four of the twelve are not confirmed from a pure-light node** by this
# measurement: `text/muted`, `bg/cool`, `status/warning` and `status/danger`.
# See `confirmed_from` on each entry.
#
# # Two earlier records in this repository agree, which is why the four stand
#
# Found while migrating rather than assumed. **Every one of the twelve is
# attested by at least two independent records**, and the four weak ones are
# attested by the oldest:
#
# **`docs/design/the-palette-foundations-states.md`** (PR #192, 2026-09-27) is
# the owner's palette dictated a week before this measurement. It carries *Muted
# text #596B78*, *Cool surface #EEF2F4*, *Warning #8C5A0A* and *Danger #B42318* —
# **all four, at exactly these values** — plus light cream, white, navy, deep
# teal, soft teal and positive green. Ten of the twelve.
#
# **`docs/design/the-canvas-in-numbers.md`** carries the remaining two from frame
# `70:29`: `text/secondary #274C68` and `border/default #E7EBEF`.
#
# So the four are not *authority in place of measurement*. The owner stated them
# on 2026-09-27, this file measured them on 2026-10-04, and the two agree.
# `corroborated_by` on each entry names which record.

format = 1

[provenance]
file_key = "nDxyF5Ho9oC4RObjVzwBNJ"
page = "70:28"
page_name = "03 — alo OS · Living canvas"
measured_on = "2026-10-04"
measured_by = "the third PC"
method = "Figma MCP get_variable_defs, per node"
collection = "not exposed by this interface"
mode_ids = "not exposed by this interface"
variable_ids = "not exposed by this interface"

