# What the boot environment's initramfs carries, as the base's own dracut is
# told it. Configuration, not code: dracut is the base's, unmodified, and this
# file is the list of what to put in.
#
# Every program `crates/alo-installing` runs is here at the path it runs it
# from, and a test in that crate fails when one is not. The rest is what
# `bootc install to-disk` runs in turn — measured, one refusal at a time, by
# booting the environment in a virtual machine on 2026-09-15 (`docs/quirks.md`):
# the partitioner and the file-system makers; `bwrap`, which the installer runs
# the boot loader's installer inside; `podman`, `conmon`, `crun` and
# `netavark`, because the installer initialises a container store on the new
# disk; `skopeo`, which pulls; `setpriv` and the systemd name service, because
# the pull runs as `nobody` and a name is looked up to do it; and the
# configuration those read.

# The network manager's own initramfs integration, which brings a wired
# connection up from `ip=dhcp`. Not added by default.
add_dracutmodules+=" network-manager "

# **Wireless, so a person with no cable can install.** `docs/features.md`
# promises *download, click, reboot, sign in* with no cable in it, and the
# audience is developers, most of whom have none. The installed system gained
# this in #844; the environment is the other half, and until now it could bring
# up only a wired connection from `ip=dhcp`.
#
# **Every path below was read out of image 0.0.8 by digest**
# (`sha256:a543874e…`), unpacked and listed, rather than taken from a
# distribution's convention. This file's header says why: each entry here was
# found *one refusal at a time, by booting the environment*, and `docs/quirks.md`
# records three boots each ended by one missing path.
#
# | measured | |
# |---|---|
# | `/usr/bin/wpa_supplicant` | 3,221,896 b — the rpm's own path. `/usr/sbin/wpa_supplicant` resolves too (Fedora 42 merged them) and is **not** the one named |
# | `/etc/dbus-1/system.d/wpa_supplicant.conf` | 743 b — the **bus policy**, and in `/etc` rather than `/usr/share`. Without it the bus denies NetworkManager's call and the error names NetworkManager rather than this file |
# | `fi.w1.wpa_supplicant1.service` | 123 b — activation. NetworkManager reaches the supplicant over the bus rather than starting it |
# | `libnm-device-plugin-wifi.so` | under a directory named for NetworkManager's version — `1.52.2-1.fc42` on 2026-10-20 — which is why it is the one **pattern** here and not a path. `dnf` chooses that version from the live repository, so it is not fixed by the base's digest, and a pattern that matches nothing is caught by the check below rather than passing |
# | `regulatory.db` and `.p7s` | 6,308 b and 1,085 b. Without them the card falls back to the most restrictive domain and association on some channels simply does not happen — which reads as *no networks found* |
# | `/usr/bin/nmcli` | 940,648 b — what `alo_installing::Program` drives to scan and join |
#
# **The firmware is named at its real path and not at the link.**
# `/usr/lib/firmware/iwlwifi-3168-29.ucode.xz` is a **38-byte symlink** into
# `intel/iwlwifi/`; the file is 262,656 bytes. Naming the link would put a
# dangling 38 bytes in the initramfs — the path exists, `test -e` passes, and the
# kernel cannot read the firmware. That surfaces as *no networks found* as well,
# which is the third way this one sentence can mean three different faults.
#
# **The certified machine's card only**, which is `certified before compatible`
# rather than a size limit: all 178 Intel blobs are 82 MB and would fit the
# area. `docs/hardware.md`'s machine carries an Intel AC 3168. A person with
# another Intel card gets a driver that loads and finds no firmware, and
# `alo-installing` says *that* rather than *no networks found* — the refusal
# exists because this line is narrow.
install_items+=" /usr/bin/wpa_supplicant /usr/bin/wpa_cli /usr/bin/nmcli "
install_items+=" /usr/lib/systemd/system/wpa_supplicant.service "
install_items+=" /usr/share/dbus-1/system-services/fi.w1.wpa_supplicant1.service "
install_items+=" /etc/dbus-1/system.d/wpa_supplicant.conf "
install_items+=" /usr/lib64/NetworkManager/*/libnm-device-plugin-wifi.so "
install_items+=" /usr/lib/firmware/intel/iwlwifi/iwlwifi-3168-29.ucode.xz "
install_items+=" /usr/lib/firmware/regulatory.db /usr/lib/firmware/regulatory.db.p7s "

# **The system bus, named rather than inherited.** `dbus-broker` is already in
# the initramfs — nothing here asked for it, and `nm-online` has returned
# success in a real boot (`docs/quirks.md`'s *Creating rootfs* entry, 2026-09-22,
# which is after the network wait), which it cannot do without a bus. So
# dracut's `network-manager` module brings one. **Naming it is a belt**: relying
# on another module's transitive choice is the kind of thing that changes under
# you, and Wi-Fi cannot work at all without a bus however complete the rest is.
#
# `dbus-daemon` is **absent** from the image; `dbus-broker` is the bus.
install_items+=" /usr/bin/dbus-broker /usr/bin/dbus-broker-launch "

# The drivers, by module name, which is what dracut takes. An initramfs carries
# no module it was not told about. All five are in 6.19.14-101.fc42, read out of
# the image: `iwlmvm` is what the AC 3168 uses and `iwldvm` is Intel's older
# cards.
add_drivers+=" iwlwifi iwlmvm iwldvm cfg80211 mac80211 "

# The base's own boot-time integrations for an installed system. This is not
# one, and they wait for a root that is never coming.
omit_dracutmodules+=" plymouth ostree bootc "

install_items+=" /usr/bin/alo-installing /usr/lib/systemd/system/alo-installing.target /usr/lib/systemd/system/alo-installing.service /usr/lib/systemd/system/run-alo-installing-root.mount "

# What the installer's root is bound with (`run-alo-installing-root.mount`).
install_items+=" /usr/bin/mount "
install_items+=" /usr/lib/alo/installing/pinned.toml /usr/lib/alo/installing/signing/alo-os.pub "

# What alo-installing runs.
# `/usr/bin/ip` is named rather than inherited. It is already aboard —
# dracut's own `network` module brings it, and the candidate of 2026-10-20 has
# it at this path, read out of the shipped initramfs — but nothing here asked
# for it, and a path this program runs that arrives as another module's
# transitive choice is exactly what this list exists to stop. The check in
# `image/installing/Containerfile` now proves it is there.
install_items+=" /usr/bin/lsblk /usr/bin/nm-online /usr/bin/ip /usr/bin/cosign /usr/bin/bootc /usr/bin/systemctl "

# What the installer runs in turn.
install_items+=" /usr/bin/bwrap /usr/sbin/efibootmgr /usr/bin/bootupctl /usr/bin/ostree /usr/bin/skopeo /usr/bin/podman /usr/bin/conmon /usr/bin/crun /usr/libexec/podman/netavark "
install_items+=" /usr/sbin/sfdisk /usr/sbin/mkfs.ext4 /usr/sbin/mkfs.fat /usr/sbin/mkfs.vfat /usr/sbin/mkfs.xfs /usr/sbin/wipefs /usr/sbin/blkid /usr/sbin/partx /usr/sbin/losetup /usr/sbin/udevadm "

# The maker of the one file system the installer asks for
# (`alo_image::THE_ONLY_FILESYSTEM`, `--filesystem btrfs`). bootc starts it by
# name as the disk's root is made, and says only *Creating rootfs: No such file
# or directory (os error 2)* when it is not there — measured on the installer's
# own road on 2026-09-22, 3–4 s after the disk was partitioned (`docs/quirks.md`,
# *`bootc install` stops at "Creating rootfs" when the environment lacks the
# file system's maker*). The kernel has btrfs built in; nothing else is needed.
install_items+=" /usr/sbin/mkfs.btrfs "

install_items+=" /usr/sbin/setpriv /usr/sbin/fsfreeze /usr/sbin/chattr /usr/sbin/chcon /usr/bin/findmnt /usr/bin/chroot /usr/bin/unshare /usr/bin/systemd-run "

# What the installer finishes with, after the image is deployed and the boot
# loader installed: it trims, remounts read-only and freezes each file system it
# made, then unmounts them all (`finalize_filesystem` and `install_to_disk` in
# bootc 1.15.1). Each is started by name with nothing said around a failure to
# start it, so a missing one ends the install *No such file or directory (os
# error 2)* with the image already on the disk — measured in a virtual machine on
# 2026-09-16 with `fstrim` missing (`docs/quirks.md`, *`bootc install` ends
# "No such file or directory" when the environment lacks `fstrim`*).
install_items+=" /usr/sbin/fstrim /usr/bin/umount "

install_items+=" /usr/lib/ostree/prepare-root.conf "
install_items+=" /etc/nsswitch.conf /usr/lib64/libnss_systemd.so.2 "
# **Two paths were here and are not in the base.**
# `/etc/containers/containers.conf` and `/etc/containers/storage.conf` were
# named from the day this list was written and have never been in any
# initramfs, because the base does not have them: Fedora ships those two
# defaults in `/usr/share/containers/`, which the line below names and which is
# where podman reads them from. `dracut` exits **0** for a path it cannot find
# (measured in the pinned base on 2026-10-20), so nothing said so, and the
# installs that worked had never carried them. Removed rather than kept as a
# belt, because a list that names what is not there cannot be checked — and it
# is checked now, in `image/installing/Containerfile`, against the initramfs it
# builds.
install_items+=" /etc/containers/policy.json /etc/containers/registries.conf /etc/containers/registries.conf.d/000-shortnames.conf /etc/containers/registries.d/default.yaml "
install_items+=" /usr/share/containers/containers.conf /usr/share/containers/storage.conf /usr/share/containers/mounts.conf /usr/share/containers/seccomp.json "
install_items+=" /etc/pki/tls/certs/ca-bundle.crt /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem "
