# What the boot environment's initramfs carries, as the base's own dracut is
# told it. Configuration, not code: dracut is the base's, unmodified, and this
# file is the list of what to put in.
#
# Every program `crates/alo-installing` runs is here at the path it runs it
# from, and a test in that crate fails when one is not. The rest is what
# `bootc install to-disk` runs in turn — measured, one refusal at a time, by
# booting the environment in a virtual machine on 2026-09-15 (`docs/quirks.md`):
# the partitioner and the file-system makers; `bwrap`, which the installer runs
# the boot loader's installer inside; `podman`, `conmon`, `crun` and
# `netavark`, because the installer initialises a container store on the new
# disk; `skopeo`, which pulls; `setpriv` and the systemd name service, because
# the pull runs as `nobody` and a name is looked up to do it; and the
# configuration those read.

# The network manager's own initramfs integration, which brings a wired
# connection up from `ip=dhcp`. Not added by default.
add_dracutmodules+=" network-manager "

# The base's own boot-time integrations for an installed system. This is not
# one, and they wait for a root that is never coming.
omit_dracutmodules+=" plymouth ostree bootc "

install_items+=" /usr/bin/alo-installing /usr/lib/systemd/system/alo-installing.target /usr/lib/systemd/system/alo-installing.service /usr/lib/systemd/system/run-alo-installing-root.mount "

# What the installer's root is bound with (`run-alo-installing-root.mount`).
install_items+=" /usr/bin/mount "
install_items+=" /usr/lib/alo/installing/pinned.toml /usr/lib/alo/installing/signing/alo-os.pub "

# What alo-installing runs.
install_items+=" /usr/bin/lsblk /usr/bin/nm-online /usr/bin/cosign /usr/bin/bootc /usr/bin/systemctl "

# What the installer runs in turn.
install_items+=" /usr/bin/bwrap /usr/sbin/efibootmgr /usr/bin/bootupctl /usr/bin/ostree /usr/bin/skopeo /usr/bin/podman /usr/bin/conmon /usr/bin/crun /usr/libexec/podman/netavark "
install_items+=" /usr/sbin/sfdisk /usr/sbin/mkfs.ext4 /usr/sbin/mkfs.fat /usr/sbin/mkfs.vfat /usr/sbin/mkfs.xfs /usr/sbin/wipefs /usr/sbin/blkid /usr/sbin/partx /usr/sbin/losetup /usr/sbin/udevadm "
install_items+=" /usr/sbin/setpriv /usr/sbin/fsfreeze /usr/sbin/chattr /usr/sbin/chcon /usr/bin/findmnt /usr/bin/chroot /usr/bin/unshare /usr/bin/systemd-run "
install_items+=" /usr/lib/ostree/prepare-root.conf "
install_items+=" /etc/nsswitch.conf /usr/lib64/libnss_systemd.so.2 "
install_items+=" /etc/containers/policy.json /etc/containers/registries.conf /etc/containers/registries.conf.d/000-shortnames.conf /etc/containers/registries.d/default.yaml /etc/containers/containers.conf /etc/containers/storage.conf "
install_items+=" /usr/share/containers/containers.conf /usr/share/containers/storage.conf /usr/share/containers/mounts.conf /usr/share/containers/seccomp.json "
install_items+=" /etc/pki/tls/certs/ca-bundle.crt /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem "
