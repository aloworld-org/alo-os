# The boot environment's one entry. No menu, no wait: the person already chose
# to restart into it.
#
# The base's own loader reads this file from the directory it was started from,
# and names that directory `${config_directory}`. The chosen disk is not written
# here, because this file is the same on every machine: the program that stages
# the environment writes `chosen.cfg` beside it, holding one line,
# `set alo_installing_to=<the disk's own name>`. With no such file the variable
# stays empty, and the environment refuses rather than choosing a disk itself.
#
# **Not `${cmdpath}`**, which is the variable this file used until 2026-09-16 and
# which the base's loader leaves empty: Fedora's `grubx64.efi` is built with the
# prefix `/EFI/fedora` baked in, finds no configuration there, and falls back to
# the directory it was itself loaded from — setting `config_directory` and
# nothing else. Measured in a virtual machine: `cmdpath=[]`,
# `prefix=[(hd0,gpt5)/EFI/fedora]`, `config_directory=[(hd0,gpt5)/EFI/BOOT]`
# (`docs/quirks.md`, *Fedora's signed loader leaves `cmdpath` empty*). With
# `cmdpath` the choice was never read and every install refused *no disk was
# chosen*.
#
# `console=ttyS0,115200 console=tty0` gives the kernel a serial console as well
# as the screen, the screen last so it is the one a person watches;
# alo-installing writes every sentence to both. `rd.shell=0`: this is not a
# second operating system, and it offers nobody a shell.

set timeout=0
set alo_installing_to=
if [ -f "${config_directory}/chosen.cfg" ]; then
  source "${config_directory}/chosen.cfg"
fi

linux /EFI/alo-installing/vmlinuz rd.systemd.unit=alo-installing.target rd.neednet=1 ip=dhcp rd.shell=0 console=ttyS0,115200 console=tty0 alo.installing.to=${alo_installing_to}
initrd /EFI/alo-installing/initramfs.img
boot
