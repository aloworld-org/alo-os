# The one alo OS image an installer pulls, pinned by content.
#
# ADR 0033 §3 publishes the image to a registry and pins, here, the digest an
# installer pulls; ADR 0036 says who may make a digest worth pinning — a person
# holding the private half of the key whose public half is `key` below, signing
# **by digest**, never an agent and never the build loop. A digest lands in this
# file only once that signature verifies against that key.
#
# Two layers, and both are kept: the digest is what an installer already
# released will pull, so a stolen key cannot redirect it; the signature is what
# a boot environment checks before it writes anything, so a registry that
# changed the bytes cannot get past it.
#
# `crates/alo-image` reads this file and holds it to `image/Containerfile`'s
# `org.opencontainers.image.version`, to `docs/booting.md`, and to the key. It is
# not copied into the image: it names the image, so it cannot be inside it.
#
# Release 0.0.1: built from 2501af53d459d7d75e08c2ecaf61d3e8430a2d50, pushed and
# signed by the owner on 2026-09-15 (cosign 3.1.3, no transparency log), and
# verified against `signing/alo-os.pub`; a different key was refused.
#
# The next release is declared as `next = "MAJOR.MINOR.PATCH"` in the same
# change that moves the recipe's label to it, and removed in the change that
# pins its digest. Until then the recipe names a candidate, and an installer
# still pulls what is pinned.

registry = "ghcr.io/aloworld-org/alo-os"

# Release 0.0.2: built from 8d2619daeb07b4b0ebbed59ded8caee722103b65, pushed and
# signed by the owner on 2026-09-17 (cosign 3.1.3, by digest, no transparency
# log), and verified against `signing/alo-os.pub`; a different key was refused
# with *Found: 0, Expected 1*. It carries `usr/lib/tmpfiles.d/alo.conf`, the
# door on the way to the boundary, which 0.0.1 did not — and the document
# converter, checked executable inside the built image before it was pushed.
#
# The digest is the one the **registry** reports, not the one podman gives the
# local copy: those differ, and a signature over the local digest would verify
# here and be unpullable everywhere else.
#
# Release 0.0.3: built from a875f80e3100ab51ac5fc64c762f5fc3fcde75f5, pushed and
# signed by the owner on 2026-09-19 (cosign 3.1.3, by digest, no transparency
# log), and verified against `signing/alo-os.pub`; a different key was refused
# with *Found: 0, Expected 1*. It exists because the image gained a media
# server: without one, four crates correctly answered *nothing here handles
# sound and video*.
#
# Every line above was read back from the registry rather than from the machine
# that built it — the digest from `docker-content-digest`, and the revision from
# the image's own `org.opencontainers.image.revision` label in its config blob.
# What a local copy says about itself is not what an installer will pull.

version = "0.0.3"
digest = "sha256:41d43c7ea491990eea602493e5c645bd7bf8e7d0d9d7a8e9a000bc895a9dd0d7"
revision = "a875f80e3100ab51ac5fc64c762f5fc3fcde75f5"
key = "signing/alo-os.pub"
