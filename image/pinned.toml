# The one alo OS image an installer pulls, pinned by content.
#
# ADR 0033 §3 publishes the image to a registry and pins, here, the digest an
# installer pulls; ADR 0036 says who may make a digest worth pinning — a person
# holding the private half of the key whose public half is `key` below, signing
# **by digest**, never an agent and never the build loop. A digest lands in this
# file only once that signature verifies against that key.
#
# Two layers, and both are kept: the digest is what an installer already
# released will pull, so a stolen key cannot redirect it; the signature is what
# a boot environment checks before it writes anything, so a registry that
# changed the bytes cannot get past it.
#
# `crates/alo-image` reads this file and holds it to `image/Containerfile`'s
# `org.opencontainers.image.version`, to `docs/booting.md`, and to the key. It is
# not copied into the image: it names the image, so it cannot be inside it.
#
# Release 0.0.1: built from 2501af53d459d7d75e08c2ecaf61d3e8430a2d50, pushed and
# signed by the owner on 2026-09-15 (cosign 3.1.3, no transparency log), and
# verified against `signing/alo-os.pub`; a different key was refused.
#
# The next release is declared as `next = "MAJOR.MINOR.PATCH"` in the same
# change that moves the recipe's label to it, and removed in the change that
# pins its digest. Until then the recipe names a candidate, and an installer
# still pulls what is pinned.

registry = "ghcr.io/aloworld-org/alo-os"

# Release 0.0.2: built from 8d2619daeb07b4b0ebbed59ded8caee722103b65, pushed and
# signed by the owner on 2026-09-17 (cosign 3.1.3, by digest, no transparency
# log), and verified against `signing/alo-os.pub`; a different key was refused
# with *Found: 0, Expected 1*. It carries `usr/lib/tmpfiles.d/alo.conf`, the
# door on the way to the boundary, which 0.0.1 did not — and the document
# converter, checked executable inside the built image before it was pushed.
#
# The digest is the one the **registry** reports, not the one podman gives the
# local copy: those differ, and a signature over the local digest would verify
# here and be unpullable everywhere else.
#
# Release 0.0.3: built from a875f80e3100ab51ac5fc64c762f5fc3fcde75f5, pushed and
# signed by the owner on 2026-09-19 (cosign 3.1.3, by digest, no transparency
# log), and verified against `signing/alo-os.pub`; a different key was refused
# with *Found: 0, Expected 1*. It exists because the image gained a media
# server: without one, four crates correctly answered *nothing here handles
# sound and video*.
#
# Every line above was read back from the registry rather than from the machine
# that built it — the digest from `docker-content-digest`, and the revision from
# the image's own `org.opencontainers.image.revision` label in its config blob.
# What a local copy says about itself is not what an installer will pull.
#
# **Release 0.0.4 is the first alo OS release that can open a document**, and
# that is the whole reason it exists. Built from
# b41b4b5ed36ea29b974af0c13d2f7ed9105169a7, pushed and signed by the owner on
# 2026-09-20 (cosign 3.1.3, by digest, no transparency log), verified against
# `signing/alo-os.pub`; a different key was refused with *Found: 0, Expected 1*.
#
# Every release before it — 0.0.1, 0.0.2 and 0.0.3 — shipped a document
# converter that could not start. `ldd` inside the published images reported
# eleven and then twelve libraries *not found*, and the engine died at launch on
# `libXinerama.so.1`, so no document of any format opened on a real machine,
# `.docx` included, and ADR 0039's promise was unmet in the shipped product from
# the day the converter was added.
#
# It went unnoticed for three releases because the build checked the engine's
# **executable bit** rather than running it — a proxy for the thing tested
# instead of the thing. The recipe now converts a document while it builds and
# fails if nothing comes out, so this image existing is itself the evidence that
# its engine ran. Measured again on the pushed image: no missing libraries, and
# a real Pages document converted to ODT with 778 characters of its text
# recovered.
#
# The digest and the revision here were both read back from the **registry** —
# the digest from `docker-content-digest`, the revision from the image's own
# `org.opencontainers.image.revision` label in its config blob.
#
# Declared 2026-09-20, in the change that moved the recipe's label to it.
# **0.0.5 exists because every release before it could decode the sound of a
# file and nothing else.** Measured inside the published images: each carried
# all five audio decoders ADR 0058 names and **not one video decoder** — no
# `libdav1d`, no `libvpx`, no `libopenh264` — and nothing to drive them, no
# GStreamer and no player. AV1 and VP9 are what this machine *encodes*
# (ADR 0051), so a machine could not play back its own screen recording.
#
# It survived three releases because `alo-playing` held the decided list as
# types and every one of its tests was green — and not one of them was about
# the image. A decision can be written down, held in code, and absent from the
# thing that ships.
#
# The recipe now inspects each decoder by name and fails the build when one is
# missing, and refuses `gstreamer1-plugins-libav` — the bundle that would carry
# formats the decision does not permit, HEVC among them, past a rule enforced
# nowhere else at runtime.
#
# **Signed by the owner on 2026-09-21** (cosign 3.1.3, by digest, no
# transparency log), verified against `signing/alo-os.pub`; a different key was
# refused with *Found: 0, Expected 1*.
#
# **It records as well as plays, and that half was missing too.** Every release
# before this one shipped no encoder either, so a machine could neither play a
# film nor make one, while ADR 0051 says it produces AV1 or VP9, Opus and
# Matroska. Measured inside this image by digest, with nothing added and no
# network: a recording made here — 18 585 bytes of AV1 in Matroska — played
# back to 288 000 bytes of raw frames, which is ten frames of 160×120 I420 to
# the byte; a document converted to 8 312 bytes of ODT; and no
# `gstreamer1-plugins-libav`, no `x264enc`, no `x265enc`.
#
# **`pipewire-gstreamer` is in it because looking for completeness found it.**
# GStreamer installs without `pipewiresrc` and `pipewiresink`, which are the
# elements every screenshot and screen recording goes through — so the image
# would have carried a media pipeline that could not reach its own media
# server, and the capture fault fixed in code on 2026-09-20 would have returned
# from the image side. The build demands all eleven elements by name now.

version = "0.0.5"

# **A candidate is being built, and nothing here is pinned to it.** Declared
# 2026-09-23 in the same change that moved the recipe's label, which is what the
# header above requires. `version`, `digest`, `revision` and `key` all still name
# 0.0.5 — the release the owner signed — so an installer keeps pulling that and
# not this.
#
# It carries the first compositor binary this image has ever had: until it,
# `crates/alo-shell` had no binary at all and a machine booted to a console.
#
# **This line stays until 0.0.6 is pinned.** If it never is — if the candidate is
# only ever a screenshot — whoever prepares the next release removes it.
next = "0.0.6"
digest = "sha256:6c9abbc5a6a0f5299991f4cca65152452b3cbae339b161059528d72f2aad3ba1"
revision = "97c970c96f2c13f2341ed94fb264247fb6837442"
key = "signing/alo-os.pub"
