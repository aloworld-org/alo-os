# A serial console, so a boot is a record rather than a photograph.
#
# Until this file existed, a booted alo OS machine said nothing a reader could
# keep. GRUB writes to serial on its own, so a boot log ended at *Booting `alo
# OS 0.0.6 (ostree:0)'* and everything Linux did afterwards — every unit that
# started, every one that failed, the journal entire — reached the screen and
# nowhere else.
#
# **Measured on 2026-10-10 and again on the 11th.** Two boots were diagnosed
# from screenshots, because screenshots were all there was: the greeter was
# seen to render, and whether `alo-portald` was crash-looping could be
# asserted from memory and not shown. An operating system that cannot say what
# happened to it is one whose faults are found by looking at pixels.
#
# `console=ttyS0,115200 console=tty0`, **the screen last on purpose**, and the
# reason is `image/installing/grub.cfg`'s, which has carried the same pair for
# the installer since it was written: the last `console=` is the one the kernel
# makes primary, and that must be the screen a person is actually watching. The
# serial line is the second one, for whoever is reading.
#
# # The journal, and not only the first ninety seconds of it
#
# `systemd.journald.forward_to_console=1` is the second half, and the first
# boot with a serial console is what found it needed. systemd writes unit
# messages to the console only until `systemd-journald` takes over: measured on
# 2026-10-11, the last one was at **95 seconds** and the greeter starts after
# that. The log had the kernel ring buffer, the audit trail and early boot, and
# not one line about the surfaces this machine exists to draw.
#
# It was nearly read as *the greeter never started*, because the audit trail
# names 48 units and the compositor is not among them. The screenshot showed it
# rendering. An incomplete log read as an absence is the fault this whole file
# was written to stop.
#
# # And `forward_to_console` alone did not do it — measured 2026-10-11
#
# **This file claimed that line put the journal on the serial port. It did
# not, and the first boot carrying it proved so:** of 856 lines captured from
# `ttyS0`, **856 carried a kernel timestamp prefix and none came from the
# journal.** The gain over the 3.8 KB that came before was real — the kernel
# ring buffer and the whole audit trail, 89 KB of it, where there had been
# nothing after GRUB's last line — and it was not the journal.
#
# The reason is this file's own other decision. `forward_to_console` writes to
# the **primary** console, and the paragraph above deliberately puts `tty0`
# last so that the primary console is the screen a person is watching. Both
# choices are right and together they send the journal to the screen, which is
# the one place a reader of a serial port cannot see. Two correct decisions
# that contradict each other is a worse fault than one wrong one, because
# neither looks wrong on its own.
#
# So `systemd.journald.tty_path=/dev/ttyS0` names where the forwarding goes,
# which is the option journald has for exactly this. The screen stays primary
# and the reader gets the journal.
#
# # What this costs, said plainly — corrected 2026-10-11
#
# **This said the cost was that kernel messages become readable by somebody
# holding the port. That understated it, and the first boot proved so:
# `console=ttyS0` makes systemd start `serial-getty@ttyS0`, which is an
# interactive login prompt on that port.** Audit recorded it starting. A
# diagnostic facility had quietly added a way in.
#
# So the recipe masks `serial-getty@ttyS0.service`, the same answer and for the
# same reason as `getty@tty1.service`: the console output is wanted and the
# login prompt is not. What remains is the true cost — somebody at a physical
# serial port can read the journal, and anybody at that port is already at the
# machine. The certified laptop (ADR 0033) has no serial port at all.
#
# It is written here rather than in the recipe so that `bootc` owns it: kernel
# arguments belong to the deployment, and a `RUN` line editing GRUB would be a
# second place that decides how this machine boots.

kargs = [
    "console=ttyS0,115200",
    "console=tty0",
    "systemd.journald.forward_to_console=1",
]
