# Applications describe themselves to alo and to screen readers, as a machine
# comes: the owner's decision of 2026-11-11, "On by default, switch in
# Settings". Each toolkit has its own switch (crates/alo-launching,
# describing_themselves): GTK 3 and 4 describe themselves unless told not to,
# Qt only when QT_LINUX_ACCESSIBILITY_ALWAYS_ON is set, Firefox when
# GNOME_ACCESSIBILITY=1, and a Chromium or Electron window when
# ACCESSIBILITY_ENABLED=1. The page inside a Chromium window needs a switch on
# its command line, which the desktop adds; no variable carries it.
#
# A default, not a rule: a person who turns the switch off in Settings ->
# Accessibility has their session told otherwise, and a person's own
# ~/.config/environment.d is read after this file and wins.
NO_AT_BRIDGE=0
GTK_A11Y=0
GNOME_ACCESSIBILITY=1
ACCESSIBILITY_ENABLED=1
QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
