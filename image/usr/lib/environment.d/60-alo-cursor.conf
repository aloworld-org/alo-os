# alo's own pointer, for applications that draw their own rather than asking
# the compositor for a shape by name (docs/features.md, The alo Cursor).
#
# A default, not a rule: a person's own ~/.config/environment.d is read after
# this file and wins, so somebody who prefers another cursor theme keeps it.
# The theme is written at build time from the vector source the compositor
# draws from (crates/alo-cursors, alo-cursor-theme).
XCURSOR_THEME=alo
XCURSOR_SIZE=24
