# Where the forwarded journal is written: the serial line, not the screen.
#
# `usr/lib/bootc/kargs.d/console.toml` turns forwarding on and explains why a
# boot needs it. This says where it goes, and it is a separate file because it
# is a separate mechanism: forwarding is a kernel argument journald reads,
# and the destination is not.
#
# # Why this is not a kernel argument, which was tried first
#
# `systemd.journald.tty_path=/dev/ttyS0` was added to `console.toml` on
# 2026-10-11, gated green, and **did nothing at all.** The image was built
# with it and booted, and of 854 lines on `ttyS0`, 854 still carried a kernel
# timestamp prefix and none came from the journal — the same count as the
# boot before it.
#
# journald accepts exactly ten `systemd.journald.*` kernel arguments, asked of
# the binary rather than of a manual page:
#
#     forward_to_console  forward_to_kmsg  forward_to_syslog  forward_to_wall
#     max_level_console   max_level_kmsg   max_level_socket   max_level_store
#     max_level_syslog    max_level_wall
#
# `tty_path` is not among them, and a kernel argument journald does not know
# is not an error — GRUB carries it, the kernel carries it, `/proc/cmdline`
# shows it, and nothing reads it. **A plausible kernel argument that is
# silently ignored is the worst kind of fix**, because every artefact of it
# looks correct: the file says the right thing, the check passes, the boot
# succeeds, and the journal is still on the screen.
#
# So it is here, where `TTYPath` is a key journald actually reads.
# `/usr/lib/systemd/journald.conf` ships it commented as
# `#TTYPath=/dev/console`, and `/dev/console` is the primary console, which
# `console.toml` deliberately makes `tty0` — the screen. That default is what
# sent the journal to the one place a reader of a serial port cannot see.
#
# # Why 20-
#
# After `10-centos-bootc-persistent.conf`, which the base ships to make the
# journal persistent. Both are wanted: persistence is what let this fault be
# diagnosed at all, by mounting the written disk and reading the journal the
# console never carried.

[Journal]
TTYPath=/dev/ttyS0
