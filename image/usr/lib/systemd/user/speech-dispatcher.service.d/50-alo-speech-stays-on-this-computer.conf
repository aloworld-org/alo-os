# What the screen reader says stays on this computer (ADR 0151).
#
# Speech Dispatcher is usually started by Orca, inside alo-screen-reader.service
# and under its rule. Where it is started by its own socket instead, it is held
# to the same rule here: it speaks through eSpeak NG on this machine and talks to
# Orca and to the sound server over local sockets, so it needs no internet
# socket and is allowed none.
[Service]
RestrictAddressFamilies=AF_UNIX
