# The two logins this machine has, and the group they meet in.
#
# They are here rather than in a `useradd` line in the Containerfile because the
# numbers are a contract: /etc/alo/agentd.toml names all three, and a machine
# whose accounts and whose description disagree is a machine where the kernel's
# answer about who is on the socket means something other than what the daemon
# thinks it means. `crates/alo-image` is what checks the two files against each
# other, and the Containerfile checks both against the base.
#
# ADR 0001 §5: the agent is a login of its own. That is the whole division —
# nothing on the wire says who a caller is, SO_PEERCRED does, and these numbers
# are what it is compared against.
#
# **The agent's number is not in the ordinary system range, and that was
# measured rather than chosen.** 989 was the number every document in this
# repository used as its example, and on the pinned base gid 989 is
# systemd-resolve's — so `systemd-sysusers` would have put alo OS's agent into
# the resolver's group without saying anything more than a line in a build log.
# Fedora allocates system logins downward from 999, so *every* number in that
# range is one a base update can take. systemd's own uid range document leaves
# 60578-61183 allocated by nothing at all, and that is where the agent goes:
# a number the base cannot move under us. docs/quirks.md has the measurement.

# The group the two meet in. The agent reaches the person's socket through it,
# and the loader hands it the one map a daemon may write.
g alo-agent 60989

# The agent. It signs in nowhere, owns nothing a person owns, and is never root.
u alo-agent 60989:60989 "alo OS agent" /var/lib/alo-agent /usr/sbin/nologin

# The person. On this image there is no screen to sign in at, so this is the
# login alo-agentd runs as rather than one anybody has logged into yet. 1000 is
# the first ordinary user on any Linux, which is the one number here that no
# system package will ever ask for.
u alo 1000 "alo OS" /home/alo /bin/bash

# And the person is in the agent's group, which is how the socket can be handed
# to it at all: changing a file's group is only allowed to a member of it.
m alo alo-agent

# The greeter, and the group the sign-in door is handed to (ADR 0024).
#
# `alo-sessiond` runs as root in this group and opens its door to it, so the
# group is what decides who may ask for a session — there is no name and no
# number anywhere in that decision, which is why the group has to exist on the
# image rather than being something a surface configures later. The surface that
# will run as this login is the desktop lane's; what is here is the identity its
# door already refuses everybody but.
#
# 60990 for 60989's reason, measured rather than chosen: Fedora allocates system
# logins downward from 999, so every number in the ordinary system range is one a
# base update can take, and systemd's own uid range document leaves 60578-61183
# allocated by nothing at all. It sits beside the agent's, and the Containerfile
# asserts it the way it asserts the other three.
g alo-greeter 60990

# It signs in nowhere either. It is the screen people sign in *at*, which is not
# the same as an account anybody has.
u alo-greeter 60990:60990 "alo OS sign-in" /var/lib/alo-greeter /usr/sbin/nologin

# The model service, and the group it is alone in (ADR 0025).
#
# The one thing on this machine that serves the model it arrived with runs as
# this login and no other. Not the person — it is up before anybody signs in and
# stays up after they sign out — and not the agent, which ADR 0001 §2 spends its
# length keeping authority away from: a process that can read every question put
# to this machine is the last one to lend that login anything.
#
# 60991 for 60989's and 60990's reason, measured rather than chosen: Fedora
# allocates system logins downward from 999, so every number in the ordinary
# system range is one a base update can take, and systemd's own uid range
# document leaves 60578-61183 allocated by nothing at all. The Containerfile
# asserts it the way it asserts the other four.
g alo-model 60991

# It signs in nowhere, owns nothing a person owns, and is never root. What it
# may reach off this machine is nothing, and that is in the unit rather than
# here, because it is the kernel that enforces it.
u alo-model 60991:60991 "alo OS model service" /var/lib/alo-model /usr/sbin/nologin
