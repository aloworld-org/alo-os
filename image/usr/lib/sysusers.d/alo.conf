# The two logins this machine has, and the group they meet in.
#
# They are here rather than in a `useradd` line in the Containerfile because the
# numbers are a contract: /etc/alo/agentd.toml names all three, and a machine
# whose accounts and whose description disagree is a machine where the kernel's
# answer about who is on the socket means something other than what the daemon
# thinks it means. `crates/alo-image` is what checks the two files against each
# other, and the Containerfile checks both against the base.
#
# ADR 0001 §5: the agent is a login of its own. That is the whole division —
# nothing on the wire says who a caller is, SO_PEERCRED does, and these numbers
# are what it is compared against.
#
# **The agent's number is not in the ordinary system range, and that was
# measured rather than chosen.** 989 was the number every document in this
# repository used as its example, and on the pinned base gid 989 is
# systemd-resolve's — so `systemd-sysusers` would have put alo OS's agent into
# the resolver's group without saying anything more than a line in a build log.
# Fedora allocates system logins downward from 999, so *every* number in that
# range is one a base update can take. systemd's own uid range document leaves
# 60578-61183 allocated by nothing at all, and that is where the agent goes:
# a number the base cannot move under us. docs/quirks.md has the measurement.

# The group the two meet in. The agent reaches the person's socket through it,
# and the loader hands it the one map a daemon may write.
g alo-agent 60989

# The agent. It signs in nowhere, owns nothing a person owns, and is never root.
u alo-agent 60989:60989 "alo OS agent" /var/lib/alo-agent /usr/sbin/nologin

# The person. On this image there is no screen to sign in at, so this is the
# login alo-agentd runs as rather than one anybody has logged into yet. 1000 is
# the first ordinary user on any Linux, which is the one number here that no
# system package will ever ask for.
u alo 1000 "alo OS" /home/alo /bin/bash

# And the person is in the agent's group, which is how the socket can be handed
# to it at all: changing a file's group is only allowed to a member of it.
m alo alo-agent
