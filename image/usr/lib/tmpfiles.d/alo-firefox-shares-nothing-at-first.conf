# Where Firefox from Flathub looks for the machine's own settings for it, and
# what it finds there: alo's, in which sharing data with Mozilla starts off.
#
# The owner, 2026-11-13: "Off by default". What is set, and why each is a
# default rather than a lock, is in /usr/share/alo/firefox/defaults/pref.
#
# **A Flatpak cannot read the host's /etc/firefox.** Mozilla's Flatpak build
# reads system-wide settings from an extension, `org.mozilla.firefox.systemconfig`,
# that nothing installs: an administrator makes the directory under the
# machine's flatpak installation and Firefox finds it as /app/etc/firefox
# (docs/quirks/flatpak-firefox-reads-system-settings-from-an-extension.md).
#
# **A link, and not the files themselves under /var**, because this is a bootc
# machine: what an image puts in /var is copied once, at install, and an update
# never changes it. The files live in /usr, which every update replaces, and
# this line points at them from where Firefox looks.
#
# **`L` and not `L+`**: if somebody — the person, or the organisation managing
# the machine (ADR 0016) — has put their own directory here, it is theirs, and
# this line leaves it alone.
#
# `x86_64` is the one architecture the image is built for, and `stable` is the
# branch Flathub publishes Firefox on. crates/alo-image holds both.
d /var/lib/flatpak/extension 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64 0755 root root -
L /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable - - - - /usr/share/alo/firefox
