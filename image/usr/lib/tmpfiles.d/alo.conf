# The two directories the image owes the agent service.
#
# Both exist because alo-agentd refuses to make them, and each refusal is a
# decision rather than an omission.

# ADR 0017. Every person's door goes in here, so the mode of it is a decision
# about a directory that is not any one person's — and a service that made it
# would be choosing that mode while running as one of them. 0755 root:root:
# anybody may walk through, nobody but root may put a name in it, and the
# per-person directory beneath is 0750, made by `RuntimeDirectory=` in
# alo-agentd.service because *nobody but root* includes the person's own daemon.
#
# The line stays even though `RuntimeDirectory=alo/1000` would create this
# directory on the way to making that one: what systemd creates on the way is
# 0755 root:root by its own default rather than by a decision, and this
# directory outlives any one unit — a machine with two people has two services
# and one of these.
d /run/alo 0755 root root -

# docs/contracts/machine-description.md: the record file is made if it is not
# there, and the folder holding it is not. A typo in the record path would
# otherwise become a second record nobody is reading. 0700 and the person's,
# because what an agent did on somebody's machine is theirs.
#
# Two files live here now, and the second is why 0700 matters twice:
# `grants.toml`, which is where this machine keeps what a person granted between
# one sign-in and the next (`crates/alo-remembering`). Whoever can write it says
# what this machine's agent may reach, so the daemon believes it only from root
# or from the person, refuses it if anybody else can write it, and refuses to
# serve at all rather than start under a list of grants it cannot read. The file
# itself is not made here either, for the record's reason: a machine on which
# nothing has been granted has no grants file, and that is not the same thing as
# an empty one.
d /var/lib/alo 0700 alo alo -
