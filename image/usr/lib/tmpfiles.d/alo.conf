# The two directories the image owes the agent service.
#
# Both exist because alo-agentd refuses to make them, and each refusal is a
# decision rather than an omission.

# ADR 0017. Every person's door goes in here, so the mode of it is a decision
# about a directory that is not any one person's — and a service that made it
# would be choosing that mode while running as one of them. 0755 root:root:
# anybody may walk through, nobody but root may put a name in it, and the
# per-person directory beneath is 0750 and made by the daemon.
d /run/alo 0755 root root -

# docs/contracts/machine-description.md: the record file is made if it is not
# there, and the folder holding it is not. A typo in the record path would
# otherwise become a second record nobody is reading. 0700 and the person's,
# because what an agent did on somebody's machine is theirs.
d /var/lib/alo 0700 alo alo -
